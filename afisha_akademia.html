<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Академія руху — Афіша</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .wrap {max-width:1200px; margin:0 auto; padding:24px 16px;}
    .h1 {font-size:clamp(28px,4vw,40px); font-weight:800; margin:0 0 16px;}
    .grid {display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px;}
    .card {background:#fff; border:1px solid #e5e7eb; border-radius:14px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.06);}
    .card img {display:block; width:100%; height:320px; object-fit:cover;}
    .card h3 {font-size:18px; font-weight:800; margin:10px 12px 12px;}
    .card a {display:block; color:inherit; text-decoration:none;}
    .empty {padding:24px; color:#6b7280;}
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="h1">Академія руху — Афіша</h1>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none">Наразі афіша порожня.</div>
  </main>

  <script>
    const GRID = document.getElementById('grid');
    const EMPTY = document.getElementById('empty');

    async function load() {
      try {
        const res = await fetch('/data/posters/akademia.json', {cache:'no-store'});
        if (!res.ok) throw new Error('not ok');
        const shows = await res.json();
        if (!Array.isArray(shows) || !shows.length) {
          EMPTY.style.display = 'block';
          return;
        }
        GRID.innerHTML = shows.map(s => {
          const poster = s.poster || `/images/posters/akademia/${s.slug}.jpg`;
          - const href = `/spectacles/akademia.html?show=${encodeURIComponent(s.slug)}`;
+ const href = `/show_akademia.html?show=${encodeURIComponent(s.slug)}`;

          return `
            <article class="card">
              <a href="${href}">
                <img loading="lazy" src="${poster}" alt="Постер: ${s.title||s.slug}">
                <h3>${s.title || s.slug}</h3>
              </a>
            </article>`;
        }).join('');
      } catch {
        EMPTY.style.display = 'block';
      }
    }
    load();
  </script>
</body>
</html>
