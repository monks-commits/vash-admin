<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вибір місць — Ваш Адмін</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background:#f4f4f6; }
    main { max-width:1100px; margin:0 auto; padding:24px 16px 56px; }

    .hall-box {
      background:#fff;
      border-radius:16px;
      padding:22px;
      margin-top:18px;
      overflow-x:auto;
    }

    .hall-row {
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:8px;
    }
    .row-label {
      width:28px;
      text-align:right;
      font-weight:600;
      color:#0f172a;
    }

    .row-seats {
      display:flex;
      gap:10px;
    }
    .side {
      display:flex;
      gap:6px;
    }
    .aisle {
      width:26px;
    }

    .seat {
      width:40px;
      height:40px;
      border-radius:10px;
      background:#fff;
      border:1px solid #d0d5dd;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:.12s;
      font-size:14px;
    }
    .seat:hover { background:#eff3ff; }
    .seat.selected {
      background:#155EEF;
      border-color:#155EEF;
      color:#fff;
      font-weight:600;
    }
    .seat.booked {
      background:#e2e8f0;
      border-color:#cbd5f5;
      color:#94a3b8;
      cursor:not-allowed;
    }

    .lozha-wrap {
      display:flex;
      gap:18px;
      margin-top:12px;
    }
    .lozha {
      background:#fff;
      border-radius:12px;
      padding:10px 16px;
      font-weight:500;
      border:1px dashed #d0d5dd;
    }

    .order-form {
      margin-top:20px;
      background:#fff;
      border-radius:16px;
      padding:22px;
    }
    .flex-row { display:flex; gap:14px; flex-wrap:wrap; }
    .form-group { flex:1 1 240px; display:flex; flex-direction:column; gap:6px; }
    .form-group input {
      height:44px;
      border:1px solid #d0d5dd;
      border-radius:10px;
      padding:0 12px;
    }
    .primary-btn {
      background:#155EEF;
      color:#fff;
      border:none;
      border-radius:999px;
      padding:11px 32px;
      font-weight:600;
      margin-top:14px;
      cursor:pointer;
    }
    .primary-btn:disabled {
      background:#94b2ff;
      cursor:not-allowed;
    }

    .small-muted { color:#6b7280; font-size:13px; margin-top:7px; }
  </style>
  <!-- supabase js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- подключаем общую шапку -->
  <div id="site-header"></div>

  <main>
    <h1>Вибір місць</h1>
    <p id="show-label">Вистава: —</p>

    <div class="hall-box" id="hall-box"></div>

    <div class="lozha-wrap">
      <div class="lozha">Ложа А (18 місць)</div>
      <div class="lozha">Ложа Б (18 місць)</div>
    </div>

    <div class="order-form">
      <h2>Дані покупця</h2>
      <div class="flex-row">
        <div class="form-group">
          <label for="buyer-name">Ім’я та прізвище</label>
          <input id="buyer-name" value="Олександр Рябов" />
        </div>
        <div class="form-group">
          <label for="buyer-phone">Телефон</label>
          <input id="buyer-phone" value="+380981261695" />
        </div>
      </div>
      <div class="form-group" style="margin-top:12px;">
        <label for="buyer-email">Електронна пошта (куди надійде PDF-квиток)</label>
        <input id="buyer-email" value="alexandrryabov@ukr.net" />
      </div>
      <p class="small-muted" style="margin-top:10px;">
        Вибрано місць: <span id="seat-count">0</span> •
        Сума: <span id="seat-sum">0</span> грн
      </p>
      <button id="to-checkout" class="primary-btn" disabled>Перейти до оплати</button>
      <p class="small-muted">Місця бронюються на 15 хвилин. Після цього вони знову стануть вільними.</p>
    </div>
  </main>

  <!-- общий подвал -->
  <div id="site-footer"></div>

  <!-- твой include (оставляем как есть) -->
  <script src="/vash-admin/scripts/include.js"></script>

  <script>
    // ====== 1. Supabase client ======
    // TODO: подставь свои значения из Settings → API
    const SUPABASE_URL = "https://yqhzekifwotizsmaeaf.supabase.co";
    const SUPABASE_ANON_KEY = "PASTE_YOUR_ANON_KEY_HERE";
    const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ====== 2. базовые ссылки на DOM ======
    const hallBox = document.getElementById("hall-box");
    const seatCountEl = document.getElementById("seat-count");
    const seatSumEl = document.getElementById("seat-sum");
    const btnCheckout = document.getElementById("to-checkout");

    const params = new URLSearchParams(location.search);
    const showSlug = params.get("show") || "shevchenko/ledi";
    document.getElementById("show-label").textContent =
      "Вистава: " + showSlug.replace("/", " — ");

    // ====== 3. схема залу (18 рядів, по 10 + прохід + 10) ======
    const ROWS = 18;
    const LEFT_SEATS = 10;
    const RIGHT_SEATS = 10;

    // Ціни ти вже міняв — залишу так само, щоб не зламати
    function priceForRow(row) {
      if (row <= 5) return 220;
      if (row <= 10) return 170;
      if (row <= 15) return 140;
      return 100;
    }

    // тут будемо зберігати обрані
    const selected = new Map(); // seatId -> price
    // і вже заброньовані в бд
    const bookedNow = new Set();

    // ====== 4. вивід залу ======
    async function renderHall() {
      hallBox.innerHTML = "";
      // витягуємо актуальні броні по цьому шоу
      const { data: busy } = await supa
        .from("bookings")
        .select("seat_id, expires_at")
        .eq("show_slug", showSlug)
        .gt("expires_at", new Date().toISOString()); // тільки не прострочені

      const busySet = new Set((busy || []).map(b => b.seat_id));

      for (let r = 1; r <= ROWS; r++) {
        const rowEl = document.createElement("div");
        rowEl.className = "hall-row";

        const label = document.createElement("div");
        label.className = "row-label";
        label.textContent = r;
        rowEl.appendChild(label);

        const seatsWrap = document.createElement("div");
        seatsWrap.className = "row-seats";

        const leftSide = document.createElement("div");
        leftSide.className = "side";
        for (let s = 1; s <= LEFT_SEATS; s++) {
          const seatId = `P${r}-M${s}`;
          const seatEl = makeSeat(seatId, r, busySet);
          leftSide.appendChild(seatEl);
        }

        const aisle = document.createElement("div");
        aisle.className = "aisle";

        const rightSide = document.createElement("div");
        rightSide.className = "side";
        for (let s = LEFT_SEATS + 1; s <= LEFT_SEATS + RIGHT_SEATS; s++) {
          const seatId = `P${r}-M${s}`;
          const seatEl = makeSeat(seatId, r, busySet);
          rightSide.appendChild(seatEl);
        }

        seatsWrap.appendChild(leftSide);
        seatsWrap.appendChild(aisle);
        seatsWrap.appendChild(rightSide);
        rowEl.appendChild(seatsWrap);
        hallBox.appendChild(rowEl);
      }
    }

    function makeSeat(seatId, row, busySet) {
      const el = document.createElement("div");
      el.className = "seat";
      el.textContent = seatId.split("M")[1]; // просто номер
      el.dataset.seatId = seatId;
      el.dataset.row = row;
      const price = priceForRow(row);
      el.title = `Ряд ${row}, місце ${seatId.split("M")[1]} — ${price} грн`;

      if (busySet.has(seatId)) {
        el.classList.add("booked");
      } else {
        el.addEventListener("click", () => toggleSeat(el, price));
      }

      return el;
    }

    async function toggleSeat(el, price) {
      const seatId = el.dataset.seatId;
      // уже выбрано → снимаем и удаляем бронь
      if (selected.has(seatId)) {
        // удаляем из бд
        await supa
          .from("bookings")
          .delete()
          .eq("show_slug", showSlug)
          .eq("seat_id", seatId);
        selected.delete(seatId);
        el.classList.remove("selected");
        updateSummary();
        return;
      }

      // не выбрано → сначала пытаемся забронировать в бд
      const name = document.getElementById("buyer-name").value.trim();
      const phone = document.getElementById("buyer-phone").value.trim();

      const { error } = await supa.from("bookings").insert({
        show_slug: showSlug,
        seat_id: seatId,
        buyer_name: name || null,
        buyer_phone: phone || null,
        // на 15 хв вперёд
        expires_at: new Date(Date.now() + 15 * 60 * 1000).toISOString()
      });

      if (error) {
        alert("Це місце вже щойно забрали. Онови сторінку.");
        // перерисуем зал
        renderHall();
        return;
      }

      // в ui
      selected.set(seatId, price);
      el.classList.add("selected");
      updateSummary();
    }

    function updateSummary() {
      const ids = Array.from(selected.keys());
      seatCountEl.textContent = ids.length;
      const sum = ids.reduce((acc, id) => acc + (selected.get(id) || 0), 0);
      seatSumEl.textContent = sum;
      btnCheckout.disabled = ids.length === 0;
    }

    // ====== 5. переход на checkout ======
    btnCheckout.addEventListener("click", () => {
      const ids = Array.from(selected.keys());
      const sum = ids.reduce((acc, id) => acc + (selected.get(id) || 0), 0);
      const name = document.getElementById("buyer-name").value.trim();
      const phone = document.getElementById("buyer-phone").value.trim();
      const email = document.getElementById("buyer-email").value.trim();

      // тут порядок важен – то же самое ты читаешь в checkout.html
      const orderId = "SHEV-" + Date.now();

      const url = new URL(location.origin + "/checkout.html");
      url.searchParams.set("show", showSlug);
      url.searchParams.set("seats", ids.join(","));
      url.searchParams.set("amount", String(sum));
      url.searchParams.set("order_id", orderId);
      url.searchParams.set("name", encodeURIComponent(name));
      url.searchParams.set("phone", encodeURIComponent(phone));
      url.searchParams.set("email", encodeURIComponent(email));

      location.href = url.toString();
    });

    // старт
    renderHall();
  </script>
</body>
</html>
