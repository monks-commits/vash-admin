<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вибір місць — Ваш Адмін</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background:#f4f4f6; }
    main { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
    .hall-wrap { background:#fff; border-radius:14px; padding:26px; margin-bottom:26px; }
    .row-line { display:flex; align-items:center; gap:14px; margin-bottom:8px; }
    .row-label { width:24px; text-align:right; font-weight:600; color:#0f172a; }
    .seats-line { display:flex; gap:6px; }
    .gap { width:46px; }
    .seat {
      width:38px; height:38px; border-radius:10px;
      background:#fff; border:1px solid #d0d5dd;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:.15s; font-size:14px;
    }
    .seat:hover { background:#e5edff; }
    .seat.selected { background:#1d4ed8; color:#fff; border-color:#1d4ed8; }
    .seat.booked { background:#e2e8f0; color:#94a3b8; border-style:dashed; cursor:not-allowed; }
    .legend { margin-top:6px; font-size:13px; color:#64748b; }
    .order-form { background:#fff; border-radius:14px; padding:26px; }
    .flex-row { display:flex; gap:16px; flex-wrap:wrap; }
    .form-group { flex:1 1 240px; display:flex; flex-direction:column; gap:6px; }
    .form-group input {
      height:44px; border:1px solid #d0d5dd; border-radius:10px;
      padding:0 12px; font-size:15px;
    }
    .primary-btn {
      background:#155EEF; color:#fff; border:none;
      border-radius:999px; padding:11px 30px;
      font-size:15px; font-weight:600; cursor:pointer;
    }
    .primary-btn:disabled { background:#95b5ff; cursor:not-allowed; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <h1>Вибір місць</h1>
    <p id="show-label">Вистава: —</p>

    <div class="hall-wrap" id="hall"></div>
    <p class="legend">Натисніть на місце, щоб додати в замовлення. Сірі місця — вже заброньовані іншими.</p>

    <div class="order-form">
      <h2>Дані покупця</h2>
      <div class="flex-row">
        <div class="form-group">
          <label for="buyer-name">Ім’я та прізвище</label>
          <input id="buyer-name" value="Олександр Рябов" />
        </div>
        <div class="form-group">
          <label for="buyer-phone">Телефон</label>
          <input id="buyer-phone" value="+380981261695" />
        </div>
      </div>
      <div class="form-group" style="margin-top:14px;">
        <label for="buyer-email">Електронна пошта (куди надійде PDF-квиток)</label>
        <input id="buyer-email" value="alexandrryabov@ukr.net" />
      </div>
      <p style="margin-top:14px;">
        Вибрано місць: <span id="seat-count">0</span> •
        Сума: <span id="seat-sum">0</span> грн
      </p>
      <button id="to-checkout" class="primary-btn" disabled>Перейти до оплати</button>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/scripts/include.js"></script>
  <script type="module">
    // ====== НАСТРОЙКИ ======
    const SUPABASE_URL = "https://hkeuabtiemsxadusmqlo.supabase.co";   // поставь свой
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrZXVhYnRpZW1zeGFkdXNtcWxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2MDE3MzcsImV4cCI6MjA3NjE3NzczN30.aOHorW8nvctPxC1If_HNTl6iq_7cDHzFgFEPJg3PPPE";                // поставь свой

    // схема залу (18 рядів по 20 місць, 10 + прохід + 10)
    const ROWS = 18;
    const LEFT = 10;
    const RIGHT = 10;

    // ціни по рядам — можеш поміняти
    const PRICE_BY_ROW = {
      1: 220, 2: 220, 3: 220, 4: 200, 5: 200,
      6: 180, 7: 180, 8: 160, 9: 150, 10: 140,
      11: 140, 12: 120, 13: 120, 14: 100, 15: 100,
      16: 90, 17: 80, 18: 70,
    };

    const hallEl = document.getElementById("hall");
    const params = new URLSearchParams(location.search);
    const showSlug = params.get("show") || "shevchenko/ledi";
    document.getElementById("show-label").textContent = "Вистава: " + showSlug.replace("/", " / ");

    const selected = new Set();
    const seatCountEl = document.getElementById("seat-count");
    const seatSumEl = document.getElementById("seat-sum");
    const toCheckoutBtn = document.getElementById("to-checkout");

    // берём текущие брони из Supabase
    async function loadBookings() {
      try {
        const resp = await fetch(
          `${SUPABASE_URL}/rest/v1/bookings?show_slug=eq.${encodeURIComponent(showSlug)}&select=seat_id,expires_at`,
          {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            },
          }
        );
        const data = await resp.json();
        const now = new Date();
        // оставляем только не просроченные
        return data
          .filter(b => !b.expires_at || new Date(b.expires_at) > now)
          .map(b => b.seat_id);
      } catch (e) {
        console.log("bookings load error", e);
        return [];
      }
    }

    function renderHall(blockedSeats = []) {
      hallEl.innerHTML = "";
      for (let r = 1; r <= ROWS; r++) {
        const rowDiv = document.createElement("div");
        rowDiv.className = "row-line";

        const label = document.createElement("div");
        label.className = "row-label";
        label.textContent = r;
        rowDiv.appendChild(label);

        const seatsLine = document.createElement("div");
        seatsLine.className = "seats-line";

        // левая десятка
        for (let c = 1; c <= LEFT; c++) {
          const seatId = `P${r}-M${c}`;
          const div = document.createElement("div");
          div.className = "seat";
          if (blockedSeats.includes(seatId)) {
            div.classList.add("booked");
          }
          div.textContent = c;
          div.title = `Ряд ${r}, місце ${c} — ${PRICE_BY_ROW[r] || 0} грн`;
          div.dataset.id = seatId;
          div.dataset.row = r;
          div.dataset.price = PRICE_BY_ROW[r] || 0;
          seatsLine.appendChild(div);
        }

        // прохід
        const gap = document.createElement("div");
        gap.className = "gap";
        seatsLine.appendChild(gap);

        // правая десятка
        for (let c = 11; c <= 10 + RIGHT; c++) {
          const seatId = `P${r}-M${c}`;
          const div = document.createElement("div");
          div.className = "seat";
          if (blockedSeats.includes(seatId)) {
            div.classList.add("booked");
          }
          div.textContent = c;
          div.title = `Ряд ${r}, місце ${c} — ${PRICE_BY_ROW[r] || 0} грн`;
          div.dataset.id = seatId;
          div.dataset.row = r;
          div.dataset.price = PRICE_BY_ROW[r] || 0;
          seatsLine.appendChild(div);
        }

        rowDiv.appendChild(seatsLine);
        hallEl.appendChild(rowDiv);
      }
    }

    function updateSummary() {
      const ids = Array.from(selected);
      seatCountEl.textContent = ids.length;
      const sum = ids.reduce((acc, id) => {
        const rowNum = Number(id.split("-")[0].substring(1));
        return acc + (PRICE_BY_ROW[rowNum] || 0);
      }, 0);
      seatSumEl.textContent = sum;
      toCheckoutBtn.disabled = ids.length === 0;
    }

    hallEl.addEventListener("click", (e) => {
      const el = e.target.closest(".seat");
      if (!el) return;
      if (el.classList.contains("booked")) return;

      const id = el.dataset.id;
      if (selected.has(id)) {
        selected.delete(id);
        el.classList.remove("selected");
      } else {
        selected.add(id);
        el.classList.add("selected");
      }
      updateSummary();
    });

    toCheckoutBtn.addEventListener("click", () => {
      const ids = Array.from(selected);
      const sum = Number(seatSumEl.textContent) || 0;

      const name  = document.getElementById("buyer-name").value.trim();
      const phone = document.getElementById("buyer-phone").value.trim();
      const email = document.getElementById("buyer-email").value.trim();

      const orderId = "SHEV-" + Date.now();

      const url = new URL(location.origin + "/checkout.html");
      url.searchParams.set("show", showSlug);
      url.searchParams.set("seats", ids.join(","));
      url.searchParams.set("amount", String(sum));
      url.searchParams.set("order_id", orderId);
      // эти три пусть тоже поедут
      url.searchParams.set("name", encodeURIComponent(name));
      url.searchParams.set("phone", encodeURIComponent(phone));
      url.searchParams.set("email", encodeURIComponent(email));

      location.href = url.toString();
    });

    // загрузка и отрисовка
    (async () => {
      const blocked = await loadBookings();
      renderHall(blocked);
    })();
  </script>
</body>
</html>
