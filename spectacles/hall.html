<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вибір місць — Ваш Адмін</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background:#f4f4f6; }
    main { max-width:1100px; margin:0 auto; padding:24px 16px 50px; }
    .hall-wrap { background:#fff; border-radius:14px; padding:26px; margin-bottom:26px; }

    .hall-grid { display:flex; gap:40px; overflow-x:auto; }
    .hall-col { display:flex; flex-direction:column; gap:8px; }

    .row-line {
      display:flex;
      gap:10px;
      align-items:center;
    }
    .row-label {
      width:30px;
      text-align:right;
      font-weight:600;
      color:#0f172a;
    }
    .seats-row { display:flex; gap:8px; }

    .seat {
      width:42px; height:42px; border-radius:10px;
      background:#fff; border:1px solid #d0d5dd;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:.15s;
    }
    .seat:hover { background:#e5edff; }
    .seat.selected { background:#1d4ed8; color:#fff; border-color:#1d4ed8; }
    .seat.taken { background:#f3f4f6; color:#94a3b8; border-color:#e2e8f0; cursor:not-allowed; }

    .gap { width:26px; }

    .info-box {
      margin-top:12px;
      background:#eff6ff;
      border:1px solid #dbeafe;
      border-radius:10px;
      padding:10px 12px;
      font-size:14px;
      color:#0f172a;
    }

    .lodge-row {
      display:flex;
      gap:14px;
      margin-top:18px;
    }
    .lodge {
      background:#fff;
      border:1px dashed #d0d5dd;
      border-radius:9px;
      padding:6px 12px;
      font-size:14px;
      color:#0f172a;
    }

    .order-form { background:#fff; border-radius:14px; padding:26px; }
    .flex-row { display:flex; gap:16px; flex-wrap:wrap; }
    .form-group { flex:1 1 240px; display:flex; flex-direction:column; gap:6px; }
    .form-group input {
      height:44px; border:1px solid #d0d5dd; border-radius:10px;
      padding:0 12px; font-size:15px;
    }
    .primary-btn {
      background:#155EEF; color:#fff; border:none;
      border-radius:999px; padding:11px 30px;
      font-size:15px; font-weight:600; cursor:pointer;
    }
    .primary-btn:disabled { background:#95b5ff; cursor:not-allowed; }
  </style>

  <!-- supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- шапка -->
  <div id="site-header"></div>

  <main>
    <h1>Вибір місць</h1>
    <p id="show-label">Вистава: —</p>

    <div class="hall-wrap">
      <div class="hall-grid" id="hall-grid"></div>

      <div class="lodge-row">
        <div class="lodge">Ложа А (18 місць)</div>
        <div class="lodge">Ложа Б (18 місць)</div>
      </div>

      <div id="seat-info" class="info-box">
        Натисніть на місце, щоб побачити ряд, місце та ціну.
      </div>
    </div>

    <div class="order-form" id="buyer-form">
      <h2>Дані покупця</h2>
      <div class="flex-row">
        <div class="form-group">
          <label for="buyer-name">Ім’я та прізвище</label>
          <input id="buyer-name" value="Олександр Рябов" />
        </div>
        <div class="form-group">
          <label for="buyer-phone">Телефон</label>
          <input id="buyer-phone" value="+380981261695" />
        </div>
      </div>
      <div class="form-group" style="margin-top:14px;">
        <label for="buyer-email">Електронна пошта (куди надійде PDF-квиток)</label>
        <input id="buyer-email" value="alexandrryabov@ukr.net" />
      </div>
      <p style="margin-top:14px;">
        Вибрано місць: <span id="seat-count">0</span> •
        Сума: <span id="seat-sum">0</span> грн
      </p>
      <button id="to-checkout" class="primary-btn" disabled>Перейти до оплати</button>
    </div>
  </main>

  <!-- подвал -->
  <div id="site-footer"></div>

  <!-- include из корня -->
  <script src="/scripts/include.js"></script>

  <script>
    // ===== 0. Конфіг Supabase =====
    // вставь свои значения:
    const SUPABASE_URL = "https://yqhzekifwotizsmaeaf.supabase.co";  // у тебя такой
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrZXVhYnRpZW1zeGFkdXNtcWxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2MDE3MzcsImV4cCI6MjA3NjE3NzczN30.aOHorW8nvctPxC1If_HNTl6iq_7cDHzFgFEPJg3PPPE";
    const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ===== 1. Параметри вистави =====
    const params = new URLSearchParams(location.search);
    const showSlug = params.get("show") || "shevchenko/ledi";
    document.getElementById("show-label").textContent =
      "Вистава: " + showSlug.replace("/", " — ");

    // ===== 2. Модель зала =====
    const ROWS = 18;
    const LEFT = 10;
    const RIGHT = 10;

    // твои цены можно менять тут
    const rowPrices = {
      1: 220, 2: 220, 3: 220,
      4: 200, 5: 200, 6: 200,
      7: 180, 8: 180, 9: 180,
      10: 150, 11: 150, 12: 150,
      13: 120, 14: 120, 15: 100,
      16: 100, 17: 90, 18: 70,
    };

    const hallGrid = document.getElementById("hall-grid");
    const seatInfo = document.getElementById("seat-info");
    const selected = new Set();
    const seatCountEl = document.getElementById("seat-count");
    const seatSumEl = document.getElementById("seat-sum");
    const btn = document.getElementById("to-checkout");

    // ===== 3. Рендер зала =====
    function renderHall(taken = new Set()) {
      hallGrid.innerHTML = "";
      const col = document.createElement("div");
      col.className = "hall-col";

      for (let r = 1; r <= ROWS; r++) {
        const line = document.createElement("div");
        line.className = "row-line";

        const lbl = document.createElement("div");
        lbl.className = "row-label";
        lbl.textContent = r;
        line.appendChild(lbl);

        const rowBox = document.createElement("div");
        rowBox.className = "seats-row";

        // левая десятка
        for (let s = 1; s <= LEFT; s++) {
          rowBox.appendChild(makeSeat(r, s, taken));
        }

        // проход
        const gap = document.createElement("div");
        gap.className = "gap";
        rowBox.appendChild(gap);

        // правая десятка (11..20)
        for (let s = 11; s <= 10 + RIGHT; s++) {
          rowBox.appendChild(makeSeat(r, s, taken));
        }

        line.appendChild(rowBox);
        col.appendChild(line);
      }

      hallGrid.appendChild(col);
    }

    function makeSeat(row, seatNum, takenSet) {
      const id = `P${row}-M${seatNum}`;
      const div = document.createElement("div");
      div.className = "seat";
      div.textContent = seatNum;
      div.title = `Ряд ${row}, місце ${seatNum} — ${rowPrices[row] || 0} грн`;
      div.dataset.seatId = id;
      div.dataset.row = row;
      div.dataset.price = rowPrices[row] || 0;

      if (takenSet.has(id)) {
        div.classList.add("taken");
      } else {
        div.addEventListener("click", () => toggleSeat(div));
      }

      return div;
    }

    function toggleSeat(el) {
      if (el.classList.contains("taken")) {
        alert("Це місце вже щойно забрали. Оновіть сторінку.");
        return;
      }
      const seatId = el.dataset.seatId;
      const row = Number(el.dataset.row);
      const price = Number(el.dataset.price);
      const seatNum = el.textContent.trim();

      if (selected.has(seatId)) {
        selected.delete(seatId);
        el.classList.remove("selected");
        seatInfo.textContent = "Місце знято з вибору.";
      } else {
        selected.add(seatId);
        el.classList.add("selected");
        seatInfo.textContent = `Обрано: ряд ${row}, місце ${seatNum}, ціна ${price} грн.`;
      }
      recalc();
    }

    function recalc() {
      const ids = Array.from(selected);
      seatCountEl.textContent = ids.length;
      const sum = ids.reduce((acc, seatId) => {
        const rowStr = seatId.split("-")[0].replace("P", "");
        const row = Number(rowStr);
        return acc + (rowPrices[row] || 0);
      }, 0);
      seatSumEl.textContent = sum;
      btn.disabled = ids.length === 0;
    }

    // ===== 4. тянем актуальные брони =====
    async function loadTaken() {
      try {
        const nowIso = new Date().toISOString();
        const { data, error } = await supa
          .from("bookings")
          .select("seat_id")
          .eq("show_slug", showSlug)
          .gt("expires_at", nowIso);

        if (error) {
          console.warn("bookings error", error);
          renderHall(new Set());
          return;
        }

        const takenSet = new Set((data || []).map(r => r.seat_id));
        renderHall(takenSet);
      } catch (e) {
        console.warn(e);
        renderHall(new Set());
      }
    }

    // обновляем забронированные каждые 15 сек
    setInterval(loadTaken, 15000);

    // ===== 5. переход на checkout =====
    btn.addEventListener("click", () => {
      const ids = Array.from(selected);
      const sum = Number(seatSumEl.textContent) || 0;
      const name  = document.getElementById("buyer-name").value.trim();
      const phone = document.getElementById("buyer-phone").value.trim();
      const email = document.getElementById("buyer-email").value.trim();
      const orderId = "SHEV-" + Date.now();

      const url = new URL(location.origin + "/checkout.html");
      url.searchParams.set("show", showSlug);
      url.searchParams.set("seats", ids.join(","));
      url.searchParams.set("amount", String(sum));
      url.searchParams.set("order_id", orderId);
      url.searchParams.set("name", encodeURIComponent(name));
      url.searchParams.set("phone", encodeURIComponent(phone));
      url.searchParams.set("email", encodeURIComponent(email));

      location.href = url.toString();
    });

    // стартуем
    loadTaken();
  </script>
</body>
</html>
