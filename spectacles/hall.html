<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вибір місць — Ваш Адмін</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background:#f4f4f6; }
    main { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }

    /* Карточка со схемой */
    .hall-card{background:#fff;border-radius:14px;padding:18px 18px 22px;border:1px solid #e5e7eb}

    /* Гор. скролл на мобиле */
    .hall-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .hall-inner{display:block;min-width:max-content}

    /* Один ряд */
    .hall-row{display:flex;align-items:center;gap:8px;margin:6px 0}
    .row-label{flex:0 0 28px;text-align:right;font-size:12px;color:#475569}

    /* место */
    .seat{
      width:40px;height:40px;border-radius:10px;
      background:#fff;border:1px solid #d0d5dd;
      display:flex;align-items:center;justify-content:center;
      font-size:14px;cursor:pointer;transition:.15s;
    }
    .seat:hover{background:#e5edff}
    .seat.selected{background:#155EEF;color:#fff;border-color:#155EEF}
    .seat.disabled{background:#e2e8f0;border-color:#e2e8f0;color:#64748b;cursor:not-allowed}

    /* проход после 10-го */
    .pass-gap{width:36px;height:1px}

    /* подпись цены под рядом */
    .row-price{
      margin:-2px 0 10px 28px; /* выравниваем под сеткой, с учётом .row-label */
      font-size:12px;color:#475569;
    }

    /* форма заказа */
    .order-card{background:#fff;border-radius:14px;padding:22px;border:1px solid #e5e7eb}
    .flex{display:flex;gap:14px;flex-wrap:wrap}
    .fg{flex:1 1 240px;display:flex;flex-direction:column;gap:6px}
    .fg input{
      height:44px;border:1px solid #d0d5dd;border-radius:10px;padding:0 12px;font-size:15px
    }
    .btn-primary{
      background:#155EEF;color:#fff;border:none;border-radius:999px;
      padding:11px 26px;font-weight:600;cursor:pointer
    }
    .btn-primary:disabled{background:#95b5ff;cursor:not-allowed}

    /* бейджи лож */
    .badge{display:inline-block;background:#e2e8f0;border-radius:999px;padding:6px 14px;margin-right:8px;margin-top:8px;font-size:12px;color:#0f172a}

    /* адаптив: чуть меньше сиденья на узких экранах */
    @media (max-width:480px){
      .seat{width:34px;height:34px;font-size:13px}
      .pass-gap{width:24px}
    }
  </style>

  <!-- Supabase только для брони; можно оставить -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- общий хедер -->
  <div id="site-header"></div>

  <main>
    <h1>Вибір місць</h1>
    <p id="show-label" class="meta" style="margin-bottom:12px;">Вистава: —</p>

    <section class="hall-card">
      <div class="hall-scroll">
        <div class="hall-inner" id="hall"></div>
      </div>

      <!-- подписи лож (просто текст) -->
      <div>
        <span class="badge">Ложа А (18 місць)</span>
        <span class="badge">Ложа Б (18 місць)</span>
      </div>
    </section>

    <section class="order-card">
      <h2 style="margin:0 0 10px">Дані покупця</h2>
      <div class="flex">
        <div class="fg">
          <label for="buyer-name">Ім’я та прізвище</label>
          <input id="buyer-name" placeholder="Ваше ім’я та прізвище" value="Олександр Рябов" />
        </div>
        <div class="fg">
          <label for="buyer-phone">Телефон</label>
          <input id="buyer-phone" placeholder="+380..." value="+380981261695" />
        </div>
      </div>
      <div class="fg" style="margin-top:12px">
        <label for="buyer-email">Електронна пошта (куди надійде PDF-квиток)</label>
        <input id="buyer-email" placeholder="you@example.com" value="alexandrryabov@ukr.net" />
      </div>

      <p style="margin-top:12px">
        Вибрано місць: <b id="seat-count">0</b> • Сума: <b id="seat-sum">0</b> грн
      </p>
      <button id="to-checkout" class="btn-primary" disabled>Перейти до оплати</button>
      <p class="meta" style="margin-top:8px">Сірі місця — вже заброньовані іншими.</p>
    </section>
  </main>

  <!-- общий футер -->
  <div id="site-footer"></div>

  <!-- инклюд шапки/подвала -->
  <script src="/scripts/include.js"></script>

  <script>
    // ---------- 0) Параметры ----------
    const params   = new URLSearchParams(location.search);
    const showSlug = params.get("show") || "shevchenko/ledi";
    document.getElementById("show-label").textContent = "Вистава: " + showSlug.replace("/", " — ");

    // ---------- 1) Конфигурация зала ----------
    const ROWS = 18;
    const SEATS_PER_ROW = 20;
    const PASS_AFTER = 10; // проход после 10-го

    // ---------- 2) Цены по рядам (правь спокойно числа) ----------
    function priceForRow(row){
      if (row === 1)  return 200;
      if (row === 2)  return 200;
      if (row === 3)  return 200;
      if (row === 4)  return 180;
      if (row === 5)  return 180;
      if (row === 6)  return 180;
      if (row === 7)  return 170;
      if (row === 8)  return 170;
      if (row === 9)  return 160;
      if (row === 10) return 160;
      if (row === 11) return 140;
      if (row === 12) return 140;
      if (row === 13) return 120;
      if (row === 14) return 120;
      if (row === 15) return 100;
      if (row === 16) return 100;
      if (row === 17) return 70;
      if (row === 18) return 70;
      return 0;
    }

    // ---------- 3) Все места ----------
    const ALL_SEATS = [];
    for (let r=1; r<=ROWS; r++){
      for (let s=1; s<=SEATS_PER_ROW; s++){
        ALL_SEATS.push({ id:`P${r}-M${s}`, row:r, seat:s, price:priceForRow(r) });
      }
    }

    // ---------- 4) Рендер ----------
    const hallEl = document.getElementById("hall");
    const selected = new Set();
    const seatCountEl = document.getElementById("seat-count");
    const seatSumEl   = document.getElementById("seat-sum");
    const btnCheckout = document.getElementById("to-checkout");

    let busySeats = new Set(); // из Supabase броней

    function renderHall(){
      hallEl.innerHTML = "";

      for (let r=1; r<=ROWS; r++){
        // ряд с местами
        const rowEl = document.createElement("div");
        rowEl.className = "hall-row";

        const lbl = document.createElement("div");
        lbl.className = "row-label";
        lbl.textContent = r;
        rowEl.appendChild(lbl);

        for (let s=1; s<=SEATS_PER_ROW; s++){
          if (s === PASS_AFTER + 1){
            const gap = document.createElement("div");
            gap.className = "pass-gap";
            rowEl.appendChild(gap);
          }

          const id = `P${r}-M${s}`;
          const seat = ALL_SEATS.find(x=>x.id===id);

          const el = document.createElement("div");
          el.className = "seat";
          el.textContent = s;
          el.title = `Ряд ${r}, місце ${s} — ${seat.price} грн`;

          if (busySeats.has(id)){
            el.classList.add("disabled");
          } else {
            el.addEventListener("click", ()=>{
              if (selected.has(id)){
                selected.delete(id);
                el.classList.remove("selected");
              } else {
                selected.add(id);
                el.classList.add("selected");
              }
              updateSummary();
            });
          }
          rowEl.appendChild(el);
        }

        hallEl.appendChild(rowEl);

        // подпись цены под рядом
        const priceLine = document.createElement("div");
        priceLine.className = "row-price";
        priceLine.textContent = `Ряд ${r} • ${priceForRow(r)} грн`;
        hallEl.appendChild(priceLine);
      }
    }

    function updateSummary(){
      const ids = Array.from(selected);
      seatCountEl.textContent = ids.length;
      const sum = ids.reduce((acc,id)=>{
        const s = ALL_SEATS.find(x=>x.id===id);
        return acc + (s ? s.price : 0);
      }, 0);
      seatSumEl.textContent = sum;
      btnCheckout.disabled = ids.length === 0;
    }

    // ---------- 5) Подтягиваем бронь из Supabase (необязательно, но полезно) ----------
    (async function loadBookings(){
      const SUPABASE_URL = "https://yqhzekifwxotizsmaeaf.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_z1h_G-7K7HGCjOUtRZpI9Q_o1m9inZM";
      try{
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await sb
          .from("bookings")
          .select("seat_id")
          .eq("show_slug", showSlug)
          .gte("expires_at", new Date().toISOString());

        if (!error && Array.isArray(data)){
          busySeats = new Set(data.map(r=>r.seat_id));
        }
      }catch(e){
        console.warn("Броні не підвантажені:", e.message);
      }finally{
        renderHall();
      }
    })();

    // ---------- 6) Переход к оплате ----------
    btnCheckout.addEventListener("click", ()=>{
      const ids = Array.from(selected);
      const sum = Number(seatSumEl.textContent) || 0;

      const name  = document.getElementById("buyer-name").value.trim();
      const phone = document.getElementById("buyer-phone").value.trim();
      const email = document.getElementById("buyer-email").value.trim();

      const orderId = "SHEV-" + Date.now();

      const url = new URL(location.origin + "/checkout.html");
      url.searchParams.set("show",   showSlug);
      url.searchParams.set("seats",  ids.join(","));
      url.searchParams.set("amount", String(sum));
      url.searchParams.set("order_id", orderId);

      // ВАЖНО: без ручного encodeURIComponent
      if (name)  url.searchParams.set("name",  name);
      if (phone) url.searchParams.set("phone", phone);
      if (email) url.searchParams.set("email", email);

      location.href = url.toString();
    });
  </script>
</body>
</html>
