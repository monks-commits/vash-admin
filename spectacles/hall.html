<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вибір місць — Ваш Адмін</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background:#f4f4f6; }
    main { max-width:1100px; margin:0 auto; padding:24px 16px 50px; }

    .hall-wrap { background:#fff; border-radius:14px; padding:22px; margin-bottom:24px; }
    .hall-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:nowrap; }
    .row-label { width:26px; text-align:right; font-size:12px; color:#475569; flex:0 0 26px; }

    .seat {
      width:36px; height:36px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      border:1px solid #d0d5dd; background:#fff; color:#0f172a;
      font-size:13px; user-select:none; transition:.15s; cursor:pointer;
      box-sizing:border-box;
    }
    .seat.available { background:#fde68a; border-color:#fbbf24; }
    .seat.available:hover { filter:brightness(0.97); }
    .seat.selected  { background:#ef4444; border-color:#ef4444; color:#fff; }
    .seat.sold      { background:#22c55e; border-color:#16a34a; color:#fff; cursor:not-allowed; }
    .seat.disabled  { background:#eceff3; border-color:#e3e8ef; color:#94a3b8; cursor:not-allowed; }

    .pass-gap { width:36px; height:1px; flex:0 0 36px; } /* центральний прохід */
    .pad-gap  { width:36px; height:1px; flex:0 0 36px; } /* «порожня» клітинка для зсуву ряду */

    .row-sep      { height:18px; }        /* звичайний вертикальний інтервал */
    .row-big-sep  { height:34px; }        /* великий прохід (між 17 і 18 для Академії) */

    .order-form { background:#fff; border-radius:14px; padding:22px; }
    .flex-row { display:flex; gap:12px; flex-wrap:wrap; }
    .form-group { flex:1 1 240px; display:flex; flex-direction:column; gap:6px; }
    .form-group input { height:44px; border:1px solid #d0d5dd; border-radius:10px; padding:0 12px; font-size:15px; }
    .primary-btn { background:#155EEF; color:#fff; border:none; border-radius:999px; padding:11px 30px; font-size:15px; font-weight:600; cursor:pointer; }
    .primary-btn:disabled { background:#95b5ff; cursor:not-allowed; }
    .muted { color:#64748b; font-size:13px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- header -->
  <div id="site-header"></div>

  <main>
    <h1>Вибір місць</h1>
    <p id="show-label" class="muted" style="margin-bottom:14px;">Вистава: —</p>

    <div class="hall-wrap">
      <div id="hall"></div>
    </div>

    <div class="order-form" id="buyer-form">
      <h2>Дані покупця</h2>
      <div class="flex-row">
        <div class="form-group">
          <label for="buyer-name">Ім’я та прізвище</label>
          <input id="buyer-name" placeholder="Ваше ім’я та прізвище" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="buyer-phone">Телефон</label>
          <input id="buyer-phone" placeholder="+380..." inputmode="tel" autocomplete="tel" />
        </div>
      </div>
      <div class="form-group" style="margin-top:14px;">
        <label for="buyer-email">Електронна пошта (куди надійде PDF-квиток)</label>
        <input id="buyer-email" placeholder="you@example.com" inputmode="email" autocomplete="email" />
      </div>

      <p style="margin-top:14px;">
        Вибрано місць: <span id="seat-count">0</span> • Сума: <span id="seat-sum">0</span> грн
      </p>
      <button id="to-checkout" class="primary-btn" disabled>Перейти до оплати</button>
      <p class="muted" style="margin-top:10px;">
        Геометрія залу автоматично підлаштовується під театр (Шевченко / Академія).
      </p>
    </div>
  </main>

  <!-- footer -->
  <div id="site-footer"></div>
  <script src="/scripts/include.js"></script>

  <script>
    // =========== ПАРАМЕТРИ ===========

    const params   = new URLSearchParams(location.search);
    const theatre  = (params.get("theatre") || "akademia").toLowerCase(); // default: Академія
    const showSlug = params.get("show") || (theatre === "shevchenko" ? "ledi" : "akakiy");

    document.getElementById("show-label").textContent =
      "Вистава: " + theatre + " — " + showSlug;

    // Дві незалежні геометрії: Шевченко та Академія
    const GEOMS = {
      shevchenko: {
        ROWS: 18,
        SEATS_PER_ROW: 20,
        PASS_AFTER: 10,
        BIG_GAP_AFTER_ROW: null,   // немає великого проходу
        LEFT_PAD_BY_ROW: {}        // без зсуву першого ряду
      },
      akademia: {
        ROWS: 18,
        SEATS_PER_ROW: 23,
        PASS_AFTER: 10,
        BIG_GAP_AFTER_ROW: 17,     // великий прохід між 17 і 18
        // зсув 1-го ряду: місце №1 під №7 другого ряду ⇒ 6 "порожніх" зліва
        LEFT_PAD_BY_ROW: { 1: 6 }
      }
    };

    // Активна геометрія
    const G = GEOMS[theatre] || GEOMS.akademia;

    // Ціни (можна розвести по театрах — поки спільні)
    function priceForRow(r){
      if (r<=1) return 170;
      if (r<=2) return 200;
      if (r<=3) return 200;
      if (r<=6) return 180;
      if (r<=8) return 170;
      if (r<=10) return 160;
      if (r<=12) return 140;
      if (r<=14) return 120;
      if (r<=16) return 100;
      return 70;
    }

    // =========== РЕНДЕР ===========

    const hallEl       = document.getElementById("hall");
    const selected     = new Set();
    const seatCountEl  = document.getElementById("seat-count");
    const seatSumEl    = document.getElementById("seat-sum");
    const btnCheckout  = document.getElementById("to-checkout");

    // seat_id -> 'sold' | 'reserved'
    let statusMap = new Map();

    function renderHall(){
      hallEl.innerHTML = "";
      for (let r=1; r<=G.ROWS; r++){
        const rowEl = document.createElement("div");
        rowEl.className = "hall-row";

        const lbl = document.createElement("div");
        lbl.className = "row-label";
        lbl.textContent = r;
        rowEl.appendChild(lbl);

        // Зсув ряду (для Академії в 1-му ряду)
        const pad = G.LEFT_PAD_BY_ROW[r] || 0;
        for (let p=0; p<pad; p++){
          const pg = document.createElement("div");
          pg.className = "pad-gap";
          rowEl.appendChild(pg);
        }

        // Місця
        for (let s=1; s<=G.SEATS_PER_ROW; s++){
          // Центральний прохід після PASS_AFTER
          if (s === G.PASS_AFTER + 1){
            const gap = document.createElement("div");
            gap.className = "pass-gap";
            rowEl.appendChild(gap);
          }

          const seatId    = `P${r}-M${s}`;
          const seatPrice = priceForRow(r);

          const el = document.createElement("div");
          el.className = "seat available";
          el.textContent = s;
          el.title = `Ряд ${r}, місце ${s} — ${seatPrice} грн`;

          const st = statusMap.get(seatId);
          if (st === "sold"){
            el.classList.remove("available");
            el.classList.add("sold");
          } else if (st === "reserved"){
            el.classList.remove("available");
            el.classList.add("selected");
          } else {
            el.addEventListener("click", ()=>{
              if (el.classList.contains("selected")){
                el.classList.remove("selected");
                el.classList.add("available");
                selected.delete(seatId);
              } else {
                el.classList.remove("available");
                el.classList.add("selected");
                selected.add(seatId);
              }
              updateSummary();
            });
          }

          rowEl.appendChild(el);
        }

        hallEl.appendChild(rowEl);

        // Великий вертикальний прохід (тільки для Академії)
        if (G.BIG_GAP_AFTER_ROW && r === G.BIG_GAP_AFTER_ROW){
          const sep = document.createElement("div");
          sep.className = "row-big-sep";
          hallEl.appendChild(sep);
        }
      }
    }

    function updateSummary(){
      const ids = [...selected];
      seatCountEl.textContent = ids.length;
      const sum = ids.reduce((acc, id)=>{
        const row = parseInt(id.split("-")[0].slice(1),10);
        return acc + priceForRow(row);
      }, 0);
      seatSumEl.textContent = sum;
      btnCheckout.disabled = (ids.length === 0);
    }

    // =========== СТАТУСИ (опціонально з Supabase) ===========

    (async function tryFetchStatuses(){
      try{
        const SUPABASE_URL = "https://yqhzekifwxotizsmaeaf.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_z1h_G-7K7HGCjOUtRZpI9Q_o1m9inZM";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // очікуємо таблицю bookings зі стовпцями: show_slug, seat_id, status, expires_at
        const { data, error } = await sb
          .from("bookings")
          .select("seat_id,status,expires_at")
          .eq("show_slug", `${theatre}/${showSlug}`);

        if (!error && Array.isArray(data)){
          const nowIso = new Date().toISOString();
          data.forEach(row=>{
            if (row.status === "reserved" && row.expires_at && row.expires_at < nowIso) return;
            statusMap.set(row.seat_id, row.status);
          });
        }
      } catch(e){
        console.warn("Статуси місць недоступні:", e.message);
      } finally {
        renderHall();
      }
    })();

    // =========== ПЕРЕХІД ДО ОПЛАТИ ===========

    document.getElementById("to-checkout").addEventListener("click", ()=>{
      const ids = [...selected];
      const sum = Number(seatSumEl.textContent) || 0;

      const name  = document.getElementById("buyer-name").value.trim();
      const phone = document.getElementById("buyer-phone").value.trim();
      const email = document.getElementById("buyer-email").value.trim();

      const prefix  = theatre === "shevchenko" ? "SHEV" : "AKAD";
      const orderId = `${prefix}-` + Date.now();

      const url = new URL(location.origin + "/checkout.html");
      url.searchParams.set("show", `${theatre}/${showSlug}`);
      url.searchParams.set("seats", ids.join(","));
      url.searchParams.set("amount", String(sum));
      url.searchParams.set("order_id", orderId);
      if (name)  url.searchParams.set("name", name);
      if (phone) url.searchParams.set("phone", phone);
      if (email) url.searchParams.set("email", email);

      location.href = url.toString();
    });
  </script>
</body>
</html>
