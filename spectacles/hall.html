<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="page-title">Вибір місць — Ваш Адмін</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    :root { --seat: 28px; --gap: 6px; }
    @media (max-width: 640px){ :root { --seat: 22px; --gap: 4px; } }

    .controls{position:sticky;top:0;z-index:5;background:#fff;padding:8px 0;margin:-8px 0 8px;
      display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #eee}
    .controls .btn{padding:6px 10px;font-size:14px}
    .controls .meta{font-size:13px;color:#666}

    .hall-wrap{overflow:auto;border:1px dashed #ddd;border-radius:12px;padding:12px;
      max-height:65vh;background:#fff;width:100%}
    .hall{display:grid;gap:var(--gap);justify-content:flex-start;
      grid-template-columns:repeat(var(--cols,10),var(--seat));transform-origin:top left}

    .seat{width:var(--seat);height:var(--seat);border-radius:6px;background:#e0e0e0;
      display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:12px;user-select:none}
    .seat.selected{outline:2px solid #2563eb;box-shadow:0 0 0 2px #2563eb inset;background:#dbeafe}
    .seat.reserved{background:#9e9e9e;color:#fff;cursor:not-allowed}
    .seat.inquota{background:#fde68a} /* места из квоты (видимы/кликабельны) */
    .spacer{width:var(--seat);height:var(--seat);opacity:0;pointer-events:none}
    .rowlabel{grid-column:1/-1;text-align:center;color:#666;margin-top:4px;font-size:12px}
    .scene{grid-column:1/-1;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:8px;
      text-align:center;font-weight:700;padding:8px;margin-bottom:8px;color:#555}

    .error{padding:12px;border:1px solid #fca5a5;background:#fee2e2;color:#7f1d1d;border-radius:10px;margin:10px 0}
    .ok{padding:12px;border:1px solid #10b981;background:#ecfdf5;color:#065f46;border-radius:10px;margin:10px 0;display:none}

    .order-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:12px;margin-top:12px}
    .row{display:grid;gap:10px}
    .row.two{grid-template-columns:1fr 1fr}
    @media (max-width:800px){ .row.two{grid-template-columns:1fr} }
    label{display:flex;flex-direction:column;gap:6px;font-weight:600}
    input{height:42px;border:1px solid #ddd;border-radius:10px;padding:0 12px}
    .hint{font-size:12px;color:#6b7280}
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <a id="back" href="../afisha.html" class="meta">← Назад до афіші</a>
    <h2 id="title">Вибір місць</h2>

    <div class="controls">
      <button id="zoomOut" class="btn secondary">−</button>
      <button id="zoomIn" class="btn">+</button>
      <button id="fitWidth" class="btn">По ширині</button>
      <span class="meta">Масштаб: <strong id="zoomVal">100%</strong></span>
    </div>

    <div class="hall-wrap">
      <div class="hall" id="hall"></div>
    </div>

    <div id="errorBox" class="error" style="display:none"></div>

    <!-- Короткий підсумок -->
    <div style="margin-top:12px">
      <span>Вибрано місць: <strong id="count">0</strong></span> •
      <span>Сума: <strong id="sum">0</strong> грн</span>
    </div>

    <!-- ЕДИНСТВЕННАЯ ФОРМА ЗАКАЗА -->
    <form id="orderForm" class="order-card" novalidate>
      <h3 style="margin:0 0 8px">Дані покупця</h3>
      <div class="row two">
        <label>
          Ім’я та прізвище
          <input type="text" id="customerName" required placeholder="Ваше ім’я та прізвище" autocomplete="name" />
        </label>
        <label>
          Телефон
          <input type="tel" id="customerPhone" required placeholder="+380..." inputmode="tel" autocomplete="tel" />
          <span class="hint">Ми зателефонуємо у разі змін</span>
        </label>
      </div>
      <div class="row" style="margin-top:8px">
        <label>
          Електронна пошта для отримання квитків
          <input type="email" id="customerEmail" required placeholder="example@gmail.com" autocomplete="email" />
          <span class="hint">На цю адресу надійде PDF-квиток</span>
        </label>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
        <button type="submit" class="btn" id="toPayBtn" disabled>Перейти до оплати</button>
        <button type="button" class="btn secondary" id="clearSel">Очистити вибір</button>
      </div>

      <div id="ok" class="ok">✅ Дані збережено. Переходимо до оплати…</div>
      <div id="err" class="error" style="display:none"></div>
    </form>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="../scripts/include.js"></script>

  <script>
  // ===== ВХОДНЫЕ ПАРАМЕТРЫ =====
  const qp = new URLSearchParams(location.search);
  const showSlug = qp.get('show'); // напр. shevchenko/ledi
  if (!showSlug) {
    document.body.innerHTML = 'Помилка: немає параметра ?show';
    throw new Error('missing show');
  }

  // ===== ДИНАМИКА ЗАГОЛОВКА/НАЗАД =====
  document.getElementById('title').textContent = 'Вибір місць';
  document.getElementById('back').href = '../afisha.html';

  // ===== СХЕМА ЗАЛА (только партер, без лож) =====
  const hall   = document.getElementById('hall');
  const wrap   = document.querySelector('.hall-wrap');
  const zoomEl = document.getElementById('zoomVal');
  const countEl= document.getElementById('count');
  const sumEl  = document.getElementById('sum');

  const rootStyle = document.documentElement.style;
  function getSeatPx(){
    const v=getComputedStyle(document.documentElement).getPropertyValue('--seat').trim();
    return parseInt(v.replace('px','')||'28',10);
  }
  function setSeatPx(px){
    const clamped=Math.max(16,Math.min(px,56));
    rootStyle.setProperty('--seat',clamped+'px');
    zoomEl.textContent=Math.round(clamped/28*100)+'%';
    hall.style.transform='scale(1)';
  }
  document.getElementById('zoomIn').addEventListener('click',()=>{ hall.style.transform='scale(1)'; setSeatPx(getSeatPx()+4); });
  document.getElementById('zoomOut').addEventListener('click',()=>{ hall.style.transform='scale(1)'; setSeatPx(getSeatPx()-4); });
  document.getElementById('fitWidth').addEventListener('click',fitWidth);

  function fitWidth(){
    const padding=32;
    const cols=parseInt(getComputedStyle(hall).getPropertyValue('--cols')||'20',10);
    const seat=Math.floor((wrap.clientWidth - padding)/cols);
    if (seat>=16) setSeatPx(seat);
    requestAnimationFrame(()=>{
      const need=wrap.clientWidth-20;
      const cur =hall.scrollWidth;
      const scale=cur>0?Math.min(1,need/cur):1;
      hall.style.transform=`scale(${scale})`;
      zoomEl.textContent=Math.round(getSeatPx()/28*100*scale)+'%';
      wrap.scrollTop=0;wrap.scrollLeft=0;
    });
  }

  // ===== ЗАГРУЖАЕМ КОНФИГ ШОУ =====
  const state = {
    sellMode: 'only',          // 'only' — показывать только квоту; 'disable' — серым остальное
    quota: new Set(),          // "ряд-место"
    reserved: new Set(),       // занятые
    selected: [],              // выбор пользователя
    rows: [],                  // конфиг рядов (только партер)
    layoutCols: 20,
    priceByRow: new Map()
  };

  function showError(msg){
    const box=document.getElementById('err');
    box.textContent=msg; box.style.display='block';
  }

  fetch(`../data/shows/${showSlug}.json`, {cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(show=>{
      // берем только 1–18 рядов (как ты просил)
      const parter=(show.rows||[]).filter(r=>(r.section||'parter')==='parter' && r.enabled!==false && r.row>=1 && r.row<=18);
      if(!parter.length) throw new Error('Немає рядів партера (1–18).');

      // квота
      if (Array.isArray(show.available)) show.available.forEach(k=>state.quota.add(String(k)));
      state.sellMode = (show.sell_mode||'only').toLowerCase()==='disable' ? 'disable' : 'only';

      state.rows=parter.sort((a,b)=>a.row-b.row);
      state.layoutCols = show.layout?.cols || Math.max(...state.rows.map(r=>(r.aisles ? (r.seats + r.aisles.length) : r.seats)));
      hall.style.setProperty('--cols', state.layoutCols);

      // СЦЕНА
      const scene=document.createElement('div'); scene.className='scene'; scene.textContent='СЦЕНА';
      hall.appendChild(scene);

      // отрисовка
      state.rows.forEach(cfg=>{
        state.priceByRow.set(cfg.row,cfg.price);
        const aisles=(cfg.aisles||[]).slice().sort((a,b)=>a-b);
        let nextA=0;
        for(let s=1;s<=cfg.seats;s++){
          while(nextA<aisles.length && (s===aisles[nextA]+1)){ addSpacer(); nextA++; }
          const key=`${cfg.row}-${s}`;
          const el=document.createElement('div');
          el.className='seat';
          el.textContent=s;
          el.dataset.key=key; el.dataset.row=cfg.row; el.dataset.seat=s; el.dataset.price=cfg.price;
          el.title=`Ряд ${cfg.row}, Місце ${s} — ${cfg.price} грн`;

          const inQuota = state.quota.has(key);
          if (inQuota){
            el.classList.add('inquota');
            el.addEventListener('click',()=>toggle(el));
          } else {
            if (state.sellMode==='disable'){
              el.classList.add('reserved'); // видно, но серым
            } else {
              el.style.visibility='hidden'; // completely hide вне квоты
            }
          }
          hall.appendChild(el);
        }
        while(nextA<(cfg.aisles||[]).length){ addSpacer(); nextA++; }
        const rl=document.createElement('div'); rl.className='rowlabel'; rl.textContent=`Ряд ${cfg.row} • ${cfg.price} грн`; hall.appendChild(rl);
      });

      fitWidth(); setTimeout(fitWidth,120);
    })
    .catch(e=>{
      console.error(e);
      document.getElementById('errorBox').style.display='block';
      document.getElementById('errorBox').textContent='Не вдалося завантажити схему. Перевірте data/shows/'+showSlug+'.json';
    });

  function addSpacer(){ const d=document.createElement('div'); d.className='spacer'; hall.appendChild(d); }

  function toggle(el){
    const key=el.dataset.key;
    const i=state.selected.findIndex(x=>x.key===key);
    if(i!==-1){ state.selected.splice(i,1); el.classList.remove('selected'); }
    else{ state.selected.push({key,row:+el.dataset.row,seat:+el.dataset.seat,price:+el.dataset.price}); el.classList.add('selected'); }
    updateSummary();
  }
  function updateSummary(){
    const total=state.selected.reduce((a,b)=>a+b.price,0);
    document.getElementById('count').textContent=state.selected.length;
    document.getElementById('sum').textContent=total;
    document.getElementById('toPayBtn').disabled = state.selected.length===0;
  }
  document.getElementById('clearSel').addEventListener('click',()=>{
    // снять выделение
    [...hall.querySelectorAll('.seat.selected')].forEach(el=>el.classList.remove('selected'));
    state.selected=[]; updateSummary();
  });

  // ===== ВАЛИДАЦИЯ =====
  function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  function validPhone(v){ return /^\+?380\d{9}$/.test(v.replace(/\s|-/g,'')); }

  // ===== САМА ФОРМА (запишем заказ и уйдем на checkout.html) =====
  const form = document.getElementById('orderForm');
  form.addEventListener('submit',(e)=>{
    e.preventDefault();
    const err = document.getElementById('err'); err.style.display='none'; err.textContent='';
    const ok  = document.getElementById('ok');  ok.style.display='none';

    const name  = document.getElementById('customerName').value.trim();
    const phone = document.getElementById('customerPhone').value.trim();
    const email = document.getElementById('customerEmail').value.trim();

    if (!name || !phone || !email){ err.textContent='Заповніть усі поля.'; err.style.display='block'; return; }
    if (!validPhone(phone)){ err.textContent='Телефон має бути у форматі +380XXXXXXXXX.'; err.style.display='block'; return; }
    if (!validEmail(email)){ err.textContent='Невірний формат e-mail.'; err.style.display='block'; return; }

    const seats = state.selected.map(s=>`Р${s.row}-М${s.seat}`).join(',');
    const amount= state.selected.reduce((a,b)=>a+b.price,0);
    const orderId = (showSlug.split('/').pop()||'ORDER').toUpperCase() + '-' + Date.now();

    ok.style.display='block';

    // Переходим на checkout.html, передаём всё необходимое:
    const url = new URL(location.origin + '/checkout.html');
    url.searchParams.set('show', showSlug);
    url.searchParams.set('seats', seats);
    url.searchParams.set('amount', String(amount));
    url.searchParams.set('order_id', orderId);
    url.searchParams.set('name', name);
    url.searchParams.set('phone', phone);
    url.searchParams.set('email', email);

    location.href = url.toString();
  });
  </script>
</body>
</html>
