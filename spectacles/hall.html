<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Вибір місць — Ваш Адмін</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
  body { background:#f4f4f6; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 50px; }
  .hall-wrap { background:#fff; border-radius:14px; padding:26px; margin-bottom:26px; }
  .hall-row {
    display: flex;
    gap: 8px;
    flex-wrap: nowrap;        /* ← главное: не переносим */
    overflow-x: auto;         /* если экран узкий — горизонтальный скролл */
    align-items: center;
  }
  .row-label {
    width: 28px;
    text-align: right;
    font-weight: 600;
    margin-right: 6px;
  }
  .seat {
    flex: 0 0 42px;           /* фикс ширина — чтобы не прыгали */
    height: 42px;
    border-radius:10px;
    background:#fff;
    border:1px solid #d0d5dd;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.15s;
  }
  .seat:hover { background:#e5edff; }
  .seat.selected { background:#1d4ed8; color:#fff; border-color:#1d4ed8; }

  .order-form { background:#fff; border-radius:14px; padding:26px; }
  .flex-row { display:flex; gap:16px; flex-wrap:wrap; }
  .form-group { flex:1 1 240px; display:flex; flex-direction:column; gap:6px; }
  .form-group input {
    height:44px; border:1px solid #d0d5dd; border-radius:10px;
    padding:0 12px; font-size:15px;
  }
  .primary-btn {
    background:#155EEF; color:#fff; border:none;
    border-radius:999px; padding:11px 30px;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .primary-btn:disabled { background:#95b5ff; cursor:not-allowed; }
  .balcony {
    display:flex;
    gap:16px;
    margin-top:12px;
  }
  .balcony .fake {
    background:#f3f4f6;
    border:1px dashed #d1d5db;
    border-radius:10px;
    padding:8px 14px;
  }
</style>

</head>
<body>
  <!-- шапка -->
  <div id="site-header"></div>

  <main>
    <h1>Вибір місць</h1>
    <p id="show-label" class="meta">Вистава: —</p>

    <div class="hall-card">
      <div id="hall" class="hall-grid">
        <!-- тут буде схема -->
      </div>
    </div>

    <div class="order-form">
      <h2 style="margin-top:0">Дані покупця</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="buyer-name">Ім’я та прізвище</label>
          <input id="buyer-name" value="Олександр Рябов" />
        </div>
        <div class="form-group">
          <label for="buyer-phone">Телефон</label>
          <input id="buyer-phone" value="+380981261695" />
        </div>
      </div>
      <div class="form-group" style="margin-top:10px;">
        <label for="buyer-email">Електронна пошта (куди надішлемо квиток)</label>
        <input id="buyer-email" value="alexandrryabov@ukr.net" />
      </div>

      <p style="margin-top:14px">
        Обрано місць: <strong id="seat-count">0</strong> •
        Сума: <strong id="seat-sum">0</strong> грн
      </p>

      <button id="to-checkout" class="primary-btn" disabled>Перейти до оплати</button>
    </div>
  </main>

  <!-- подвал -->
  <div id="site-footer"></div>

  <!-- подключаем общий include -->
  <script type="module" src="../scripts/include.js"></script>

  <script>
    const params = new URLSearchParams(location.search);
    const showSlug = params.get("show") || "shevchenko/ledi";
    const hallEl   = document.getElementById("hall");
    const seatCountEl = document.getElementById("seat-count");
    const seatSumEl   = document.getElementById("seat-sum");
    const btnCheckout = document.getElementById("to-checkout");

    document.getElementById("show-label").textContent =
      "Вистава: " + showSlug.replace("/", " — ");

    // тут будемо зберігати вибране
    const selected = new Set();
    let seatsForCalc = []; // щоб знати price

    async function loadShow(){
      try{
        // тягнемо JSON вистави
        const res = await fetch(`../data/shows/${showSlug}.json?ts=${Date.now()}`, {cache:"no-store"});
        let show = null;
        if (res.ok){
          show = await res.json();
        }

        let rows = [];
        if (show && Array.isArray(show.rows) && show.rows.length){
          // беремо тільки партер і тільки 1–18 ряд
          rows = show.rows
            .filter(r => (r.section || "parter") === "parter")
            .filter(r => (typeof r.row === "number" ? r.row : 0) >= 1 && r.row <= 18)
            .sort((a,b) => a.row - b.row);
        }

        // якщо схемі взагалі нічого не дали — робимо запасну на 18 рядів по 20 місць
        if (!rows.length){
          rows = Array.from({length:18}, (_,i) => ({
            section: "parter",
            row: i+1,
            seats: 20,
            aisles: [10],
            price: 170
          }));
        }

        renderHall(rows);
      }catch(e){
        console.warn("Не вдалось завантажити схему", e);
        // фолбек
        const rows = Array.from({length:18}, (_,i) => ({
          section: "parter",
          row: i+1,
          seats: 20,
          aisles: [10],
          price: 170
        }));
        renderHall(rows);
      }
    }

    function renderHall(rows){
      hallEl.innerHTML = "";
      // максимальна ширина з урахуванням проходів
      const cols = Math.max(...rows.map(r => r.seats + ((r.aisles && r.aisles.length) || 0)));
      hallEl.style.setProperty("--cols", cols);
      hallEl.insertAdjacentHTML("afterbegin", `<div class="scene">СЦЕНА</div>`);

      seatsForCalc = [];

      rows.forEach(r => {
        const aisles = Array.isArray(r.aisles) ? r.aisles.slice().sort((a,b)=>a-b) : [];
        let aisleIdx = 0;

        for (let seatNum = 1; seatNum <= r.seats; seatNum++){
          // якщо перед цим місцем має бути прохід
          if (aisles[aisleIdx] === seatNum){
            const sp = document.createElement("div");
            sp.className = "spacer";
            hallEl.appendChild(sp);
            aisleIdx++;
          }

          const key = `${r.row}-${seatNum}`;
          const div = document.createElement("div");
          div.className = "seat";
          div.textContent = seatNum;
          const price = r.price || 0;
          div.title = `Ряд ${r.row}, Місце ${seatNum}${price ? " — " + price + " грн" : ""}`;

          div.addEventListener("click", () => {
            if (selected.has(key)){
              selected.delete(key);
              div.classList.remove("selected");
            } else {
              selected.add(key);
              div.classList.add("selected");
            }
            rebuildSummary();
          });

          hallEl.appendChild(div);
          seatsForCalc.push({ key, row: r.row, seat: seatNum, price });
        }

        // підпис до ряду
        const label = document.createElement("div");
        label.className = "row-label";
        label.textContent = `Ряд ${r.row}${r.price ? " • " + r.price + " грн" : ""}`;
        hallEl.appendChild(label);
      });
    }

    function rebuildSummary(){
      const ids = Array.from(selected);
      seatCountEl.textContent = ids.length;
      const sum = ids.reduce((acc, key) => {
        const found = seatsForCalc.find(s => s.key === key);
        return acc + (found ? (found.price || 0) : 0);
      }, 0);
      seatSumEl.textContent = sum;
      btnCheckout.disabled = ids.length === 0;
    }

    btnCheckout.addEventListener("click", () => {
      const ids = Array.from(selected);
      const sum = Number(seatSumEl.textContent) || 0;

      const name  = document.getElementById("buyer-name").value.trim();
      const phone = document.getElementById("buyer-phone").value.trim();
      const email = document.getElementById("buyer-email").value.trim();

      // order_id без кирилиці
      const orderId = "SHEV-" + Date.now();

      const url = new URL(location.origin + "/checkout.html");
      url.searchParams.set("show", showSlug);
      url.searchParams.set("seats", ids.join(","));
      url.searchParams.set("amount", String(sum));
      url.searchParams.set("order_id", orderId);
      url.searchParams.set("name", encodeURIComponent(name));
      url.searchParams.set("phone", encodeURIComponent(phone));
      url.searchParams.set("email", encodeURIComponent(email));
      location.href = url.toString();
    });

    loadShow();
  </script>
</body>
</html>
