<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Схема зала — Ваш Адмін</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root { --seat: 28px; --gap: 6px; }
    @media (max-width: 640px){ :root { --seat: 22px; --gap: 4px; } }

    .controls{position:sticky;top:0;z-index:5;background:#fff;padding:8px 0;margin:-8px 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #eee}
    .controls .btn{padding:6px 10px;font-size:14px}
    .controls .meta{font-size:13px;color:#666}

    .hall-wrap{overflow:auto;border:1px dashed #ddd;border-radius:12px;padding:12px;max-height:72vh;background:#fff;width:100%}
    .hall{display:grid;gap:var(--gap);justify-content:flex-start;grid-template-columns: repeat(var(--cols, 10), var(--seat));transform-origin:top left}
    .seat{width:var(--seat);height:var(--seat);border-radius:6px;background:#e0e0e0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:12px;user-select:none}
    .seat.selected{background:#4caf50;color:#fff}
    .seat.reserved{background:#9e9e9e;color:#fff;cursor:not-allowed}
    .seat.disabled{background:#f3f4f6;color:#999;cursor:not-allowed} /* показано, але клік заборонено */
    .quota{background:#fde68a} /* місця квоти */
    .spacer{width:var(--seat);height:var(--seat);opacity:0;pointer-events:none}
    .rowlabel{grid-column:1/-1;text-align:center;color:#666;margin-top:4px;font-size:12px}
    .stage{grid-column:1/-1;background:#ddd;color:#333;font-weight:700;text-align:center;padding:10px;border-radius:8px;margin-bottom:8px}
    .error{padding:12px;border:1px solid #fca5a5;background:#fee2e2;color:#7f1d1d;border-radius:10px;margin:10px 0}
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="main">
    <a class="meta" href="/afisha.html">← Повернутись до афіші</a>

    <div class="controls">
      <button id="zoomOut" class="btn secondary">−</button>
      <button id="zoomIn" class="btn">+</button>
      <button id="fitWidth" class="btn">По ширині</button>
      <span id="zoomInfo" class="meta">Масштаб: <strong id="zoomVal">100%</strong></span>
    </div>

    <div class="hall-wrap">
      <div class="hall">
        <div class="stage">СЦЕНА</div>
        <div id="hall" class="hall" aria-label="Схема залу"></div>
      </div>
    </div>

    <div id="errorBox" class="error" style="display:none"></div>

    <div style="margin-top:12px">
      <span>Вибрано місць: <strong id="count">0</strong></span> •
      <span>Сума: <strong id="sum">0</strong> грн</span>
      <div><button id="toCheckout" class="btn" disabled>Перейти до оплати</button></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/scripts/include.js" type="module"></script>
  <script>
    const qp=new URLSearchParams(location.search);
    const showSlug=qp.get('show');
    if(!showSlug){ document.body.innerHTML='Помилка: немає параметра ?show'; throw new Error('no show'); }

    const rootStyle = document.documentElement.style;
    const zoomValEl = document.getElementById('zoomVal');
    function getSeatPx(){ const v=getComputedStyle(document.documentElement).getPropertyValue('--seat').trim(); return parseInt(v.replace('px','')||'28',10); }
    function setSeatPx(px){ const c=Math.max(16, Math.min(px, 54)); rootStyle.setProperty('--seat', c+'px'); zoomValEl.textContent=Math.round(c/28*100)+'%'; document.getElementById('hall').style.transform='scale(1)'; }

    function showError(msg){ const box=document.getElementById('errorBox'); box.style.display='block'; box.textContent=msg; }

    fetch(`/data/shows/${showSlug}.json`, {cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    }).then(show=>{
      const allRows=(show.rows||[]).filter(r=>r.enabled!==false);
      const parter=allRows.filter(r=>(r.section||'parter')==='parter' && r.row>=1 && r.row<=18);
      if(!parter.length){ showError('Немає рядів партера 1–18.'); return; }

      const hall=document.getElementById('hall');
      const wrap=document.querySelector('.hall-wrap');
      const reserved=new Set(show.reserved||[]);
      const sellMode=(show.sell_mode||'only').toLowerCase(); // "only"|"disable"
      const quota=new Set((show.available||[]).map(String));

      const layoutCols=show.layout?.cols || Math.max(...parter.map(r=>(r.aisles ? (r.seats + r.aisles.length) : r.seats)));
      hall.style.setProperty('--cols', layoutCols);

      let selected=[];

      function spacer(){ const d=document.createElement('div'); d.className='spacer'; return d; }

      parter.sort((a,b)=>a.row-b.row).forEach(cfg=>{
        const aisles=(cfg.aisles||[]).slice().sort((a,b)=>a-b);
        let nextA=0;
        for(let s=1;s<=cfg.seats;s++){
          while(nextA<aisles.length && (s===aisles[nextA]+1)){ hall.appendChild(spacer()); nextA++; }
          const key=`${cfg.row}-${s}`;
          const el=document.createElement('div');
          el.className='seat';
          el.textContent=s;
          el.dataset.key=key; el.dataset.row=cfg.row; el.dataset.seat=s; el.dataset.price=cfg.price;
          el.title=`Ряд ${cfg.row}, Місце ${s} — ${cfg.price} грн`;

          const isReserved = reserved.has(key);
          const inQuota = quota.has(key);
          if(isReserved){ el.classList.add('reserved'); }
          else if(sellMode==='only'){
            if(inQuota){ el.classList.add('quota'); el.addEventListener('click',()=>toggle(el)); }
            else { el.classList.add('disabled'); } // показано, але не клікається
          }else{ // disable: все видно, клікається лише квота
            if(inQuota){ el.classList.add('quota'); el.addEventListener('click',()=>toggle(el)); }
            else { el.classList.add('disabled'); }
          }
          hall.appendChild(el);
        }
        while(nextA<(cfg.aisles||[]).length){ hall.appendChild(spacer()); nextA++; }
        const rl=document.createElement('div'); rl.className='rowlabel'; rl.textContent=`Ряд ${cfg.row} • ${cfg.price} грн`; hall.appendChild(rl);
      });

      function fitWidth(){
        const need = wrap.clientWidth - 24;
        const current = hall.scrollWidth;
        if(current>need){
          const scale = Math.max(0.6, need/current);
          hall.style.transform = `scale(${scale})`;
          zoomValEl.textContent = Math.round(getSeatPx()/28*100*scale)+'%';
        } else {
          hall.style.transform='scale(1)';
          zoomValEl.textContent = '100%';
        }
      }
      document.getElementById('zoomIn').addEventListener('click',()=>{ hall.style.transform='scale(1)'; setSeatPx(getSeatPx()+4); fitWidth(); });
      document.getElementById('zoomOut').addEventListener('click',()=>{ hall.style.transform='scale(1)'; setSeatPx(getSeatPx()-4); fitWidth(); });
      document.getElementById('fitWidth').addEventListener('click', fitWidth);

      fitWidth(); setTimeout(fitWidth, 80); addEventListener('resize', fitWidth);

      function toggle(el){
        const key=el.dataset.key;
        const i=selected.findIndex(x=>x.key===key);
        if(i!==-1){ selected.splice(i,1); el.classList.remove('selected'); }
        else { selected.push({key,row:+el.dataset.row,seat:+el.dataset.seat,price:+el.dataset.price}); el.classList.add('selected'); }
        update();
      }
      function update(){
        const total=selected.reduce((a,b)=>a+b.price,0);
        document.getElementById('count').textContent=selected.length;
        document.getElementById('sum').textContent=total;
        document.getElementById('toCheckout').disabled=selected.length===0;
      }
      document.getElementById('toCheckout').addEventListener('click',()=>{
        const seats=selected.map(s=>`Р${s.row}-М${s.seat}`).join(',');
        const total=selected.reduce((a,b)=>a+b.price,0);
        location.href=`/checkout.html?show=${encodeURIComponent(showSlug)}&seats=${encodeURIComponent(seats)}&sum=${encodeURIComponent(total)}`;
      });

    }).catch(e=>{
      console.error(e);
      showError('Не вдалося завантажити схему. Перевірте, чи існує файл: '+
        `/data/shows/${showSlug}.json`);
    });
  </script>
</body>
</html>
