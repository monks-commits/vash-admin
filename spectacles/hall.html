<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вибір місць — Ваш Адмін</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background:#f4f4f6; }
    main { max-width:1100px; margin:0 auto; padding:24px 16px 50px; }

    /* === УПРАВЛЯЕМЫЕ РАЗМЕРЫ === */
    :root{
      --seat: 42px;   /* размер места (ширина/высота) */
      --gap: 8px;     /* расстояние между местами */
      --pass: 40px;   /* ширина прохода */
      --label: 26px;  /* ширина колонки с номерами рядов */
      --fs: 14px;     /* размер цифр */
    }

    .hall-wrap{
      background:#fff;
      border-radius:14px;
      padding:22px;
      margin-bottom:24px;
      overflow-x:auto;  /* теперь можно двигать по горизонтали */
    }

    .hall-row{
      display:flex;
      gap:var(--gap);
      margin-bottom:8px;
      align-items:center;
      flex-wrap:nowrap;
    }

    .row-label{
      width:var(--label);
      flex:0 0 var(--label);
      text-align:right;
      font-size:13px;
      color:#475569;
    }

    .seat{
      width:var(--seat);
      height:var(--seat);
      flex:0 0 var(--seat);
      border-radius:10px;
      background:#fff;
      border:1px solid #d0d5dd;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:.15s;
      font-size:var(--fs);
      user-select:none;
    }

    .seat:hover { background:#e5edff; }
    .seat.selected { background:#155EEF; color:#fff; border-color:#155EEF; }
    .seat.disabled { background:#e2e8f0; border-color:#e2e8f0; color:#64748b; cursor:not-allowed; }

    .pass-gap{
      width:var(--pass);
      height:1px;
      flex:0 0 var(--pass);
    }

    .row-price-inline{
      font-size:12px;
      color:#475569;
      margin:4px 0 12px calc(var(--label) + 8px);
    }

    .order-form{
      background:#fff;
      border-radius:14px;
      padding:26px;
    }

    .flex-row{ display:flex; gap:16px; flex-wrap:wrap; }

    .form-group{
      flex:1 1 240px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .form-group input{
      height:44px;
      border:1px solid #d0d5dd;
      border-radius:10px;
      padding:0 12px;
      font-size:15px;
    }

    .primary-btn{
      background:#155EEF;
      color:#fff;
      border:none;
      border-radius:999px;
      padding:11px 30px;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
    }
    .primary-btn:disabled{ background:#95b5ff; cursor:not-allowed; }

    .muted{ color:#64748b; font-size:13px; }
    .badge-loge{
      display:inline-block;
      background:#e2e8f0;
      border-radius:999px;
      padding:6px 16px;
      margin-right:10px;
      margin-top:14px;
      font-size:13px;
      color:#0f172a;
    }

    /* === АДАПТИВ === */
    @media (max-width:480px){
      :root{
        --seat:36px;
        --gap:6px;
        --pass:28px;
        --label:22px;
        --fs:13px;
      }
    }

    @media (max-width:360px){
      :root{
        --seat:32px;
        --gap:5px;
        --pass:24px;
        --label:20px;
        --fs:12px;
      }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>
  <main>
    <h1>Вибір місць</h1>
    <p id="show-label" class="muted">Вистава: —</p>

    <div class="hall-wrap">
      <div id="hall"></div>
      <div style="margin-top:10px;">
        <span class="badge-loge">Ложа А (18 місць)</span>
        <span class="badge-loge">Ложа Б (18 місць)</span>
      </div>
    </div>

    <div class="order-form" id="buyer-form">
      <h2>Дані покупця</h2>
      <div class="flex-row">
        <div class="form-group">
          <label for="buyer-name">Ім’я та прізвище</label>
          <input id="buyer-name" placeholder="Ваше ім’я та прізвище" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="buyer-phone">Телефон</label>
          <input id="buyer-phone" placeholder="+380..." inputmode="tel" autocomplete="tel" />
        </div>
      </div>
      <div class="form-group" style="margin-top:14px;">
        <label for="buyer-email">Електронна пошта (куди надійде PDF-квиток)</label>
        <input id="buyer-email" placeholder="you@example.com" inputmode="email" autocomplete="email" />
      </div>

      <p style="margin-top:14px;">
        Вибрано місць: <span id="seat-count">0</span> • Сума: <span id="seat-sum">0</span> грн
      </p>

      <button id="to-checkout" class="primary-btn" disabled>Перейти до оплати</button>
      <p class="muted" style="margin-top:10px;">
        Натисніть на місце, щоб додати в замовлення. Сірі місця — вже заброньовані іншими.
      </p>
    </div>
  </main>
  <div id="site-footer"></div>

  <script src="/scripts/include.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const params = new URLSearchParams(location.search);
    const showSlug = params.get("show") || "shevchenko/ledi";
    document.getElementById("show-label").textContent = "Вистава: " + showSlug.replace("/", " — ");

    const ROWS = 18;
    const SEATS_PER_ROW = 20;
    const PASS_AFTER = 10;

    function priceForRow(r){
      if (r<=1) return 170;
      if (r<=2) return 200;
      if (r<=3) return 200;
      if (r<=6) return 180;
      if (r<=8) return 170;
      if (r<=10) return 160;
      if (r<=12) return 140;
      if (r<=14) return 120;
      if (r<=16) return 100;
      return 70;
    }

    const ALL_SEATS=[];
    for(let r=1;r<=ROWS;r++){
      for(let s=1;s<=SEATS_PER_ROW;s++){
        ALL_SEATS.push({id:`P${r}-M${s}`,row:r,seat:s,price:priceForRow(r)});
      }
    }

    const hallEl=document.getElementById("hall");
    const selected=new Set();
    const seatCountEl=document.getElementById("seat-count");
    const seatSumEl=document.getElementById("seat-sum");
    const btnCheckout=document.getElementById("to-checkout");
    let busySeats=new Set();

    function renderHall(){
      hallEl.innerHTML="";
      for(let r=1;r<=ROWS;r++){
        const wrap=document.createElement("div");
        const rowEl=document.createElement("div");
        rowEl.className="hall-row";

        const lbl=document.createElement("div");
        lbl.className="row-label";
        lbl.textContent=r;
        rowEl.appendChild(lbl);

        for(let s=1;s<=SEATS_PER_ROW;s++){
          if(s===PASS_AFTER+1){
            const gap=document.createElement("div");
            gap.className="pass-gap";
            rowEl.appendChild(gap);
          }
          const seatId=`P${r}-M${s}`;
          const seat=ALL_SEATS.find(x=>x.id===seatId);
          const el=document.createElement("div");
          el.className="seat";
          el.textContent=s;
          el.title=`Ряд ${r}, місце ${s} — ${seat.price} грн`;
          if(busySeats.has(seatId)) el.classList.add("disabled");
          else el.onclick=()=>{
            if(selected.has(seatId)){selected.delete(seatId);el.classList.remove("selected");}
            else{selected.add(seatId);el.classList.add("selected");}
            updateSummary();
          };
          rowEl.appendChild(el);
        }
        wrap.appendChild(rowEl);
        const price=document.createElement("div");
        price.className="row-price-inline";
        price.textContent=`Ряд ${r} • ${priceForRow(r)} грн`;
        wrap.appendChild(price);
        hallEl.appendChild(wrap);
      }
    }

    function updateSummary(){
      const ids=[...selected];
      seatCountEl.textContent=ids.length;
      const sum=ids.reduce((a,id)=>{
        const s=ALL_SEATS.find(x=>x.id===id);
        return a+(s?s.price:0);
      },0);
      seatSumEl.textContent=sum;
      btnCheckout.disabled=!ids.length;
    }

    renderHall();

    btnCheckout.onclick=()=>{
      const ids=[...selected];
      const sum=+seatSumEl.textContent||0;
      const name=document.getElementById("buyer-name").value.trim();
      const phone=document.getElementById("buyer-phone").value.trim();
      const email=document.getElementById("buyer-email").value.trim();
      const orderId="SHEV-"+Date.now();
      const url=new URL(location.origin+"/checkout.html");
      url.searchParams.set("show",showSlug);
      url.searchParams.set("seats",ids.join(","));
      url.searchParams.set("amount",sum);
      url.searchParams.set("order_id",orderId);
      if(name) url.searchParams.set("name",name);
      if(phone) url.searchParams.set("phone",phone);
      if(email) url.searchParams.set("email",email);
      location.href=url.toString();
    };
  </script>
</body>
</html>
