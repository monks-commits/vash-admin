<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вибір місць — Ваш Адмін</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background:#f4f4f6; }
    main { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
    .hall-wrap { background:#fff; border-radius:14px; padding:24px; margin-bottom:22px; }
    .hall-row { display:flex; gap:8px; align-items:center; justify-content:center; }
    .seat {
      width:42px; height:42px;
      border-radius:10px;
      background:#fff;
      border:1px solid #d0d5dd;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      transition:.12s;
      font-weight:500;
    }
    .seat:hover { background:#e5edff; }
    .seat.selected { background:#155EEF; color:#fff; border-color:#155EEF; }
    .seat.lozha {
      opacity:.35;
      pointer-events:none;
      width:54px;
      background:#f3f4f6;
      border-style:dashed;
      font-weight:600;
    }
    .order-form { background:#fff; border-radius:14px; padding:24px; gap:16px; display:flex; flex-direction:column; }
    .flex-row { display:flex; gap:16px; flex-wrap:wrap; }
    .form-group { flex:1 1 240px; display:flex; flex-direction:column; gap:6px; }
    .form-group input, .form-group select {
      height:44px; border:1px solid #d0d5dd; border-radius:10px;
      padding:0 12px; font-size:15px;
    }
    .primary-btn {
      background:#155EEF; color:#fff; border:none;
      border-radius:999px; padding:11px 30px;
      font-size:15px; font-weight:600; cursor:pointer;
      align-self:flex-start;
    }
    .primary-btn:disabled { background:#95b5ff; cursor:not-allowed; }
    .badge-rowtype{
      display:inline-flex;gap:6px;background:#eef2ff;border:1px solid #d4d4ff;
      border-radius:999px;padding:6px 10px;align-items:center
    }
    .mode-btns{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
    .mode-btn{
      border:1px solid #d0d5dd;background:#fff;border-radius:999px;
      padding:6px 14px;cursor:pointer;font-weight:500;
    }
    .mode-btn.active{background:#155EEF;color:#fff;border-color:#155EEF}
    @media (max-width:720px){
      .seat{width:36px;height:36px}
      .hall-wrap{padding:14px 6px}
      main{padding-inline:8px}
    }
  </style>
</head>
<body>
  <!-- шапка -->
  <div id="site-header"></div>

  <main>
    <h1>Вибір місць</h1>
    <p id="show-label" class="meta">Вистава: —</p>

    <!-- режим ціни -->
    <div class="mode-btns">
      <button type="button" class="mode-btn active" data-mode="evening">Вечірній показ</button>
      <button type="button" class="mode-btn" data-mode="kids">Дитячий / ранковий</button>
      <span class="badge-rowtype">Ціни оновлюються по ряду</span>
    </div>

    <!-- схема -->
    <div class="hall-wrap">
      <div style="text-align:center;color:#6b7280;font-weight:600;margin-bottom:12px">СЦЕНА</div>
      <div id="hall-seats" class="hall-body" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>

    <!-- форма покупця -->
    <div class="order-form">
      <h2 style="margin:0 0 8px">Дані покупця</h2>
      <div class="flex-row">
        <div class="form-group">
          <label for="buyer-name">Ім’я та прізвище *</label>
          <input id="buyer-name" required />
        </div>
        <div class="form-group">
          <label for="buyer-phone">Телефон *</label>
          <input id="buyer-phone" placeholder="+380..." required />
        </div>
      </div>
      <div class="form-group">
        <label for="buyer-email">E-mail для квитка *</label>
        <input id="buyer-email" type="email" placeholder="you@example.com" required />
      </div>
      <p style="margin-top:6px">
        Вибрано місць: <strong id="seat-count">0</strong> •
        Сума: <strong id="seat-sum">0</strong> грн
      </p>
      <button id="to-checkout" class="primary-btn" disabled>Перейти до оплати</button>
      <p class="meta" style="font-size:12px">Після переходу ви потрапите на сторінку оплати (LiqPay).</p>
    </div>
  </main>

  <!-- подвал -->
  <div id="site-footer"></div>

  <!-- подгружаем хедер/футер -->
  <script src="/vash-admin/scripts/include.js"></script>

  <script>
    // 1. читаем спектакль из URL
    const params   = new URLSearchParams(location.search);
    const showSlug = params.get("show") || "shevchenko/ledi";
    document.getElementById("show-label").textContent =
      "Вистава: " + showSlug.replace("/", " — ");

    // 2. ссылки на DOM
    const hallRoot    = document.getElementById("hall-seats");
    const seatCountEl = document.getElementById("seat-count");
    const seatSumEl   = document.getElementById("seat-sum");
    const btnCheckout = document.getElementById("to-checkout");
    const modeBtns    = document.querySelectorAll(".mode-btn");

    // 3. модели
    const selected = new Set();
    // две шкалы цен: по рядам
    const pricePresets = {
      evening: {
        // ряди: ціна
        1: 170, 2: 200,
        3: 200, 4: 180,
        5: 180, 6: 180,
        7: 170, 8: 170,
        9: 160, 10: 1600,
        11: 140, 12: 140,
        13: 120, 14: 120,
        15: 100, 16: 100,
        17: 70, 18: 70
      },
      kids: {
        1: 100, 2: 100,
        3: 100, 4: 90,
        5: 90, 6: 90,
        7: 90, 8: 90,
        9: 80, 10: 80,
        11: 80, 12: 80,
        13: 80, 14: 80,
        15: 70, 16: 70,
        17: 70, 18: 70
      }
    };
    let currentMode = "evening";

    // 4. строим 18 рядов × 20 мест
    function buildHall() {
      hallRoot.innerHTML = "";
      for (let r = 1; r <= 18; r++) {
        const rowDiv = document.createElement("div");
        rowDiv.className = "hall-row";

        // Ложа А
        const lozhaA = document.createElement("div");
        lozhaA.className = "seat lozha";
        lozhaA.textContent = "A";
        rowDiv.appendChild(lozhaA);

        for (let m = 1; m <= 20; m++) {
          if (m === 11) {
            const gap = document.createElement("div");
            gap.style.width = "30px";
            rowDiv.appendChild(gap);
          }
          const price = getPriceFor(r);
          const seatEl = document.createElement("div");
          seatEl.className = "seat";
          seatEl.textContent = m;
          const seatId = `P${r}-M${m}`;
          seatEl.title = `Ряд ${r}, Місце ${m} — ${price} грн`;

          if (selected.has(seatId)) {
            seatEl.classList.add("selected");
          }

          seatEl.addEventListener("click", () => {
            if (selected.has(seatId)) {
              selected.delete(seatId);
              seatEl.classList.remove("selected");
            } else {
              selected.add(seatId);
              seatEl.classList.add("selected");
            }
            updateSummary();
          });

          rowDiv.appendChild(seatEl);
        }

        // Ложа Б
        const lozhaB = document.createElement("div");
        lozhaB.className = "seat lozha";
        lozhaB.textContent = "Б";
        rowDiv.appendChild(lozhaB);

        hallRoot.appendChild(rowDiv);
      }
    }

    function getPriceFor(rowNumber){
      const preset = pricePresets[currentMode];
      return preset[rowNumber] ?? 100;
    }

    function updateSummary(){
      const ids = Array.from(selected);
      seatCountEl.textContent = ids.length;
      const sum = ids.reduce((acc, seatId) => {
        // seatId = "P5-M12"
        const rowNum = Number(seatId.split("-")[0].substring(1));
        return acc + getPriceFor(rowNum);
      }, 0);
      seatSumEl.textContent = sum;
      btnCheckout.disabled = ids.length === 0;
    }

    // переключение тарифов
    modeBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        modeBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
        // перестраиваем, чтобы обновились цены
        buildHall();
        updateSummary();
      });
    });

    // первый рендер
    buildHall();
    updateSummary();

    // переход в checkout
    btnCheckout.addEventListener("click", () => {
      const ids = Array.from(selected);
      const sum = Number(seatSumEl.textContent) || 0;

      const name  = document.getElementById("buyer-name").value.trim();
      const phone = document.getElementById("buyer-phone").value.trim();
      const email = document.getElementById("buyer-email").value.trim();

      if (!name || !phone || !email) {
        alert("Заповніть, будь ласка, всі поля покупця.");
        return;
      }

      // order_id без кирилиці
      const orderId = "SHEV-" + Date.now();

      const url = new URL(location.origin + "/checkout.html");
      url.searchParams.set("show", showSlug);
      url.searchParams.set("seats", ids.join(","));
      url.searchParams.set("amount", String(sum));
      url.searchParams.set("order_id", orderId);
      url.searchParams.set("name", encodeURIComponent(name));
      url.searchParams.set("phone", encodeURIComponent(phone));
      url.searchParams.set("email", encodeURIComponent(email));

      location.href = url.toString();
    });
  </script>
</body>
</html>
