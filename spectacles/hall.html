<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вибір місць — Ваш Адмін</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <h1 id="show-title">Вибір місць</h1>
    <p id="show-info" class="meta"></p>

    <!-- Схема залу -->
    <div id="hall-map" class="hall-container"></div>

    <!-- Підсумок -->
    <div id="summary" class="summary">
      <p>Обрано місць: <span id="seat-count">0</span></p>
      <p>Сума: <span id="total-amount">0</span> грн</p>
      <button id="payBtn" class="button-primary" disabled>Оплатити</button>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="../scripts/include.js"></script>

  <script>
  // === ДАНІ ПРО ПОКАЗ ===
  const qs = new URLSearchParams(location.search);
  const showSlug = qs.get("show") || "shevchenko/example";
  const titleFromUrl = qs.get("title"); // опціонально
  const showTitleEl = document.getElementById("show-title");
  const showInfoEl  = document.getElementById("show-info");

  const prettyShow = titleFromUrl || showSlug.replace("/", " — ");
  showTitleEl.textContent = "Вибір місць";
  showInfoEl.textContent = "Спектакль: " + prettyShow;

  // === МОДЕЛЬ ВИБОРУ ===
  const hallMap     = document.getElementById("hall-map");
  const seatCountEl = document.getElementById("seat-count");
  const totalEl     = document.getElementById("total-amount");
  const payBtn      = document.getElementById("payBtn");

  // Демонстраційні дані — заміниш своїми з JSON
  const seatsData = [
    { id: "1-1", row: 1, place: 1, price: 200 },
    { id: "1-2", row: 1, place: 2, price: 200 },
    { id: "1-3", row: 1, place: 3, price: 250 },
    { id: "1-4", row: 1, place: 4, price: 250 },
  ];

  const selectedSeats = new Set();

  // Малюємо місця
  seatsData.forEach(seat => {
    const div = document.createElement("div");
    div.className = "seat";
    div.textContent = seat.place;
    div.title = `Ряд ${seat.row}, Місце ${seat.place} (${seat.price} грн)`;
    div.dataset.price = String(seat.price);            // <— важливо: для підрахунку
    div.dataset.id = seat.id;

    div.addEventListener("click", () => {
      if (selectedSeats.has(seat.id)) {
        selectedSeats.delete(seat.id);
        div.classList.remove("selected");
      } else {
        selectedSeats.add(seat.id);
        div.classList.add("selected");
      }
      updateSummary();
    });

    hallMap.appendChild(div);
  });

  // Підрахунок
  function updateSummary() {
    seatCountEl.textContent = selectedSeats.size;
    const total = Array.from(selectedSeats)
      .map(id => seatsData.find(s => s.id === id)?.price || 0)
      .reduce((a, b) => a + b, 0);
    totalEl.textContent = String(total);
    payBtn.disabled = selectedSeats.size === 0;
  }

  // === Перехід до оплати ===
  payBtn.addEventListener("click", () => {
    const total = Number(totalEl.textContent || 0);
    const seats = Array.from(selectedSeats).join(",");
    // order_id: короткий код шоу + timestamp
    const orderId = showSlug.split("/").pop().toUpperCase() + "-" + Date.now();

    // checkout в КОРЕНІ сайту
    const url = new URL(location.origin + "/checkout.html");
    url.searchParams.set("show", showSlug);
    url.searchParams.set("title", prettyShow);
    url.searchParams.set("seats", seats);
    url.searchParams.set("amount", String(total));
    url.searchParams.set("order_id", orderId);

    location.href = url.toString();
  });
  </script>

  <style>
    .hall-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    .seat {
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eee;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .seat:hover {
      background: #ddd;
    }
    .seat.selected {
      background: #3b82f6;
      color: #fff;
    }
    .summary {
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      max-width: 320px;
      background: #fafafa;
    }
    .summary p {
      margin: 4px 0;
    }
    .button-primary {
      margin-top: 12px;
      padding: 10px 20px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s;
    }
    .button-primary:hover {
      background: #0056b3;
    }
    .button-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</body>
</html>
