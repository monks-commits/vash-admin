<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вибір місць — Ваш Адмін</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background:#f4f4f6; }
    main { max-width:1100px; margin:0 auto; padding:24px 16px 50px; }

    .hall-wrap { background:#fff; border-radius:14px; padding:22px; margin-bottom:24px; }
    .hall-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:nowrap; }
    .row-label { width:26px; text-align:right; font-size:12px; color:#475569; flex:0 0 26px; }

    .seat {
      width:36px; height:36px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      border:1px solid #d0d5dd; background:#fff; color:#0f172a;
      font-size:13px; user-select:none; transition:.15s; cursor:pointer;
      box-sizing:border-box;
    }
    .seat.available { background:#fde68a; border-color:#fbbf24; }
    .seat.available:hover { filter:brightness(0.97); }
    .seat.selected  { background:#ef4444; border-color:#ef4444; color:#fff; }
    .seat.sold      { background:#22c55e; border-color:#16a34a; color:#fff; cursor:not-allowed; }
    .seat.disabled  { background:#eceff3; border-color:#e3e8ef; color:#94a3b8; cursor:not-allowed; }

    .pass-gap { width:36px; height:1px; flex:0 0 36px; } /* центральний прохід */
    .pad-gap  { width:36px; height:1px; flex:0 0 36px; } /* «порожня» клітинка для зсуву ряду */

    .row-sep      { height:18px; }        /* звичайний вертикальний інтервал */
    .row-big-sep  { height:34px; }        /* великий прохід (між 17 і 18 для Академії) */

    .order-form { background:#fff; border-radius:14px; padding:22px; }
    .flex-row { display:flex; gap:12px; flex-wrap:wrap; }
    .form-group { flex:1 1 240px; display:flex; flex-direction:column; gap:6px; }
    .form-group input { height:44px; border:1px solid #d0d5dd; border-radius:10px; padding:0 12px; font-size:15px; }
    .primary-btn { background:#155EEF; color:#fff; border:none; border-radius:999px; padding:11px 30px; font-size:15px; font-weight:600; cursor:pointer; }
    .primary-btn:disabled { background:#95b5ff; cursor:not-allowed; }
    .muted { color:#64748b; font-size:13px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- header -->
  <div id="site-header"></div>

  <main>
    <h1>Вибір місць</h1>
    <p id="show-label" class="muted" style="margin-bottom:14px;">Вистава: —</p>

    <div class="hall-wrap">
      <div id="hall"></div>
    </div>

    <div class="order-form" id="buyer-form">
      <h2>Дані покупця</h2>
      <div class="flex-row">
        <div class="form-group">
          <label for="buyer-name">Ім’я та прізвище</label>
          <input id="buyer-name" placeholder="Ваше ім’я та прізвище" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="buyer-phone">Телефон</label>
          <input id="buyer-phone" placeholder="+380..." inputmode="tel" autocomplete="tel" />
        </div>
      </div>
      <div class="form-group" style="margin-top:14px;">
        <label for="buyer-email">Електронна пошта (куди надійде PDF-квиток)</label>
        <input id="buyer-email" placeholder="you@example.com" inputmode="email" autocomplete="email" />
      </div>

      <p style="margin-top:14px;">
        Вибрано місць: <span id="seat-count">0</span> • Сума: <span id="seat-sum">0</span> грн
      </p>
      <button id="to-checkout" class="primary-btn" disabled>Перейти до оплати</button>
      <p class="muted" style="margin-top:10px;">
        Геометрія залу автоматично підлаштовується під театр (Шевченко / Академія).
      </p>
    </div>
  </main>

  <!-- footer -->
  <div id="site-footer"></div>
  <script src="/scripts/include.js"></script>

  <script>
  // ---------- чтение параметров ----------
  const q = new URLSearchParams(location.search);
  let theatre = q.get('theatre')?.trim().toLowerCase() || '';
  let showParam = q.get('show')?.trim() || '';
  let slug = '';

  if (showParam.includes('/')) {
    const [t, s] = showParam.split('/');
    theatre = theatre || (t || '').toLowerCase();
    slug = (s || '').toLowerCase();
  } else {
    slug = showParam.toLowerCase();
  }
  if (!theatre || !slug) {
    document.getElementById('hall').textContent = 'Помилка: відсутні параметри show/theatre.';
    throw new Error('Missing theatre or show slug');
  }

  document.getElementById('show-label').textContent = `Вистава: ${theatre} — ${slug}`;

  // ---------- ссылки на DOM ----------
  const hallEl      = document.getElementById('hall');
  const seatCountEl = document.getElementById('seat-count');
  const seatSumEl   = document.getElementById('seat-sum');
  const btnCheckout = document.getElementById('to-checkout');

  // ---------- состояние ----------
  const selected = new Set();          // выбранные seatIds
  const statusMap = new Map();         // seatId -> 'sold'|'reserved'
  const DEFAULT_STAGE = { shevchenko: 'big', akademia: 'main' };

  // fallback цены, если нет зон и нет явных цен по рядам
  function fallbackPrice(r){
    if (r<=1) return 170;
    if (r<=2) return 200;
    if (r<=3) return 200;
    if (r<=6) return 180;
    if (r<=8) return 170;
    if (r<=10) return 160;
    if (r<=12) return 140;
    if (r<=14) return 120;
    if (r<=16) return 100;
    return 70;
  }

  async function fetchJSON(url){
    const res = await fetch(url, {cache:'no-store'});
    if (!res.ok) {
      const err = new Error('HTTP '+res.status);
      err.status = res.status;
      err.url = url;
      throw err;
    }
    return res.json();
  }

  // ---------- рендер ПЛОСКОГО формата ----------
  function renderFlatHall(G, priceByRow){
    hallEl.innerHTML = '';

    const totalRows = Number(G.rows);
    const seatsPerRowDefault = Number(G.seatsPerRow);
    const leftPadByRow = G.leftPadByRow || {};
    const bigGapAfterRow = G.bigGapAfterRow ? Number(G.bigGapAfterRow) : null;

    function seatsInRow(r){
      if (G.rowOverrides && G.rowOverrides[String(r)] != null) {
        return Number(G.rowOverrides[String(r)]);
      }
      return seatsPerRowDefault;
    }
    function passListForRow(r){
      if (G.passAfterListByRow && Array.isArray(G.passAfterListByRow[String(r)])) {
        return G.passAfterListByRow[String(r)];
      }
      return Array.isArray(G.passAfterListDefault) ? G.passAfterListDefault : [];
    }

    for (let r=1; r<=totalRows; r++){
      const rowEl = document.createElement('div');
      rowEl.className = 'hall-row';

      const lbl = document.createElement('div');
      lbl.className = 'row-label';
      lbl.textContent = r;
      rowEl.appendChild(lbl);

      const pad = Number(leftPadByRow[String(r)] || 0);
      for (let p=0; p<pad; p++){
        const pg = document.createElement('div');
        pg.className = 'pad-gap';
        rowEl.appendChild(pg);
      }

      const seatsCount = seatsInRow(r);
      const passes = passListForRow(r) || [];

      for (let s=1; s<=seatsCount; s++){
        if (passes.includes(s-1)){
          const gap = document.createElement('div');
          gap.className = 'pass-gap';
          rowEl.appendChild(gap);
        }

        const seatId = `P${r}-M${s}`;
        const price  = priceByRow.get(r) ?? fallbackPrice(r);

        const el = document.createElement('div');
        el.className = 'seat available';
        el.textContent = s;
        el.title = `Ряд ${r}, місце ${s} — ${price} грн`;

        const st = statusMap.get(seatId);
        if (st === 'sold'){
          el.classList.remove('available'); el.classList.add('sold');
        } else if (st === 'reserved'){
          el.classList.remove('available'); el.classList.add('disabled');
        } else {
          el.addEventListener('click', ()=>toggleSelect(el, seatId, price, r));
        }

        rowEl.appendChild(el);
      }

      hallEl.appendChild(rowEl);

      if (bigGapAfterRow && r === bigGapAfterRow){
        const sep = document.createElement('div');
        sep.className = 'row-big-sep';
        hallEl.appendChild(sep);
      }
    }
  }

  // ---------- рендер РЯДОВОГО формата (как в data/halls/akademia.json) ----------
  function renderRowTableHall(H, priceByRow){
    hallEl.innerHTML = '';

    const rows = Array.isArray(H.rows) ? H.rows : [];
    const bigGapAfterRow = H.bigGapAfterRow ? Number(H.bigGapAfterRow) : (theatre==='akademia' ? 17 : null);

    for (const rowDef of rows){
      const r = Number(rowDef.row);
      const seats = Number(rowDef.seats);
      const aisles = Array.isArray(rowDef.aisles) ? rowDef.aisles.slice().sort((a,b)=>a-b) : [];
      const zones = Array.isArray(rowDef.zones) ? rowDef.zones : [];
      const leftPad = Number(rowDef.leftPad || 0) || (theatre==='akademia' && r===1 && seats===11 ? 6 : 0);

      const rowEl = document.createElement('div');
      rowEl.className = 'hall-row';

      const lbl = document.createElement('div');
      lbl.className = 'row-label';
      lbl.textContent = r;
      rowEl.appendChild(lbl);

      for (let p=0; p<leftPad; p++){
        const pg = document.createElement('div');
        pg.className = 'pad-gap';
        rowEl.appendChild(pg);
      }

      // helper: цена по зоне; если зон нет -> весь ряд закрыт (как у тебя для 7 и 18 рядов)
      function priceFromZones(seatNum){
        if (!zones.length) return 0; // закрыт
        for (const z of zones){
          const a = Number(z.from), b = Number(z.to), pr = Number(z.price);
          if (seatNum>=a && seatNum<=b){
            return isNaN(pr) ? 0 : pr;
          }
        }
        return 0; // не попал ни в одну зону -> закрыт
      }

      for (let s=1; s<=seats; s++){
        if (aisles.includes(s-1)){
          const gap = document.createElement('div');
          gap.className = 'pass-gap';
          rowEl.appendChild(gap);
        }

        const seatId = `P${r}-M${s}`;
        // приоритет: зона -> явная цена по ряду из show.json -> фолбэк
        let price = priceFromZones(s);
        if (!price) price = priceByRow.get(r) ?? 0;
        if (!price) price = (zones.length ? 0 : fallbackPrice(r));

        const el = document.createElement('div');
        el.textContent = s;

        // если price == 0, считаем место закрытым
        if (price <= 0){
          el.className = 'seat disabled';
          el.title = `Ряд ${r}, місце ${s} — недоступно`;
        } else {
          el.className = 'seat available';
          el.title = `Ряд ${r}, місце ${s} — ${price} грн`;

          const st = statusMap.get(seatId);
          if (st === 'sold'){
            el.classList.remove('available'); el.classList.add('sold');
          } else if (st === 'reserved'){
            el.classList.remove('available'); el.classList.add('disabled');
          } else {
            el.addEventListener('click', ()=>toggleSelect(el, seatId, price, r));
          }
        }

        rowEl.appendChild(el);
      }

      hallEl.appendChild(rowEl);

      if (bigGapAfterRow && r === bigGapAfterRow){
        const sep = document.createElement('div');
        sep.className = 'row-big-sep';
        hallEl.appendChild(sep);
      }
    }
  }

  // ---------- выбор / суммы ----------
  function toggleSelect(el, seatId, price, row){
    if (el.classList.contains('selected')){
      el.classList.remove('selected');
      el.classList.add('available');
      selected.delete(seatId);
    } else {
      el.classList.remove('available');
      el.classList.add('selected');
      selected.add(seatId);
    }
    updateSummary();
  }

  function updateSummary(){
    const ids = [...selected];
    seatCountEl.textContent = ids.length;
    const sum = ids.reduce((acc, id)=>{
      const row = parseInt(id.split('-')[0].slice(1),10);
      // сумма уже считается клик-временем по цене конкретного места,
      // здесь оставим резервный фолбэк на случай, если придётся пересчитать
      return acc + 0;
    }, 0);
    // Чтобы сумма работала корректно, лучше хранить цену для seatId:
    // Простой вариант — закодировать цену в title и парсить,
    // но короче — пересчитаем по DOM:
    let total = 0;
    document.querySelectorAll('.seat.selected').forEach(el=>{
      const title = el.getAttribute('title') || '';
      const m = title.match(/—\s*(\d+)\s*грн/);
      if (m) total += Number(m[1]||0);
    });
    seatSumEl.textContent = total;
    btnCheckout.disabled = (ids.length === 0);
  }

  // ---------- загрузка show + hall + статусы ----------
  (async function boot(){
    try {
      // show.json
      const showURL = `/data/shows/${theatre}/${slug}.json`;
      const show = await fetchJSON(showURL);

      // цены по рядам из show.json (если есть)
      const priceByRow = new Map();
      if (Array.isArray(show.rows)){
        show.rows.forEach(r=>{
          const rowNum = Number(r.row), pr = Number(r.price);
          if (!isNaN(rowNum) && !isNaN(pr)) priceByRow.set(rowNum, pr);
        });
      }

      // hall.json: сначала вложенный путь, затем плоский
      const stage = (show.stage || DEFAULT_STAGE[theatre] || 'main').toLowerCase();
      let H = null;
      try{
        H = await fetchJSON(`/data/halls/${theatre}/${stage}.json`);
      }catch(e){
        if (e.status === 404) {
          H = await fetchJSON(`/data/halls/${theatre}.json`);
        } else throw e;
      }

      // статусы мест (опционально)
      try {
        const SUPABASE_URL = "https://yqhzekifwxotizsmaeaf.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_z1h_G-7K7HGCjOUtRZpI9Q_o1m9inZM";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const { data, error } = await sb
          .from("bookings")
          .select("seat_id,status,expires_at")
          .eq("show_slug", `${theatre}/${slug}`);

        if (!error && Array.isArray(data)){
          const nowIso = new Date().toISOString();
          data.forEach(row=>{
            if (row.status === 'reserved' && row.expires_at && row.expires_at < nowIso) return;
            statusMap.set(row.seat_id, row.status);
          });
        }
      } catch(e) { console.warn('Статуси місць недоступні:', e.message); }

      // выберем рендер в зависимости от формы данных
      if (Array.isArray(H.rows) && H.rows.length && typeof H.rows[0] === 'object' && 'row' in H.rows[0]){
        renderRowTableHall(H, priceByRow);     // твой формат Академії
      } else {
        renderFlatHall(H, priceByRow);         // плоский формат (Шевченко)
      }
    } catch (e){
      console.error(e);
      hallEl.textContent = 'Не вдалося завантажити схему залу.';
    }
  })();

  // ---------- переход к оплате ----------
  document.getElementById('to-checkout').addEventListener('click', ()=>{
    const ids = [...selected];
    const sum = Number(seatSumEl.textContent) || 0;

    const name  = document.getElementById('buyer-name').value.trim();
    const phone = document.getElementById('buyer-phone').value.trim();
    const email = document.getElementById('buyer-email').value.trim();

    const orderId = (theatre === 'shevchenko' ? 'SHEV-' : 'AKAD-') + Date.now();

    const url = new URL(location.origin + '/checkout.html');
    url.searchParams.set('show', `${theatre}/${slug}`);
    url.searchParams.set('seats', ids.join(','));
    url.searchParams.set('amount', String(sum));
    url.searchParams.set('order_id', orderId);
    if (name)  url.searchParams.set('name', name);
    if (phone) url.searchParams.set('phone', phone);
    if (email) url.searchParams.set('email', email);
    location.href = url.toString();
  });
</script>

</body>
</html>
