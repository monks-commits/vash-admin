<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Вибір місць — Театр ім. Шевченка</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <h1>Вибір місць</h1>
    <p id="show-caption">Вистава: shevchenko — ledi</p>

    <div class="hall-wrapper" id="hall-wrapper">
      <div id="hall" class="hall-grid"></div>
    </div>

    <div class="card">
      <h2>Дані покупця</h2>
      <div class="form-row">
        <div style="flex:1">
          <label for="buyerName">Ім’я та прізвище</label>
          <input id="buyerName" class="form-control" value="Александр Рябов" />
        </div>
        <div style="flex:1">
          <label for="buyerPhone">Телефон</label>
          <input id="buyerPhone" class="form-control" value="+380981261695" />
        </div>
      </div>
      <div class="form-row">
        <div style="flex:1">
          <label for="buyerEmail">Електронна пошта (куди надійде PDF-квиток)</label>
          <input id="buyerEmail" class="form-control" value="alexandrryabov@ukr.net" />
        </div>
      </div>
      <p>Вибрано місць: <strong id="seatCount">0</strong> • Сума: <strong id="totalAmount">0</strong> грн</p>
      <button id="goPay" class="button-primary" disabled>Перейти до оплати</button>
      <div id="inline-msg"></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/scripts/include.js" type="module"></script>
  <script>
  // 1. вашу виставу беремо з параметра
  const params = new URLSearchParams(location.search);
  const show = params.get("show") || "shevchenko/ledi";
  document.getElementById("show-caption").textContent = "Вистава: " + show.replace("/", " — ");

  // 2. тимчасово — генеруємо 20 місць в одному партері (P1-M1 ... P1-M20)
  // потім ти підставиш із Supabase allocations
  const SEATS = Array.from({length: 20}, (_,i) => ({
    id: `P1-M${i+1}`,
    label: i+1,
    price: 170
  }));

  const hallEl = document.getElementById("hall");
  const selected = new Set();

  SEATS.forEach(seat => {
    const div = document.createElement("div");
    div.className = "seat";
    div.textContent = seat.label;
    div.dataset.id = seat.id;
    div.addEventListener("click", () => {
      if (div.classList.contains("taken")) return;
      if (selected.has(seat.id)) {
        selected.delete(seat.id);
        div.classList.remove("selected");
      } else {
        selected.add(seat.id);
        div.classList.add("selected");
      }
      updateSummary();
    });
    hallEl.appendChild(div);
  });

  function updateSummary() {
    const seatCount = selected.size;
    const total = Array.from(selected).reduce((sum, id) => {
      const s = SEATS.find(x => x.id === id);
      return sum + (s ? s.price : 0);
    }, 0);
    document.getElementById("seatCount").textContent = seatCount;
    document.getElementById("totalAmount").textContent = total;
    document.getElementById("goPay").disabled = seatCount === 0;
  }

  document.getElementById("goPay").addEventListener("click", () => {
    const name  = document.getElementById("buyerName").value.trim();
    const phone = document.getElementById("buyerPhone").value.trim();
    const email = document.getElementById("buyerEmail").value.trim();
    const amount = document.getElementById("totalAmount").textContent;
    const seats = Array.from(selected).join(",");
    const orderId = show.split("/").pop().toUpperCase() + "-" + Date.now();

    if (!email) {
      document.getElementById("inline-msg").innerHTML = '<div class="error-box">Вкажіть e-mail, щоб надіслати PDF-квиток.</div>';
      return;
    }

    const url = new URL(location.origin + "/checkout.html");
    url.searchParams.set("show", show);
    url.searchParams.set("seats", seats);
    url.searchParams.set("amount", amount);
    url.searchParams.set("order_id", orderId);
    url.searchParams.set("name", encodeURIComponent(name));
    url.searchParams.set("phone", encodeURIComponent(phone));
    url.searchParams.set("email", encodeURIComponent(email));
    location.href = url.toString();
  });
  </script>
</body>
</html>
