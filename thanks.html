<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Дякуємо за оплату — Ваш Адмін</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="page" style="max-width:800px;margin:0 auto;padding:24px 16px 60px;">
    <h1>Дякуємо за оплату!</h1>
    <p id="p1">Ми надішлемо ваші квитки на e-mail.</p>

    <div class="card" style="margin-top:20px;">
      <p><strong>Номер замовлення:</strong> <span id="order"></span></p>
      <p><strong>Вистава:</strong> <span id="show"></span></p>
      <p><strong>Місця:</strong> <span id="seats"></span></p>
      <p><strong>Сума:</strong> <span id="amount"></span> грн</p>
    </div>

    <p style="margin-top:24px;">
      Якщо листа немає — перевірте «Спам» або напишіть нам у Telegram.
    </p>
    <p>
      <a class="btn" href="/afisha.html">Повернутися до афіші</a>
    </p>
  </main>

  <div id="site-footer"></div>

  <script src="/scripts/include.js"></script>
  <script>
    const p = new URLSearchParams(location.search);
    document.getElementById("order").textContent  = p.get("order_id") || "—";
    document.getElementById("show").textContent   = p.get("show") ? p.get("show").replace("/", " / ") : "—";
    document.getElementById("seats").textContent  = p.get("seats") ? decodeURIComponent(p.get("seats")).replace(/,/g, ", ") : "—";
    document.getElementById("amount").textContent = p.get("amount") || "—";
  </script>
</body>
</html>
