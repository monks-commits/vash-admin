<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Підтвердження та оплата — Ваш Адмін</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container" style="max-width:900px;">
    <h1>Підтвердження та оплата</h1>

    <section class="card">
      <h2>Підтвердження замовлення</h2>
      <p><b>Вистава:</b> <span id="showTitle"></span></p>
      <p><b>Місця:</b> <span id="seats"></span></p>
      <p><b>Сума:</b> <span id="amount"></span> грн</p>
      <p><b>Order ID:</b> <span id="orderId"></span></p>
    </section>

    <section class="card">
      <h2>Ваші контакти</h2>
      <div class="form-row">
        <div style="flex:1">
          <label>Ім’я та прізвище</label>
          <input id="name" class="form-control" />
        </div>
        <div style="flex:1">
          <label>Телефон</label>
          <input id="phone" class="form-control" />
        </div>
      </div>
      <div class="form-row">
        <div style="flex:1">
          <label>E-mail для отримання квитків</label>
          <input id="email" class="form-control" />
        </div>
      </div>
      <button id="payBtn" class="button-primary">Оплатити через LiqPay</button>
      <div id="payError"></div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="/scripts/include.js" type="module"></script>
  <script>
  // 1. зчитуємо параметри
  const p = new URLSearchParams(location.search);
  const show   = decodeURIComponent(p.get("show")  || "shevchenko/ledi");
  const seats  = decodeURIComponent(p.get("seats") || "");
  const amount = Number(p.get("amount") || 0);
  const orderId = p.get("order_id") || ("ORDER-" + Date.now());
  const name  = decodeURIComponent(p.get("name")  || "");
  const phone = decodeURIComponent(p.get("phone") || "");
  const email = decodeURIComponent(p.get("email") || "");

  document.getElementById("showTitle").textContent = show.replace("/", " — ");
  document.getElementById("seats").textContent = seats;
  document.getElementById("amount").textContent = amount;
  document.getElementById("orderId").textContent = orderId;

  document.getElementById("name").value = name;
  document.getElementById("phone").value = phone;
  document.getElementById("email").value = email;

  // 2. LiqPay функція
  const SIGN_URL = "https://yqhzekifwxotizsmaeaf.supabase.co/functions/v1/liqpay-sign"; // ← ВСТАВ СВІЙ ЯКЩО ІНШИЙ

  async function startPay() {
    const buyerName = document.getElementById("name").value.trim();
    const buyerPhone = document.getElementById("phone").value.trim();
    const buyerEmail = document.getElementById("email").value.trim();
    const errBox = document.getElementById("payError");
    errBox.innerHTML = "";

    if (!buyerEmail) {
      errBox.innerHTML = '<div class="error-box">Вкажіть e-mail — на нього надійде квиток.</div>';
      return;
    }

    try {
      const resp = await fetch(SIGN_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          public_key: "i69132711692",
          action: "pay",
          version: 3,
          amount: amount,
          currency: "UAH",
          description: show.replace("/", " — "),
          order_id: orderId,
          result_url: location.origin + "/thankyou.html",
          server_url: location.origin + "/supabase/functions/v1/liqpay-callback",
          info: {
            show,
            seats,
            name: buyerName,
            phone: buyerPhone,
            email: buyerEmail
          }
        })
      });

      if (!resp.ok) {
        const txt = await resp.text();
        throw new Error("Edge повернув " + resp.status + ": " + txt);
      }

      const { data, signature } = await resp.json();

      // відправляємо користувача на LiqPay
      const form = document.createElement("form");
      form.method = "POST";
      form.action = "https://www.liqpay.ua/api/3/checkout";
      form.acceptCharset = "utf-8";

      const i1 = document.createElement("input");
      i1.type = "hidden";
      i1.name = "data";
      i1.value = data;

      const i2 = document.createElement("input");
      i2.type = "hidden";
      i2.name = "signature";
      i2.value = signature;

      form.appendChild(i1);
      form.appendChild(i2);
      document.body.appendChild(form);
      form.submit();

    } catch (e) {
      console.error(e);
      errBox.innerHTML = '<div class="error-box">Помилка ініціалізації оплати: ' + e.message + '</div>';
    }
  }

  document.getElementById("payBtn").addEventListener("click", startPay);
  </script>
</body>
</html>
