<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Оплата — Ваш Адмін</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{background:#f4f4f6}
    main{max-width:900px;margin:0 auto;padding:24px 16px 60px}
    .card{background:#fff;border-radius:14px;padding:22px;margin-bottom:18px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .form-group{flex:1 1 260px;display:flex;flex-direction:column;gap:6px}
    .form-group input{height:44px;border:1px solid #d0d5dd;border-radius:10px;padding:0 12px;font-size:15px}
    .btn{background:#155EEF;color:#fff;border:none;border-radius:999px;padding:11px 26px;font-weight:600;cursor:pointer}
    .muted{color:#64748b}
    .error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:12px}
    .ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;border-radius:10px;padding:12px}
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <h1>Оплата онлайн</h1>

    <div class="card">
      <p class="muted" id="order-info">—</p>
    </div>

    <div class="card">
      <h2>Дані покупця</h2>
      <div class="row">
        <div class="form-group">
          <label for="name">Ім’я та прізвище</label>
          <input id="name" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="phone">Телефон</label>
          <input id="phone" autocomplete="tel" placeholder="+380..." />
        </div>
      </div>
      <div class="form-group" style="margin-top:12px">
        <label for="email">Електронна пошта</label>
        <input id="email" autocomplete="email" placeholder="you@example.com" />
      </div>

      <div id="msg" style="margin-top:14px"></div>

      <button id="pay" class="btn" style="margin-top:12px">Оплатити через LiqPay</button>
      <p class="muted" style="margin-top:8px">* При успішній оплаті квитки надійдуть на e-mail.</p>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/scripts/include.js"></script>
  <script>
    // ---- параметры из URL ----
    const q = new URLSearchParams(location.search);
    const show = q.get("show") || "";
    const seats = (q.get("seats") || "").split(",").filter(Boolean);
    const amount = Number(q.get("amount") || 0);
    let orderId = q.get("order_id") || ("ORD-" + Date.now());

    document.getElementById("order-info").textContent =
      `Вистава: ${show || "—"} · Місця: ${seats.join(", ") || "—"} · Сума: ${amount} грн · Номер: ${orderId}`;

    const nameEl  = document.getElementById("name");
    const phoneEl = document.getElementById("phone");
    const emailEl = document.getElementById("email");
    const msgEl   = document.getElementById("msg");
    const payBtn  = document.getElementById("pay");

    function showError(text){
      msgEl.className = "error"; msgEl.textContent = text;
    }
    function showOk(text){
      msgEl.className = "ok"; msgEl.textContent = text;
    }

    async function startPay(){
      msgEl.className = ""; msgEl.textContent = "";
      payBtn.disabled = true;

      try{
        const payload = {
          amount,
          order_id: orderId,
          show_slug: show,
          seats,
          buyer_name: nameEl.value.trim(),
          buyer_phone: phoneEl.value.trim(),
          buyer_email: emailEl.value.trim(),
          description: `Квитки: ${show} · ${seats.join(", ")}`
        };

        // ВАЖНО: только edge-функция! Никаких прямых insert в таблицу отсюда.
        const resp = await fetch("https://yqhzekifwxotizsmaeaf.supabase.co/functions/v1/liqpay-sign",{
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        // Если упали на дубликате (409) — сгенерируем новый order_id и повторим один раз
        if (resp.status === 409){
          orderId = orderId + "-R" + Date.now();
          const resp2 = await fetch("https://yqhzekifwxotizsmaeaf.supabase.co/functions/v1/liqpay-sign",{
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...payload, order_id: orderId })
          });
          if (!resp2.ok){
            const t2 = await resp2.text();
            throw new Error(`LiqPay-sign 2nd try: ${resp2.status} ${t2}`);
          }
          const data2 = await resp2.json();
          return redirectToLiqPay(data2);
        }

        if (!resp.ok){
          const t = await resp.text();
          throw new Error(`LiqPay-sign: ${resp.status} ${t}`);
        }

        const data = await resp.json();
        redirectToLiqPay(data);

      } catch(e){
        console.error(e);
        showError("Не вдалося зберегти замовлення. Спробуйте ще раз.");
        payBtn.disabled = false;
      }
    }

    function redirectToLiqPay(data){
      // ожидаем из функции { action, data, signature } — стандарт LiqPay
      if (!data || !data.action || !data.data || !data.signature){
        showError("Внутрішня помилка. Дані LiqPay не отримані.");
        payBtn.disabled = false;
        return;
      }
      // создаём автопост формой
      const form = document.createElement("form");
      form.method = "POST";
      form.action = data.action;
      form.innerHTML = `
        <input type="hidden" name="data" value="${data.data}">
        <input type="hidden" name="signature" value="${data.signature}">
      `;
      document.body.appendChild(form);
      showOk("Переходимо до LiqPay…");
      form.submit();
    }

    payBtn.addEventListener("click", startPay);
  </script>
</body>
</html>
