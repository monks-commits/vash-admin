<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Оплата квитків — Ваш Адмін</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body{background:#f4f4f6;}
    .page{max-width:1100px;margin:0 auto;padding:24px 16px 60px;}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px 18px 20px 18px;margin-bottom:18px;}
    .title{font-weight:700;font-size:20px;margin:0 0 6px;}
    .muted{color:#6b7280;}
    .small{font-size:13px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:768px){.grid2{grid-template-columns:1fr}}
    label{display:flex;flex-direction:column;gap:5px;font-weight:600}
    input{height:42px;border:1px solid #d1d5db;border-radius:10px;padding:0 10px;font-size:15px}
    .error-box{background:#fee2e2;border:1px solid #ef4444;border-radius:10px;padding:10px 12px;color:#7f1d1d;margin-bottom:10px;display:none}
    .ok-box{background:#ecfdf5;border:1px solid #10b981;border-radius:10px;padding:10px 12px;color:#065f46;margin-bottom:10px;display:none}
    .btn{background:#155EEF;color:#fff;border:none;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer}
    .btn:disabled{background:#9cb9ff;cursor:not-allowed}
  </style>
</head>
<body>
  <!-- шапка -->
  <div id="site-header"></div>

  <main class="page">
    <h1>Підтвердження та оплата</h1>

    <div id="err-top" class="error-box"></div>

    <!-- дані про замовлення -->
    <div class="card" id="order-card">
      <p class="title" id="show-title">Вистава</p>
      <p class="muted" id="show-meta"></p>
      <p style="margin-top:10px">
        <span class="muted">Місця:</span>
        <span id="show-seats" style="font-weight:700">—</span>
      </p>
      <p style="margin-top:4px">
        <span class="muted">Сума до сплати:</span>
        <span id="show-amount" style="font-weight:700">0 грн</span>
      </p>
      <p class="small" style="margin-top:4px">
        Номер замовлення: <span id="order-id">—</span>
      </p>
    </div>

    <!-- покупець -->
    <div class="card">
      <p class="title" style="margin-bottom:14px">Дані покупця</p>
      <div class="grid2">
        <label>
          Ім’я та прізвище
          <input id="f-name" placeholder="Ваше ім’я" autocomplete="name" required />
        </label>
        <label>
          Телефон
          <input id="f-phone" placeholder="+380..." autocomplete="tel" required />
        </label>
      </div>
      <div style="margin-top:12px">
        <label>
          Електронна пошта (сюди прийде квиток)
          <input id="f-email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </label>
      </div>
      <p class="small muted" style="margin-top:10px">
        Якщо у театрі будуть зміни — ми зможемо вас знайти.
      </p>
    </div>

    <!-- оплата -->
    <div class="card">
      <p class="title" style="margin-bottom:10px">Оплата онлайн</p>
      <p class="muted small">
        Після оплати ви повернетеся на сайт. Ми отримаємо повідомлення від LiqPay та надішлемо ваші квитки.
      </p>
      <div id="err-pay" class="error-box"></div>
      <div id="ok-pay" class="ok-box"></div>
      <button id="liqpay-btn" class="btn">Оплатити через LiqPay</button>
    </div>
  </main>

  <!-- подвал -->
  <div id="site-footer"></div>

  <!-- подключаем общий include.js ИЗ КОРНЯ -->
  <script src="/scripts/include.js"></script>

  <!-- основна логіка checkout -->
  <script>
  // 1. читаем параметры из URL (их прислал hall.html)
  const params = new URLSearchParams(location.search);
  const show     = params.get("show")      || "shevchenko/ledi";
  const seats    = params.get("seats")     || "";
  const amount   = Number(params.get("amount") || 0);
  const orderId  = params.get("order_id")  || ("ORDER-" + Date.now());

  // 2. подставляем в шапку заказа
  document.getElementById("show-title").textContent  = "Вистава: " + show.replace("/", " / ");
  document.getElementById("show-seats").textContent  = seats ? seats.replace(/,/g, ", ") : "—";
  document.getElementById("show-amount").textContent = amount + " грн";
  document.getElementById("order-id").textContent    = orderId;

  // 3. заполняем поля, если их прислали из зала
  const nameFromHall  = params.get("name")  ? decodeURIComponent(params.get("name"))  : "";
  const phoneFromHall = params.get("phone") ? decodeURIComponent(params.get("phone")) : "";
  const mailFromHall  = params.get("email") ? decodeURIComponent(params.get("email")) : "";

  if (nameFromHall)  document.getElementById("f-name").value  = nameFromHall;
  if (phoneFromHall) document.getElementById("f-phone").value = phoneFromHall;
  if (mailFromHall)  document.getElementById("f-email").value = mailFromHall;

  // 4. кнопка LiqPay
  const btnPay   = document.getElementById("liqpay-btn");
  const errBox   = document.getElementById("err-pay");
  const okBox    = document.getElementById("ok-pay");

  btnPay.addEventListener("click", async () => {
    errBox.style.display = "none";
    errBox.textContent   = "";
    okBox.style.display  = "none";

    // берём то, что пользователь мог поправить перед оплатой
    const buyerName  = document.getElementById("f-name").value.trim();
    const buyerPhone = document.getElementById("f-phone").value.trim();
    const buyerEmail = document.getElementById("f-email").value.trim();

    if (!buyerName || !buyerPhone || !buyerEmail) {
      errBox.textContent = "Будь ласка, заповніть усі поля.";
      errBox.style.display = "block";
      return;
    }

    // 👇 вот ЭТО — куда вернуть после оплаты
    const returnUrl = `https://vash-admin.com/thanks.html?order_id=${encodeURIComponent(orderId)}&amount=${encodeURIComponent(amount)}&show=${encodeURIComponent(show)}&seats=${encodeURIComponent(seats)}`;

    // то, что подпишет edge-function
    const payload = {
      public_key: "i69132711692",       // твой паблик — как в Supabase
      version:    3,
      action:     "pay",
      amount:     amount,
      currency:   "UAH",
      description: `Квитки ${show} (${seats || "місця" })`,
      order_id:   orderId,
      // вот эти 2 строки важны 👇
      result_url: returnUrl,
      server_url: "https://vash-admin.com/api/liqpay-webhook"  // можешь пока не робити, LiqPay просто стукнется
    };

    try {
      btnPay.disabled = true;

      const res = await fetch("https://yqhzekifwxotizsmaeaf.supabase.co/functions/v1/liqpay-sign", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        throw new Error("Сервер підпису повернув помилку");
      }

      const { data, signature } = await res.json();

      // открываем LiqPay
      const form = document.createElement("form");
      form.method = "POST";
      form.action = "https://www.liqpay.ua/api/3/checkout";
      form.acceptCharset = "utf-8";

      const fData = document.createElement("input");
      fData.type = "hidden";
      fData.name = "data";
      fData.value = data;

      const fSign = document.createElement("input");
      fSign.type = "hidden";
      fSign.name = "signature";
      fSign.value = signature;

      form.appendChild(fData);
      form.appendChild(fSign);
      document.body.appendChild(form);
      form.submit();
    } catch (e) {
      console.error(e);
      errBox.textContent = "Помилка при формуванні оплати: " + e.message;
      errBox.style.display = "block";
    } finally {
      btnPay.disabled = false;
    }
  });
</script>


</body>
</html>
