<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Підготовка платежу — Ваш Адмін</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- header -->
  <div id="site-header"></div>

  <main class="main">
    <section class="section">
      <h1>Підготовка платежу…</h1>
      <div id="status" class="card" style="margin-top:12px"></div>
      <div id="debug" class="muted" style="margin-top:8px; display:none"></div>
    </section>
  </main>

  <!-- footer -->
  <div id="site-footer"></div>

  <!-- include header/footer -->
  <script type="module" src="scripts/include.js"></script>

  <script>
  // ===============================
  // 1) ВАЖНО: ваши актуальные значения
  // ===============================
  const SUPABASE_URL   = 'https://yqhzekifwxotizsmaeaf.supabase.co'; // ← домен проекта из Supabase (как в Edge Functions)
  const SIGN_FN_URL    = SUPABASE_URL + '/functions/v1/liqpay-sign';
  const LIQPAY_CHECKOUT= 'https://www.liqpay.ua/api/3/checkout';

  // Параметры заказа уже собираются из URL (show, seats, amount, order_id)

  async function initPayment(payload) {
    // Отправляем на Edge Function liqpay-sign
    const r = await fetch(SIGN_FN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }, // Authorization не нужен, т.к. Verify JWT выключен
      body: JSON.stringify(payload),
      // кэш и креденшелы не нужны
      cache: 'no-store',
      mode: 'cors',
    });

    if (!r.ok) {
      const t = await r.text().catch(()=>'');
      throw new Error(`Sign error ${r.status}: ${t || 'no body'}`);
    }
    return r.json();
  }

  async function startPay() {
    try {
      const params = new URLSearchParams(location.search);
      const amount   = Number(params.get('amount') || 0);
      const order_id = params.get('order_id') || ('ORDER-' + Date.now());
      const title    = params.get('title') || 'Квитки';
      const resultUrl= location.origin + '/thanks.html';
      const serverUrl= 'https://example.com/callback'; // если используете

      const payload = {
        action: 'pay',
        version: 3,
        currency: 'UAH',
        amount,
        description: title,
        order_id,
        result_url: resultUrl,
        server_url: serverUrl
      };

      const { data, signature } = await initPayment(payload);

      // Встраиваем LiqPay форму
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = LIQPAY_CHECKOUT;

      const f1 = document.createElement('input');
      f1.type = 'hidden'; f1.name = 'data'; f1.value = data;

      const f2 = document.createElement('input');
      f2.type = 'hidden'; f2.name = 'signature'; f2.value = signature;

      form.appendChild(f1); form.appendChild(f2);
      document.body.appendChild(form);
      form.submit();
    } catch (e) {
      console.error(e);
      showError(`Помилка ініціалізації оплати: ${e.message}`);
    }
  }

  function showError(msg) {
    const box = document.querySelector('#pay-error');
    if (box) box.textContent = msg;
    else alert(msg);
  }

  // Автозапуск на странице оплаты
  startPay();
</script>

</body>
</html>
