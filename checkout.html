<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Підтвердження та оплата — Ваш Адмін</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body { background:#f4f4f6; }
    .page { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
    .card {
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:14px;
      padding:18px 18px 20px;
      margin-bottom:18px;
    }
    .title { font-weight:700; font-size:20px; margin:0 0 6px; }
    .muted { color:#6b7280; }
    .small { font-size:13px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media (max-width:768px) { .grid2 { grid-template-columns:1fr; } }
    label { display:flex; flex-direction:column; gap:5px; font-weight:600; }
    input {
      height:42px;
      border:1px solid #d1d5db;
      border-radius:10px;
      padding:0 10px;
      font-size:15px;
    }
    .btn {
      background:#155EEF;
      color:#fff;
      border:none;
      border-radius:999px;
      padding:10px 18px;
      font-weight:600;
      cursor:pointer;
    }
    .btn:disabled { background:#9cb9ff; cursor:not-allowed; }
    .error-box {
      background:#fee2e2;
      border:1px solid #ef4444;
      border-radius:10px;
      padding:10px 12px;
      color:#7f1d1d;
      margin-bottom:10px;
      display:none;
    }
    .ok-box {
      background:#ecfdf5;
      border:1px solid #10b981;
      border-radius:10px;
      padding:10px 12px;
      color:#065f46;
      margin-bottom:10px;
      display:none;
    }
  </style>
</head>
<body>
  <!-- шапка з /partials/header.html -->
  <div id="site-header"></div>

  <main class="page">
    <h1>Підтвердження та оплата</h1>

    <div id="err-top" class="error-box"></div>

    <!-- замовлення -->
    <div class="card" id="order-card">
      <p class="title" id="show-title">Вистава</p>
      <p class="muted" id="show-meta"></p>
      <p style="margin-top:10px">
        <span class="muted">Місця:</span>
        <span id="show-seats" style="font-weight:700">—</span>
      </p>
      <p style="margin-top:4px">
        <span class="muted">Сума:</span>
        <span id="show-amount" style="font-weight:700">0 грн</span>
      </p>
      <p class="small" style="margin-top:4px">
        Номер замовлення: <span id="order-id">—</span>
      </p>
    </div>

    <!-- дані покупця -->
    <div class="card">
      <p class="title" style="margin-bottom:14px">Дані покупця</p>
      <div class="grid2">
        <label>
          Ім’я та прізвище
          <input id="f-name" placeholder="Ваше ім’я" autocomplete="name" />
        </label>
        <label>
          Телефон
          <input id="f-phone" placeholder="+380..." autocomplete="tel" />
        </label>
      </div>
      <div style="margin-top:12px">
        <label>
          Електронна пошта (сюди прийде квиток)
          <input id="f-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </label>
      </div>
      <p class="small muted" style="margin-top:10px">
        Якщо у театрі будуть зміни — ми зможемо вас знайти.
      </p>
    </div>

    <!-- оплата -->
    <div class="card">
      <p class="title" style="margin-bottom:10px">Оплата онлайн</p>
      <p class="muted small">Після оплати ви повернетеся на сайт.</p>
      <div id="err-pay" class="error-box"></div>
      <div id="ok-pay" class="ok-box"></div>
      <button id="liqpay-btn" class="btn">Оплатити через LiqPay</button>
    </div>
  </main>

  <!-- футер з /partials/footer.html -->
  <div id="site-footer"></div>

  <!-- Підтягування шапки/футера -->
  <script src="/scripts/include.js"></script>

  <!-- Логіка LiqPay -->
    <!-- підключаємо Supabase (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
  const qs = new URLSearchParams(location.search);
  const show = qs.get("show") || "shevchenko/ledi";
  const seats = (qs.get("seats") || "").split(",").filter(Boolean);
  const amount = Number(qs.get("amount") || "0");
  const orderId = qs.get("order_id") || ("ORDER-" + Date.now());

  const errBox = document.getElementById("err-pay");

  document.getElementById("liqpay-btn").addEventListener("click", async () => {
    const name  = document.getElementById("f-name").value.trim();
    const phone = document.getElementById("f-phone").value.trim();
    const email = document.getElementById("f-email").value.trim();

    // 1. валидация
    if (!name || !phone || !email) {
      errBox.textContent = "Заповніть ім’я, телефон і e-mail перед оплатою.";
      errBox.style.display = "block";
      return;
    }
    if (!amount || !seats.length) {
      errBox.textContent = "Немає суми або місць для оплати.";
      errBox.style.display = "block";
      return;
    }

    errBox.style.display = "none";

    try {
      const res = await fetch(
        "https://yqhzekifwxotizsmaeaf.supabase.co/functions/v1/liqpay-sign",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            description: `Квитки ${show} (${seats.join(",")})`,
            order_id: orderId,
            amount,
            currency: "UAH",
            show_slug: show,
            seats,
            customer_name: name,
            customer_phone: phone,
            customer_email: email,
            result_url: "https://vash-admin.com/thanks.html"
          }),
        }
      );

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(txt);
      }

      const { data, signature } = await res.json();

      // 3. отправляем форму в LiqPay
      const form = document.createElement("form");
      form.method = "POST";
      form.action = "https://www.liqpay.ua/api/3/checkout";

      const f1 = document.createElement("input");
      f1.type = "hidden";
      f1.name = "data";
      f1.value = data;
      form.appendChild(f1);

      const f2 = document.createElement("input");
      f2.type = "hidden";
      f2.name = "signature";
      f2.value = signature;
      form.appendChild(f2);

      document.body.appendChild(form);
      form.submit();
    } catch (e) {
      console.error(e);
      errBox.textContent = "Помилка при формуванні оплати: " + e.message;
      errBox.style.display = "block";
    }
  });
</script>



</body>
</html>
