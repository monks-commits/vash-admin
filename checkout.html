<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Підтвердження та оплата — Ваш Адмін</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { background:#f4f4f6; }
    main { max-width:1100px; margin:0 auto; padding:24px 16px 56px; }
    .card {
      background:#fff;
      border-radius:14px;
      padding:20px 22px 22px;
      margin-bottom:18px;
    }
    .title { font-size:28px; font-weight:700; margin-bottom:18px; }
    .muted { color:#64748b; font-size:13px; }
    .row { display:flex; gap:14px; flex-wrap:wrap; }
    .field {
      flex:1 1 240px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .field input {
      height:42px;
      border:1px solid #d0d5dd;
      border-radius:10px;
      padding:0 12px;
      font-size:14px;
    }
    .pay-btn {
      background:#155EEF;
      color:#fff;
      border:none;
      border-radius:999px;
      padding:11px 30px;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
    }
    .pay-btn:disabled { background:#9ab6ff; cursor:not-allowed; }
    .error-box {
      background:#fee2e2;
      color:#991b1b;
      border:1px solid #fecaca;
      border-radius:12px;
      padding:10px 14px;
      margin-top:12px;
      display:none;
      white-space:pre-wrap;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <h1 class="title">Підтвердження та оплата</h1>

    <!-- блок инфы по заказу -->
    <div class="card" id="order-box">
      <p><strong>Вистава:</strong> <span id="show-name">—</span></p>
      <p><strong>Місця:</strong> <span id="seats-list">—</span></p>
      <p><strong>Сума до сплати:</strong> <span id="amount">0</span> грн</p>
      <p class="muted" style="margin-top:8px;">Номер замовлення: <span id="order-id">—</span></p>
    </div>

    <!-- данные покупателя -->
    <div class="card">
      <h2>Дані покупця</h2>
      <div class="row" style="margin-top:10px;">
        <div class="field">
          <label for="buyer-name">Ім’я та прізвище</label>
          <input id="buyer-name" placeholder="Ваше ім’я" />
        </div>
        <div class="field">
          <label for="buyer-phone">Телефон</label>
          <input id="buyer-phone" placeholder="+380..." />
        </div>
      </div>
      <div class="field" style="margin-top:12px;">
        <label for="buyer-email">Електронна пошта (сюди прийде квиток)</label>
        <input id="buyer-email" placeholder="you@example.com" />
      </div>
    </div>

    <!-- оплата -->
    <div class="card">
      <h2>Оплата онлайн</h2>
      <p class="muted">Після оплати ви повернетеся на сайт.</p>
      <button id="pay-btn" class="pay-btn" style="margin-top:12px;">Оплатити через LiqPay</button>
      <div id="error-box" class="error-box"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <!-- общий include -->
  <script src="/scripts/include.js"></script>

  <script>
    // 1. читаем параметры из URL
    const params = new URLSearchParams(location.search);
    const show   = params.get("show") || "—";
    const seats  = params.get("seats") || "";
    const amount = Number(params.get("amount") || "0");
    const orderId = params.get("order_id") || ("ORD-" + Date.now());
    const name   = params.get("name")  ? decodeURIComponent(params.get("name"))  : "";
    const phone  = params.get("phone") ? decodeURIComponent(params.get("phone")) : "";
    const email  = params.get("email") ? decodeURIComponent(params.get("email")) : "";

    // 2. вставляем в верстку
    document.getElementById("show-name").textContent  = show.replace("/", " / ");
    document.getElementById("seats-list").textContent = seats || "—";
    document.getElementById("amount").textContent     = amount.toString();
    document.getElementById("order-id").textContent   = orderId;

    // 3. подставляем в поля, чтобы не вводить заново
    if (name)  document.getElementById("buyer-name").value  = name;
    if (phone) document.getElementById("buyer-phone").value = phone.startsWith("+") ? phone : "+" + phone;
    if (email) document.getElementById("buyer-email").value = email;

    // 4. обработчик кнопки оплаты
    const payBtn   = document.getElementById("pay-btn");
    const errorBox = document.getElementById("error-box");

    function showError(msg) {
      errorBox.style.display = "block";
      errorBox.textContent = "Помилка при формуванні оплати: " + msg;
    }

    async function createLiqpay() {
      errorBox.style.display = "none";
      payBtn.disabled = true;

      // соберём тело, которое ждёт наша edge-функция
      const body = {
        order_id: orderId,
        amount: amount,
        description: show + " (" + seats + ")",
        // чтобы в LiqPay тоже легли контакты
        info: {
          name: document.getElementById("buyer-name").value.trim(),
          phone: document.getElementById("buyer-phone").value.trim(),
          email: document.getElementById("buyer-email").value.trim(),
        }
      };

      try {
        const resp = await fetch("https://yqhzekifwxotizsmaeaf.functions.supabase.co/liqpay-sign", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        // если CORS/500 — поймаем здесь
        if (!resp.ok) {
          const txt = await resp.text();
          throw new Error("HTTP " + resp.status + ": " + txt.slice(0,200));
        }

        const json = await resp.json();
        if (!json.data || !json.signature) {
          throw new Error("У відповіді немає data/signature");
        }

        // 5. создаём форму и отправляем на LiqPay
        const form = document.createElement("form");
        form.method = "POST";
        form.action = "https://www.liqpay.ua/api/3/checkout";
        form.acceptCharset = "utf-8";

        const inpData = document.createElement("input");
        inpData.type = "hidden";
        inpData.name = "data";
        inpData.value = json.data;

        const inpSign = document.createElement("input");
        inpSign.type = "hidden";
        inpSign.name = "signature";
        inpSign.value = json.signature;

        form.appendChild(inpData);
        form.appendChild(inpSign);
        document.body.appendChild(form);
        form.submit();
      } catch (e) {
        console.error(e);
        showError(e.message);
      } finally {
        payBtn.disabled = false;
      }
    }

    payBtn.addEventListener("click", createLiqpay);
  </script>
</body>
</html>
