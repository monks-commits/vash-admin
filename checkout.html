<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Оплата квитків — Ваш Адмін</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body{background:#f4f4f6;}
    .page{max-width:1100px;margin:0 auto;padding:24px 16px 60px;}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px 18px 20px 18px;margin-bottom:18px;}
    .muted{color:#6b7280;}
    .title{font-weight:700;font-size:20px;margin:0 0 6px;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:768px){.grid2{grid-template-columns:1fr}}
    label{display:flex;flex-direction:column;gap:5px;font-weight:600}
    input{height:42px;border:1px solid #d1d5db;border-radius:10px;padding:0 10px;font-size:15px}
    .error-box{background:#fee2e2;border:1px solid #ef4444;border-radius:10px;padding:10px 12px;color:#7f1d1d;margin-bottom:10px;display:none}
    .ok-box{background:#ecfdf5;border:1px solid #10b981;border-radius:10px;padding:10px 12px;color:#065f46;margin-bottom:10px;display:none}
    .btn{background:#155EEF;color:#fff;border:none;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer}
    .btn:disabled{background:#9cb9ff;cursor:not-allowed}
    .small{font-size:13px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <h1>Підтвердження та оплата</h1>

    <div id="err-top" class="error-box"></div>

    <div class="card" id="order-card">
      <p class="title" id="show-title">Вистава</p>
      <p class="muted" id="show-meta"></p>
      <p style="margin-top:10px">
        <span class="muted">Місця:</span>
        <span id="show-seats" class="hl">—</span>
      </p>
      <p style="margin-top:4px">
        <span class="muted">Сума до сплати:</span>
        <span id="show-amount" class="hl">0 грн</span>
      </p>
      <p style="margin-top:4px" class="small">
        Номер замовлення: <span id="order-id">—</span>
      </p>
    </div>

    <div class="card">
      <p class="title" style="margin-bottom:14px">Дані покупця</p>
      <div class="grid2">
        <label>
          Ім’я та прізвище
          <input id="f-name" placeholder="Ваше ім’я" autocomplete="name" required />
        </label>
        <label>
          Телефон
          <input id="f-phone" placeholder="+380..." autocomplete="tel" required />
        </label>
      </div>
      <div style="margin-top:12px">
        <label>
          Електронна пошта (сюди прийде квиток)
          <input id="f-email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </label>
      </div>
      <p class="small muted" style="margin-top:10px">
        Якщо у театрі будуть зміни — ми зможемо вас знайти.
      </p>
    </div>

    <div class="card">
      <p class="title" style="margin-bottom:10px">Оплата онлайн</p>
      <p class="muted small">Після оплати ви повернетеся на сайт.</p>
      <div id="err-pay" class="error-box"></div>
      <div id="ok-pay" class="ok-box"></div>

      <div class="pay-wrap" style="margin-top:14px">
        <button id="liqpay-btn" class="btn">Оплатити через LiqPay</button>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/scripts/include.js"></script>

  <script>
    // 1. supabase (для запису замовлення)
    const SUPABASE_URL = "https://yqhzekifwotizsmaeaf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrZXVhYnRpZW1zeGFkdXNtcWxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2MDE3MzcsImV4cCI6MjA3NjE3NzczN30.aOHorW8nvctPxC1If_HNTl6iq_7cDHzFgFEPJg3PPPE";
    const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. читаем параметри з hall
    const p = new URLSearchParams(location.search);
    const show = p.get("show") || "";
    const seats = (p.get("seats") || "").split(",").filter(Boolean);
    const amount = Number(p.get("amount") || 0);
    const order_id = p.get("order_id") || ("ORD-" + Date.now());
    const name0 = decodeURIComponent(p.get("name") || "");
    const phone0 = decodeURIComponent(p.get("phone") || "");
    const email0 = decodeURIComponent(p.get("email") || "");

    document.getElementById("show-title").textContent = "Вистава: " + show.replace("/", " / ");
    document.getElementById("show-seats").textContent = seats.length ? seats.join(",") : "—";
    document.getElementById("show-amount").textContent = amount + " грн";
    document.getElementById("order-id").textContent = order_id;

    document.getElementById("f-name").value = name0;
    document.getElementById("f-phone").value = phone0;
    document.getElementById("f-email").value = email0;

    const liqpayBtn = document.getElementById("liqpay-btn");
    const errPay = document.getElementById("err-pay");
    const okPay = document.getElementById("ok-pay");

    function showErr(msg){
      errPay.textContent = msg;
      errPay.style.display = "block";
      okPay.style.display = "none";
    }

    async function ensureOrderRow() {
      // запис у таблицю orders (idempotent по order_id)
      try {
        await supa
          .from("orders")
          .upsert({
            order_id,
            show_slug: show,
            seats: seats,
            amount: amount,
            buyer_name: document.getElementById("f-name").value.trim(),
            buyer_phone: document.getElementById("f-phone").value.trim(),
            buyer_email: document.getElementById("f-email").value.trim(),
            liqpay_status: "init"
          }, { onConflict: "order_id" });
      } catch(e) {
        console.warn("supabase upsert err", e);
      }
    }

    liqpayBtn.addEventListener("click", async () => {
      const buyer_name = document.getElementById("f-name").value.trim();
      const buyer_phone = document.getElementById("f-phone").value.trim();
      const buyer_email = document.getElementById("f-email").value.trim();

      if (!buyer_name || !buyer_phone) {
        showErr("Заповніть ім’я та телефон.");
        return;
      }

      liqpayBtn.disabled = true;
      errPay.style.display = "none";

      await ensureOrderRow();

      // твоя edge-функція
      const EDGE_URL = "https://yqhzekifwotizsmaeaf.supabase.co/functions/v1/liqpay-sign";


      const body = {
        description: `Квитки ${show} (${seats.join(",")})`,
        order_id: order_id,
        amount: amount,
        currency: "UAH",
        result_url: `https://vash-admin.com/thanks.html?order_id=${encodeURIComponent(order_id)}&show=${encodeURIComponent(show)}&seats=${encodeURIComponent(seats.join(","))}&amount=${amount}`,
        email: buyer_email,
        phone: buyer_phone
      };

      try {
        const res = await fetch(EDGE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          throw new Error("edge відповів " + res.status);
        }
        const data = await res.json();
        // очікуємо від edge: { checkout_url: "..." }
        if (data.checkout_url) {
          location.href = data.checkout_url;
        } else if (data.data && data.signature) {
          // old-style: якщо edge повертає data/signature
          const form = document.createElement("form");
          form.action = "https://www.liqpay.ua/api/3/checkout";
          form.method = "POST";
          form.target = "_self";

          const in1 = document.createElement("input");
          in1.type = "hidden";
          in1.name = "data";
          in1.value = data.data;
          form.appendChild(in1);

          const in2 = document.createElement("input");
          in2.type = "hidden";
          in2.name = "signature";
          in2.value = data.signature;
          form.appendChild(in2);

          document.body.appendChild(form);
          form.submit();
        } else {
          showErr("Неочікувана відповідь від LiqPay");
        }
      } catch (e) {
        console.error(e);
        showErr("Помилка при формуванні оплати: " + e.message);
        liqpayBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
