<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Підтвердження та оплата — Ваш Адмін</title>
  <link rel="stylesheet" href="/styles.css" />
  <!-- supabase-js -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="main" style="max-width:1100px;margin:0 auto;padding:24px 16px 60px">
    <h1 style="margin-bottom:20px">Підтвердження та оплата</h1>

    <!-- Блок з даними замовлення -->
    <section id="order-summary" class="card" style="margin-bottom:20px;">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:10px;">Вистава</h2>
      <p id="order-show" class="meta">—</p>
      <p id="order-seats" class="meta">Місця: —</p>
      <p id="order-amount" class="meta">Сума до сплати: — грн</p>
      <p id="order-number" class="meta" style="margin-top:8px;">Номер замовлення: —</p>
    </section>

    <!-- Форма покупця -->
    <section class="card" style="margin-bottom:20px;">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">Дані покупця</h2>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <div style="flex:1 1 260px;">
          <label class="label">Імʼя та прізвище</label>
          <input id="buyer-name" class="input" placeholder="Ваше імʼя" />
        </div>
        <div style="flex:1 1 220px;">
          <label class="label">Телефон</label>
          <input id="buyer-phone" class="input" placeholder="+380..." />
        </div>
      </div>
      <div style="margin-top:12px;">
        <label class="label">Електронна пошта (сюди прийде квиток)</label>
        <input id="buyer-email" class="input" placeholder="you@example.com" />
      </div>
      <p id="seat-info" class="meta" style="margin-top:16px;">Вибрано місць: 0 • Сума: 0 грн</p>
    </section>

    <!-- Оплата -->
    <section class="card">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:10px;">Оплата онлайн</h2>
      <p class="meta" style="margin-bottom:14px;">Після оплати ви повернетеся на сайт.</p>
      <div id="checkout-error" style="display:none;background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:14px;"></div>
      <button id="pay-btn" class="btn primary">Оплатити через LiqPay</button>
    </section>
  </main>

  <div id="site-footer"></div>

  <!-- підключення шапки/футера -->
  <script type="module" src="/scripts/include.js"></script>

  <script>
    // === КОНСТАНТЫ ПРОЕКТА ===
    const SUPABASE_URL = "https://yqhzekifwxotizsmaeaf.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_z1h_G-7K7HGCjOUtRZpI9Q_o1m9inZM"; // ← ВСТАВЬ СВОЙ ANON KEY
    const LIQPAY_SIGN_URL = "https://yqhzekifwxotizsmaeaf.functions.supabase.co/liqpay-sign";

    // инициализация supabase
    const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // аккуратный декод с двойной попыткой
    function safeDecode(val) {
      if (!val) return "";
      try {
        return decodeURIComponent(decodeURIComponent(val));
      } catch (e1) {
        try {
          return decodeURIComponent(val);
        } catch (e2) {
          return val;
        }
      }
    }

    // парсим урл
    const params = new URLSearchParams(window.location.search);
    const show = safeDecode(params.get("show") || "");
    const seatsRaw = safeDecode(params.get("seats") || "");
    const amountRaw = safeDecode(params.get("amount") || "");
    const orderId = safeDecode(params.get("order_id") || "");
    const buyerNameParam = safeDecode(params.get("name") || "");
    const buyerPhoneParam = safeDecode(params.get("phone") || "");
    const buyerEmailParam = safeDecode(params.get("email") || "");

    // нормализуем
    const seatsArr = seatsRaw
      ? seatsRaw.split(",").map((s) => s.trim()).filter(Boolean)
      : [];
    const amount = Number(amountRaw) || 0;

    // заполняем форму
    document.getElementById("order-show").textContent = "Вистава: " + (show || "—");
    document.getElementById("order-seats").textContent = "Місця: " + (seatsArr.length ? seatsArr.join(", ") : "—");
    document.getElementById("order-amount").textContent = "Сума до сплати: " + amount + " грн";
    document.getElementById("order-number").textContent = "Номер замовлення: " + (orderId || "—");

    const buyerNameInput = document.getElementById("buyer-name");
    const buyerPhoneInput = document.getElementById("buyer-phone");
    const buyerEmailInput = document.getElementById("buyer-email");
    const seatInfo = document.getElementById("seat-info");
    const errBox = document.getElementById("checkout-error");

    buyerNameInput.value = buyerNameParam;
    buyerPhoneInput.value = buyerPhoneParam || "+380";
    buyerEmailInput.value = buyerEmailParam;

    seatInfo.textContent = "Вибрано місць: " + seatsArr.length + " • Сума: " + amount + " грн";

    // показ ошибки
    function showError(msg) {
      errBox.textContent = msg;
      errBox.style.display = "block";
    }

    async function createOrderInSupabase(payload) {
      // payload: { order_id, show_slug, seats, amount, buyer_name, buyer_phone, buyer_email }
      const { data, error } = await supa.from("orders").insert([{
        order_id: payload.order_id,
        show_slug: payload.show_slug,
        seats: payload.seats,       // jsonb
        amount: payload.amount,
        buyer_name: payload.buyer_name,
        buyer_phone: payload.buyer_phone,
        buyer_email: payload.buyer_email,
        liqpay_status: "pending"
      }]).select().single();

      if (error) {
        console.warn("insert order error", error);
        throw new Error("Не вдалося зберегти замовлення. Спробуйте ще раз.");
      }
      return data;
    }

    async function getLiqpaySignature(payload) {
      const res = await fetch(LIQPAY_SIGN_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const txt = await res.text();
        console.warn("liqpay-sign error", txt);
        throw new Error("Не вдалося отримати підпис LiqPay.");
      }

      return res.json();
    }

    async function handlePayClick() {
      errBox.style.display = "none";

      const buyer_name = buyerNameInput.value.trim();
      const buyer_phone = buyerPhoneInput.value.trim();
      const buyer_email = buyerEmailInput.value.trim();

      if (!seatsArr.length) {
        showError("Не вибрано місця.");
        return;
      }
      if (!amount) {
        showError("Сума замовлення = 0. Перевірте ціну.");
        return;
      }
      if (!buyer_name) {
        showError("Вкажіть імʼя.");
        return;
      }
      if (!buyer_phone) {
        showError("Вкажіть телефон.");
        return;
      }

      // 1. сохраняем заказ
      const orderPayload = {
        order_id: orderId || ("ORD-" + Date.now()),
        show_slug: show,
        seats: seatsArr,
        amount: amount,
        buyer_name,
        buyer_phone,
        buyer_email
      };

      try {
        await createOrderInSupabase(orderPayload);
      } catch (e) {
        showError(e.message);
        return;
      }

      // 2. просим liqpay-sign
      let liq;
      try {
        liq = await getLiqpaySignature({
          order_id: orderPayload.order_id,
          description: "Квитки: " + (show || "театр"),
          amount: amount
        });
      } catch (e) {
        showError(e.message);
        return;
      }

      if (!liq || !liq.data || !liq.signature) {
        showError("LiqPay повернув некоректну відповідь.");
        return;
      }

      // 3. отправляем на LiqPay
      const form = document.createElement("form");
      form.method = "POST";
      form.action = "https://www.liqpay.ua/api/3/checkout";
      form.acceptCharset = "utf-8";

      const dataInput = document.createElement("input");
      dataInput.type = "hidden";
      dataInput.name = "data";
      dataInput.value = liq.data;

      const signInput = document.createElement("input");
      signInput.type = "hidden";
      signInput.name = "signature";
      signInput.value = liq.signature;

      form.appendChild(dataInput);
      form.appendChild(signInput);
      document.body.appendChild(form);
      form.submit();
    }

    document.getElementById("pay-btn").addEventListener("click", handlePayClick);
  </script>
</body>
</html>
