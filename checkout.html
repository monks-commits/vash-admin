<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Оплата квитків — Ваш Адмін</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- LiqPay JS -->
  <script src="https://static.liqpay.ua/libjs/checkout.js"></script>
</head>
<body>
  <!-- header -->
  <div id="site-header"></div>

  <main class="main">
    <section class="section" style="max-width:860px;margin:0 auto">
      <h2>Оплата квитків</h2>
      <div id="orderInfo" class="card" style="margin-bottom:16px">Завантаження…</div>

      <form id="payForm" class="card" novalidate>
        <div class="row two">
          <label>Ім’я покупця
            <input type="text" id="buyer_name" required placeholder="Ваше ім’я" autocomplete="name" />
          </label>
          <label>Телефон
            <input type="tel" id="buyer_phone" required placeholder="+380..." inputmode="tel" autocomplete="tel" />
          </label>
        </div>

        <div class="row" style="margin-top:10px">
          <label>Електронна пошта
            <input type="email" id="buyer_email" required placeholder="example@gmail.com" autocomplete="email" />
            <span class="meta">На цю адресу прийде електронний квиток</span>
          </label>
        </div>

        <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
          <button type="submit" class="btn">Оплатити через LiqPay</button>
          <a class="btn secondary" id="backToHall" href="#">Змінити місця</a>
        </div>

        <div id="ok"  class="ok"  style="display:none">✅ Замовлення збережено. Відкриваємо LiqPay…</div>
        <div id="err" class="err" style="display:none"></div>
      </form>

      <!-- контейнер віджета LiqPay -->
      <div id="liqpay" style="margin-top:16px"></div>
    </section>
  </main>

  <!-- footer -->
  <div id="site-footer"></div>

  <script type="module" src="scripts/include.js"></script>
  <script type="module" src="scripts/liqpay.js"></script>
</body>
</html>
