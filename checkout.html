<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Підтвердження та оплата — Ваш Адмін</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container" style="max-width:900px">
    <h1>Підтвердження та оплата</h1>

    <section class="card">
      <h2>Підтвердження замовлення</h2>
      <p><b>Вистава:</b> <span id="showTitle"></span></p>
      <p><b>Місця:</b> <span id="seats"></span></p>
      <p><b>Сума:</b> <span id="amount"></span> грн</p>
      <p><b>Order ID:</b> <span id="orderId"></span></p>
    </section>

    <section class="card">
      <h2>Ваші контакти</h2>
      <div class="grid-2">
        <div>
          <label>Ім’я та прізвище</label>
          <input id="name" type="text" placeholder="Ваше ім’я та прізвище" />
        </div>
        <div>
          <label>Телефон</label>
          <input id="phone" type="tel" placeholder="+380..." />
        </div>
      </div>
      <div>
        <label>E-mail для отримання квитків</label>
        <input id="email" type="email" placeholder="you@example.com" />
      </div>

      <div class="row mt-12">
        <button id="payBtn" class="button-primary">Оплатити через LiqPay</button>
        <a class="button-secondary" id="backBtn" href="./spectacles/hall.html">Змінити місця</a>
      </div>

      <div id="err" class="alert error" style="display:none"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="./scripts/include.js"></script>

  <script>
  // ====== Налаштування (ваші чинні значення) ======
  const SUPABASE_URL       = 'https://yhqzekifwxotizsmaeaf.supabase.co';
  const SUPABASE_ANON_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlocXpla2lmd3hvdGl6c21hZWFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjk4Njc1ODgsImV4cCI6MjA0NTQ0MzU4OH0.6LO4qz7O0hQnGv1D4TnYtFQWn2YV4m9yEf0q5O2HqLk'; // ваш anon
  const SIGN_FN            = SUPABASE_URL + '/functions/v1/liqpay-sign';
  const CALLBACK_FN        = SUPABASE_URL + '/functions/v1/liqpay-callback';
  const LIQPAY_CHECKOUT    = 'https://www.liqpay.ua/api/3/checkout';

  const qs   = new URLSearchParams(location.search);
  const get  = (k, d='') => (qs.get(k) ?? d);

  const showSlug  = get('show');
  const seatsStr  = get('seats');
  const amountStr = get('amount');
  const orderId   = get('order_id');
  const nameInit  = decodeURIComponent(get('name', '')).replace(/\+/g,' ');
  const emailInit = get('email', '');
  const phoneInit = decodeURIComponent(get('phone','')).replace(/\+/g,' ');

  // Прив’язки элементов
  const el = {
    showTitle: document.getElementById('showTitle'),
    seats:     document.getElementById('seats'),
    amount:    document.getElementById('amount'),
    orderId:   document.getElementById('orderId'),
    name:      document.getElementById('name'),
    email:     document.getElementById('email'),
    phone:     document.getElementById('phone'),
    payBtn:    document.getElementById('payBtn'),
    err:       document.getElementById('err'),
  };

  // Заполняем UI
  el.showTitle.textContent = showSlug || '—';
  el.seats.textContent     = seatsStr || '—';
  el.amount.textContent    = amountStr || '—';
  el.orderId.textContent   = orderId || '—';
  el.name.value            = nameInit;
  el.email.value           = emailInit;
  el.phone.value           = phoneInit;

  function showError(msg){
    el.err.textContent = msg;
    el.err.style.display = 'block';
  }

  // Главная кнопка «Оплатити через LiqPay»
  el.payBtn.addEventListener('click', async () => {
    el.err.style.display = 'none';

    const amount = Number(amountStr);
    if (!amount || !orderId) {
      showError('Не вдалося зчитати суму або номер замовлення.');
      return;
    }

    // (необов’язково) – збережемо контактні дані
    try {
      const payloadOrder = {
        order_id: orderId,
        show_slug: showSlug,
        seats: seatsStr,
        name: el.name.value.trim(),
        email: el.email.value.trim(),
        phone: el.phone.value.trim(),
      };
      await fetch(SUPABASE_URL + '/rest/v1/orders', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(payloadOrder)
      });
    } catch(_) {}

    // Запит підпису у Edge Function
    try {
      const res = await fetch(SIGN_FN, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          // обов’язково:
          amount: amount,
          order_id: orderId,

          // додаткові поля для платіжного payload:
          action: 'pay',
          version: 3,
          currency: 'UAH',
          description: `${showSlug} — ${seatsStr}`,
          result_url: location.origin + '/thankyou.html?order_id=' + encodeURIComponent(orderId),
          server_url: CALLBACK_FN,
          language: 'uk'
        })
      });

      const json = await res.json();
      if (!res.ok) {
        throw new Error(json?.error || ('HTTP ' + res.status));
      }
      const { data, signature } = json;
      if (!data || !signature) {
        throw new Error('Від сервера не отримано підпис або data.');
      }

      // Відправляємо на LiqPay
      const f = document.createElement('form');
      f.method = 'POST';
      f.action = LIQPAY_CHECKOUT;
      f.innerHTML = `
        <input type="hidden" name="data" value="${data}">
        <input type="hidden" name="signature" value="${signature}">
      `;
      document.body.appendChild(f);
      f.submit();
    } catch (e) {
      showError('Помилка підготовки оплати: ' + (e.message || e));
    }
  });
  </script>

  <style>
    .grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .row    { display:flex; gap:12px; align-items:center; }
    .mt-12  { margin-top:12px }
    .alert.error { background:#ffe5e5; color:#b30000; padding:10px 12px; border-radius:8px; }
    input { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; }
    .button-primary { padding:10px 16px; border:none; border-radius:8px; background:#1e88e5; color:#fff; cursor:pointer; }
    .button-secondary { padding:10px 16px; border-radius:8px; border:1px solid #ccc; text-decoration:none; }
  </style>
</body>
</html>
