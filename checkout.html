<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Оплата квитків — Ваш Адмін</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body{background:#f4f4f6;}
    .page{max-width:1100px;margin:0 auto;padding:24px 16px 60px;}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px 18px 20px 18px;margin-bottom:18px;}
    .muted{color:#6b7280;}
    .title{font-weight:700;font-size:20px;margin:0 0 6px;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:768px){.grid2{grid-template-columns:1fr}}
    label{display:flex;flex-direction:column;gap:5px;font-weight:600}
    input{height:42px;border:1px solid #d1d5db;border-radius:10px;padding:0 10px;font-size:15px}
    .error-box{background:#fee2e2;border:1px solid #ef4444;border-radius:10px;padding:10px 12px;color:#7f1d1d;margin-bottom:10px;display:none}
    .ok-box{background:#ecfdf5;border:1px solid #10b981;border-radius:10px;padding:10px 12px;color:#065f46;margin-bottom:10px;display:none}
    .btn{background:#155EEF;color:#fff;border:none;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer}
    .btn:disabled{background:#9cb9ff;cursor:not-allowed}
    .small{font-size:13px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <h1>Підтвердження та оплата</h1>

    <div id="err-top" class="error-box"></div>

    <div class="card" id="order-card">
      <p class="title" id="show-title">Вистава</p>
      <p class="muted" id="show-meta"></p>
      <p style="margin-top:10px">
        <span class="muted">Місця:</span>
        <span id="show-seats" class="hl">—</span>
      </p>
      <p style="margin-top:4px">
        <span class="muted">Сума до сплати:</span>
        <span id="show-amount" class="hl">0 грн</span>
      </p>
      <p style="margin-top:4px" class="small">
        Номер замовлення: <span id="order-id">—</span>
      </p>
    </div>

    <div class="card">
      <p class="title" style="margin-bottom:14px">Дані покупця</p>
      <div class="grid2">
        <label>
          Ім’я та прізвище
          <input id="f-name" placeholder="Ваше ім’я" autocomplete="name" required />
        </label>
        <label>
          Телефон
          <input id="f-phone" placeholder="+380..." autocomplete="tel" required />
        </label>
      </div>
      <div style="margin-top:12px">
        <label>
          Електронна пошта (сюди прийде квиток)
          <input id="f-email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </label>
      </div>
      <p class="small muted" style="margin-top:10px">
        Якщо у театрі будуть зміни — ми зможемо вас знайти.
      </p>
    </div>

    <div class="card">
      <p class="title" style="margin-bottom:10px">Оплата онлайн</p>
      <p class="muted small">Після оплати ви повернетеся на сайт.</p>
      <div id="err-pay" class="error-box"></div>
      <div id="ok-pay" class="ok-box"></div>

      <div class="pay-wrap" style="margin-top:14px">
        <button id="liqpay-btn" class="btn">Оплатити через LiqPay</button>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/scripts/include.js"></script>

  <script>
  const url = new URL(location.href);
  const showSlug = url.searchParams.get("show") || "";
  const seats = (url.searchParams.get("seats") || "").split(",").filter(Boolean);
  const amount = Number(url.searchParams.get("amount") || "0");
  const orderId = url.searchParams.get("order_id") || ("ORD-" + Date.now());

  // эти три мы передавали из hall.html
  const buyerNameFromUrl  = decodeURIComponent(url.searchParams.get("name")  || "").replace(/\+/g, " ");
  const buyerPhoneFromUrl = decodeURIComponent(url.searchParams.get("phone") || "").replace(/\+/g, " ");
  const buyerEmailFromUrl = decodeURIComponent(url.searchParams.get("email") || "").replace(/\+/g, " ");

  // заполняем шапку
  document.getElementById("show-title").textContent = showSlug.replace("/", " / ");
  document.getElementById("show-seats").textContent = seats.join(",") || "—";
  document.getElementById("show-amount").textContent = amount + " грн";
  document.getElementById("order-id").textContent = orderId;

  // заполняем форму
  if (buyerNameFromUrl)  document.getElementById("f-name").value  = buyerNameFromUrl;
  if (buyerPhoneFromUrl) document.getElementById("f-phone").value = buyerPhoneFromUrl;
  if (buyerEmailFromUrl) document.getElementById("f-email").value = buyerEmailFromUrl;

  const btn = document.getElementById("liqpay-btn");
  const errBox = document.getElementById("err-pay");

  btn.addEventListener("click", async () => {
    errBox.style.display = "none";

    const buyerName  = document.getElementById("f-name").value.trim();
    const buyerPhone = document.getElementById("f-phone").value.trim();
    const buyerEmail = document.getElementById("f-email").value.trim();

    if (!buyerName || !buyerPhone || !buyerEmail) {
      errBox.textContent = "Заповніть усі поля покупця.";
      errBox.style.display = "block";
      return;
    }

    btn.disabled = true;

    try {
      // поставь сюда настоящий URL своей функции
      const fnUrl = "https://yqhzekifwxotizsmaeaf.functions.supabase.co/liqpay-sign";

      const res = await fetch(fnUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          amount,
          order_id: orderId,
          description: "Квитки " + showSlug,
          show_slug: showSlug,
          seats,
          buyer_name: buyerName,
          buyer_phone: buyerPhone,
          buyer_email: buyerEmail,
        })
      });

      const json = await res.json();
      if (!res.ok) {
        throw new Error(json.error || "Помилка ініціалізації LiqPay");
      }

      // формируем форму в LiqPay
      const form = document.createElement("form");
      form.method = "POST";
      form.action = "https://www.liqpay.ua/api/3/checkout";

      const fData = document.createElement("input");
      fData.type = "hidden";
      fData.name = "data";
      fData.value = json.data;

      const fSign = document.createElement("input");
      fSign.type = "hidden";
      fSign.name = "signature";
      fSign.value = json.signature;

      form.appendChild(fData);
      form.appendChild(fSign);
      document.body.appendChild(form);
      form.submit();
    } catch (e) {
      errBox.textContent = "Помилка при формуванні оплати: " + e.message;
      errBox.style.display = "block";
      btn.disabled = false;
    }
  });
</script>


</body>
</html>
