<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Оплата — Ваш Адмін</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{background:#f4f4f6}
    main{max-width:900px;margin:0 auto;padding:24px 16px 60px}
    .card{background:#fff;border-radius:14px;padding:22px;margin-bottom:18px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .form-group{flex:1 1 260px;display:flex;flex-direction:column;gap:6px}
    .form-group input{height:44px;border:1px solid #d0d5dd;border-radius:10px;padding:0 12px;font-size:15px}
    .btn{background:#155EEF;color:#fff;border:none;border-radius:999px;padding:11px 26px;font-weight:600;cursor:pointer}
    .muted{color:#64748b}
    .error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:12px}
    .ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;border-radius:10px;padding:12px}
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <h1>Оплата онлайн</h1>

    <div class="card">
      <p class="muted" id="order-info">—</p>
    </div>

    <div class="card">
      <h2>Дані покупця</h2>
      <div class="row">
        <div class="form-group">
          <label for="name">Ім’я та прізвище</label>
          <input id="name" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="phone">Телефон</label>
          <input id="phone" autocomplete="tel" placeholder="+380..." />
        </div>
      </div>
      <div class="form-group" style="margin-top:12px">
        <label for="email">Електронна пошта</label>
        <input id="email" autocomplete="email" placeholder="you@example.com" />
      </div>

      <div id="msg" style="margin-top:14px"></div>

      <button id="pay" class="btn" style="margin-top:12px">Оплатити через LiqPay</button>
      <p class="muted" style="margin-top:8px">* При успішній оплаті квитки надійдуть на e-mail.</p>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/scripts/include.js"></script>
  <script>
(async function () {
  const btn = document.querySelector('#pay-btn') || document.querySelector('button[type="button"], button.primary-btn');
  const $name  = document.querySelector('input[name="buyer_name"]')  || document.querySelector('#buyer-name');
  const $phone = document.querySelector('input[name="buyer_phone"]') || document.querySelector('#buyer-phone');
  const $email = document.querySelector('input[name="buyer_email"]') || document.querySelector('#buyer-email');

  // параметры из URL
  const q = new URLSearchParams(location.search);
  const show      = q.get('show');                           // shevchenko/ledi или akademia/akakiy
  const order_id  = q.get('order_id');                       // SHEV-..., AKAD-...
  const amount    = Number(q.get('amount') || '0');          // сумма
  const seats     = (q.get('seats') || '').split(',').filter(Boolean); // ["P18-M10", ...]

  // утилита ошибки
  const fail = (msg) => {
    console.error(msg);
    const box = document.querySelector('.error-box') || document.querySelector('.alert') || document.querySelector('.muted');
    if (box) { box.textContent = msg; box.style.color = '#b91c1c'; }
    alert(msg);
  };

  // сабмит
  btn?.addEventListener('click', async () => {
    const buyer_name  = ($name?.value || '').trim();
    const buyer_phone = ($phone?.value || '').trim();
    const buyer_email = ($email?.value || '').trim();

    // минимальная валидация (если хотите — уберите «обязательность»)
    if (!buyer_name || !buyer_phone || !buyer_email) {
      return fail('Будь ласка, заповніть ім’я, телефон та email.');
    }
    if (!order_id || !show || !amount || !seats.length) {
      return fail('Неповні параметри замовлення. Спробуйте ще раз.');
    }

    try {
      // 1) сохраняем заказ (upsert) — liqpay-sign
      const signRes = await fetch(
        'https://yqhzekifwxotizsmaeaf.supabase.co/functions/v1/liqpay-sign',
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount,
            order_id,
            show_slug: show,
            seats,
            buyer_name,
            buyer_phone,
            buyer_email,
            description: `Квитки: ${show} (${seats.join(', ')})`
          })
        }
      );

      if (!signRes.ok) {
        const t = await signRes.text();
        return fail(`Не вдалося зберегти замовлення (HTTP ${signRes.status}). ${t || ''}`);
      }

      // 2) запрашиваем данные для LiqPay — liqpay-init
      const initRes = await fetch(
        'https://yqhzekifwxotizsmaeaf.supabase.co/functions/v1/liqpay-init',
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount,
            order_id,
            description: `Замовлення ${order_id}`
          })
        }
      );

      if (!initRes.ok) {
        const t = await initRes.text();
        return fail(`Помилка формування платежу (HTTP ${initRes.status}). ${t || ''}`);
      }

      const { action, data, signature } = await initRes.json();

      // 3) Ставим авто-форму LiqPay и отправляем
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = action;
      form.style.display = 'none';

      const i1 = document.createElement('input');
      i1.name = 'data'; i1.value = data;
      const i2 = document.createElement('input');
      i2.name = 'signature'; i2.value = signature;

      form.append(i1, i2);
      document.body.appendChild(form);
      form.submit();
    } catch (e) {
      fail('Проблема з мережею або CORS. Спробуйте ще раз.');
      console.error(e);
    }
  });
})();
</script>

</body>
</html>
