<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Підтвердження та оплата — Ваш Адмін</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body { background:#f4f4f6; }
    .page { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
    .card {
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:14px;
      padding:18px 18px 20px;
      margin-bottom:18px;
    }
    .title { font-weight:700; font-size:20px; margin:0 0 6px; }
    .muted { color:#6b7280; }
    .small { font-size:13px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media (max-width:768px) { .grid2 { grid-template-columns:1fr; } }
    label { display:flex; flex-direction:column; gap:5px; font-weight:600; }
    input {
      height:42px;
      border:1px solid #d1d5db;
      border-radius:10px;
      padding:0 10px;
      font-size:15px;
    }
    .btn {
      background:#155EEF;
      color:#fff;
      border:none;
      border-radius:999px;
      padding:10px 18px;
      font-weight:600;
      cursor:pointer;
    }
    .btn:disabled { background:#9cb9ff; cursor:not-allowed; }
    .error-box {
      background:#fee2e2;
      border:1px solid #ef4444;
      border-radius:10px;
      padding:10px 12px;
      color:#7f1d1d;
      margin-bottom:10px;
      display:none;
    }
    .ok-box {
      background:#ecfdf5;
      border:1px solid #10b981;
      border-radius:10px;
      padding:10px 12px;
      color:#065f46;
      margin-bottom:10px;
      display:none;
    }
  </style>
</head>
<body>
  <!-- шапка з /partials/header.html -->
  <div id="site-header"></div>

  <main class="page">
    <h1>Підтвердження та оплата</h1>

    <div id="err-top" class="error-box"></div>

    <!-- замовлення -->
    <div class="card" id="order-card">
      <p class="title" id="show-title">Вистава</p>
      <p class="muted" id="show-meta"></p>
      <p style="margin-top:10px">
        <span class="muted">Місця:</span>
        <span id="show-seats" style="font-weight:700">—</span>
      </p>
      <p style="margin-top:4px">
        <span class="muted">Сума:</span>
        <span id="show-amount" style="font-weight:700">0 грн</span>
      </p>
      <p class="small" style="margin-top:4px">
        Номер замовлення: <span id="order-id">—</span>
      </p>
    </div>

    <!-- дані покупця -->
    <div class="card">
      <p class="title" style="margin-bottom:14px">Дані покупця</p>
      <div class="grid2">
        <label>
          Ім’я та прізвище
          <input id="f-name" placeholder="Ваше ім’я" autocomplete="name" />
        </label>
        <label>
          Телефон
          <input id="f-phone" placeholder="+380..." autocomplete="tel" />
        </label>
      </div>
      <div style="margin-top:12px">
        <label>
          Електронна пошта (сюди прийде квиток)
          <input id="f-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </label>
      </div>
      <p class="small muted" style="margin-top:10px">
        Якщо у театрі будуть зміни — ми зможемо вас знайти.
      </p>
    </div>

    <!-- оплата -->
    <div class="card">
      <p class="title" style="margin-bottom:10px">Оплата онлайн</p>
      <p class="muted small">Після оплати ви повернетеся на сайт.</p>
      <div id="err-pay" class="error-box"></div>
      <div id="ok-pay" class="ok-box"></div>
      <button id="liqpay-btn" class="btn">Оплатити через LiqPay</button>
    </div>
  </main>

  <!-- футер з /partials/footer.html -->
  <div id="site-footer"></div>

  <!-- Підтягування шапки/футера -->
  <script src="/scripts/include.js"></script>

  <!-- Логіка LiqPay -->
  <script>
    // 1. що прилетіло з hall.html
    const params = new URLSearchParams(location.search);
    const show  = params.get("show")  || "shevchenko/ledi";
    const seats = (params.get("seats") || "").split(",").filter(Boolean);
    const amount = Number(params.get("amount") || "0");
    const orderId = params.get("order_id") || ("LEDI-" + Date.now());
    const nameFromUrl  = params.get("name")  ? decodeURIComponent(params.get("name"))  : "";
    const phoneFromUrl = params.get("phone") ? decodeURIComponent(params.get("phone")) : "";
    const emailFromUrl = params.get("email") ? decodeURIComponent(params.get("email")) : "";

    // 2. показати користувачу
    document.getElementById("show-title").textContent = "Вистава: " + show.replace("/", " — ");
    document.getElementById("show-meta").textContent  = "";
    document.getElementById("show-seats").textContent = seats.length ? seats.join(", ") : "—";
    document.getElementById("show-amount").textContent = amount + " грн";
    document.getElementById("order-id").textContent = orderId;

    // 3. підставити у форму
    if (nameFromUrl)  document.getElementById("f-name").value  = nameFromUrl;
    if (phoneFromUrl) document.getElementById("f-phone").value = phoneFromUrl;
    if (emailFromUrl) document.getElementById("f-email").value = emailFromUrl;

    const btn = document.getElementById("liqpay-btn");
    const errPay = document.getElementById("err-pay");

    // твоя функція-підписувач
    const SIGN_URL = "https://yqhzekifwxotizsmaeaf.supabase.co/functions/v1/liqpay-sign";
    // куди LiqPay буде стукати після оплати (ми потім зробимо цю функцію)
    const SERVER_CALLBACK = "https://yqhzekifwxotizsmaeaf.supabase.co/functions/v1/liqpay-callback";
    // куди повертати покупця після оплати
    const RETURN_URL = "https://vash-admin.com/thanks.html";

    btn.addEventListener("click", async () => {
      errPay.style.display = "none";

      const buyerName  = document.getElementById("f-name").value.trim();
      const buyerPhone = document.getElementById("f-phone").value.trim();
      const buyerEmail = document.getElementById("f-email").value.trim();

      if (!buyerName || !buyerPhone || !buyerEmail) {
        errPay.textContent = "Заповніть ім’я, телефон і e-mail.";
        errPay.style.display = "block";
        return;
      }

      btn.disabled = true;

      // збережемо в localStorage — щоб на thanks.html бачити хто платив
      localStorage.setItem("vash-admin-last-order", JSON.stringify({
        order_id: orderId,
        show,
        seats,
        amount,
        name: buyerName,
        phone: buyerPhone,
        email: buyerEmail
      }));

      // зібрали payload для LiqPay
      const payload = {
        version: 3,
        action: "pay",
        amount: amount,
        currency: "UAH",
        description: `Квитки ${show} (${seats.join(",")})`,
        order_id: orderId,
        // !! дуже важливо:
        result_url: RETURN_URL + `?order_id=${encodeURIComponent(orderId)}&amount=${amount}&show=${encodeURIComponent(show)}&seats=${encodeURIComponent(seats.join(","))}`,
        server_url: SERVER_CALLBACK,
        // щоб у тебе у LiqPay в деталях був e-mail/телефон
        sender_first_name: buyerName,
        phone: buyerPhone,
        customer: buyerEmail
      };

      try {
        const res = await fetch(SIGN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          throw new Error("Сервер підпису відповів " + res.status);
        }

        const { data, signature } = await res.json();

        // відкриваємо LiqPay у новій вкладці (можна і form submit'ом)
        const form = document.createElement("form");
        form.action = "https://www.liqpay.ua/api/3/checkout";
        form.method = "POST";
        form.acceptCharset = "utf-8";
        form.target = "_blank";

        const fData = document.createElement("input");
        fData.type = "hidden";
        fData.name = "data";
        fData.value = data;

        const fSign = document.createElement("input");
        fSign.type = "hidden";
        fSign.name = "signature";
        fSign.value = signature;

        form.appendChild(fData);
        form.appendChild(fSign);
        document.body.appendChild(form);
        form.submit();
      } catch (err) {
        console.error(err);
        errPay.textContent = "Помилка при формуванні оплати: " + err.message;
        errPay.style.display = "block";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
