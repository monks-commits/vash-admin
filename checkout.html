<!DOCTYPE html><html lang="uk">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Оплата — Ваш Адмін</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
<div id="site-header"></div>
<script type="module" src="/scripts/include.js"></script>

<main class="container">
  <h1>Оплата</h1>
  <div id="info" class="card" style="margin-bottom:12px"></div>

  <form id="form" class="card" novalidate>
    <div class="row two">
      <label>Ім’я<input id="name" required /></label>
      <label>Телефон<input id="phone" required placeholder="+380..." /></label>
    </div>
    <div class="row" style="margin-top:12px">
      <label>Е-пошта для квитків<input type="email" id="email" required placeholder="example@gmail.com"/></label>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" type="submit">Перейти до оплати</button>
      <a id="back" class="btn secondary" href="#">Змінити місця</a>
    </div>
  </form>
</main>

<div id="site-footer"></div>

<script>
(function(){
  const qp=new URLSearchParams(location.search);
  const show=qp.get('show'), seats=qp.get('seats'), sum=qp.get('sum');
  const info=document.getElementById('info'); const back=document.getElementById('back');
  if(!show||!seats||!sum){ info.innerHTML='<p>❌ Неповні дані для оплати.</p>'; document.getElementById('form').style.display='none'; return; }
  info.innerHTML=`<strong>Вистава:</strong> ${show.replace('/',' / ')}<br><strong>Місця:</strong> ${seats}<br><strong>Сума:</strong> ${sum} грн`;
  back.href=`/spectacles/hall.html?show=${encodeURIComponent(show)}`;

  document.getElementById('form').addEventListener('submit',e=>{
    e.preventDefault();
    alert('Далі — інтеграція з LiqPay (готова сторінка, підставимо API ключі).');
    // тут ініціалізуємо Edge Function liqpay-init → редірект на сторінку LiqPay
  });
})();
</script>
</body></html>
