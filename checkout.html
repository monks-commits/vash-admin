<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Підтвердження та оплата — Ваш Адмін</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body { background:#f4f4f6; }
    .page { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
    .card {
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:14px;
      padding:18px 18px 20px;
      margin-bottom:18px;
    }
    .title { font-weight:700; font-size:20px; margin:0 0 6px; }
    .muted { color:#6b7280; }
    .small { font-size:13px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media (max-width:768px) { .grid2 { grid-template-columns:1fr; } }
    label { display:flex; flex-direction:column; gap:5px; font-weight:600; }
    input {
      height:42px;
      border:1px solid #d1d5db;
      border-radius:10px;
      padding:0 10px;
      font-size:15px;
    }
    .btn {
      background:#155EEF;
      color:#fff;
      border:none;
      border-radius:999px;
      padding:10px 18px;
      font-weight:600;
      cursor:pointer;
    }
    .btn:disabled { background:#9cb9ff; cursor:not-allowed; }
    .error-box {
      background:#fee2e2;
      border:1px solid #ef4444;
      border-radius:10px;
      padding:10px 12px;
      color:#7f1d1d;
      margin-bottom:10px;
      display:none;
    }
    .ok-box {
      background:#ecfdf5;
      border:1px solid #10b981;
      border-radius:10px;
      padding:10px 12px;
      color:#065f46;
      margin-bottom:10px;
      display:none;
    }
  </style>
</head>
<body>
  <!-- шапка з /partials/header.html -->
  <div id="site-header"></div>

  <main class="page">
    <h1>Підтвердження та оплата</h1>

    <div id="err-top" class="error-box"></div>

    <!-- замовлення -->
    <div class="card" id="order-card">
      <p class="title" id="show-title">Вистава</p>
      <p class="muted" id="show-meta"></p>
      <p style="margin-top:10px">
        <span class="muted">Місця:</span>
        <span id="show-seats" style="font-weight:700">—</span>
      </p>
      <p style="margin-top:4px">
        <span class="muted">Сума:</span>
        <span id="show-amount" style="font-weight:700">0 грн</span>
      </p>
      <p class="small" style="margin-top:4px">
        Номер замовлення: <span id="order-id">—</span>
      </p>
    </div>

    <!-- дані покупця -->
    <div class="card">
      <p class="title" style="margin-bottom:14px">Дані покупця</p>
      <div class="grid2">
        <label>
          Ім’я та прізвище
          <input id="f-name" placeholder="Ваше ім’я" autocomplete="name" />
        </label>
        <label>
          Телефон
          <input id="f-phone" placeholder="+380..." autocomplete="tel" />
        </label>
      </div>
      <div style="margin-top:12px">
        <label>
          Електронна пошта (сюди прийде квиток)
          <input id="f-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </label>
      </div>
      <p class="small muted" style="margin-top:10px">
        Якщо у театрі будуть зміни — ми зможемо вас знайти.
      </p>
    </div>

    <!-- оплата -->
    <div class="card">
      <p class="title" style="margin-bottom:10px">Оплата онлайн</p>
      <p class="muted small">Після оплати ви повернетеся на сайт.</p>
      <div id="err-pay" class="error-box"></div>
      <div id="ok-pay" class="ok-box"></div>
      <button id="liqpay-btn" class="btn">Оплатити через LiqPay</button>
    </div>
  </main>

  <!-- футер з /partials/footer.html -->
  <div id="site-footer"></div>

  <!-- Підтягування шапки/футера -->
  <script src="/scripts/include.js"></script>

  <!-- Логіка LiqPay -->
    <!-- підключаємо Supabase (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ====== 1. Налаштування ======
    // твій проект: yqhzekifwxotizsmaeaf.supabase.co
    const SUPABASE_URL = "https://yqhzekifwxotizsmaeaf.supabase.co";
    const SUPABASE_ANON_KEY = "<<< eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrZXVhYnRpZW1zeGFkdXNtcWxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2MDE3MzcsImV4cCI6MjA3NjE3NzczN30.aOHorW8nvctPxC1If_HNTl6iq_7cDHzFgFEPJg3PPPE >>>";

    // якщо ключ вставлений – створюємо клієнта
    const supa = (SUPABASE_ANON_KEY.includes("<<<"))
      ? null
      : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // твоя edge-функція для підпису LiqPay
    const LIQPAY_SIGN_URL =
      "https://yqhzekifwxotizsmaeaf.supabase.co/functions/v1/liqpay-sign";

    // ====== 2. Розбір параметрів з URL ======
    const params = new URLSearchParams(location.search);

    const showSlug = params.get("show") || "shevchenko/ledi";
    const seatsStr = params.get("seats") || "";        // "P1-M1,P1-M2"
    const amount = Number(params.get("amount") || "0");
    const orderId = params.get("order_id") || ("LEDI-" + Date.now());

    // Для “людської” назви шоу можемо взяти частину після /
    const showTitle =
      showSlug.includes("/") ? showSlug.split("/")[1] : showSlug;

    // ====== 3. Підставляємо у верстку ======
    document.getElementById("show-title").textContent =
      "Вистава: " + showSlug.replace("/", "/");
    document.getElementById("show-meta").textContent = ""; // можна дату/час
    document.getElementById("show-seats").textContent =
      seatsStr ? seatsStr : "—";
    document.getElementById("show-amount").textContent =
      amount + " грн";
    document.getElementById("order-id").textContent = orderId;

    // ====== 4. Обробник кнопки LiqPay ======
    const btn = document.getElementById("liqpay-btn");
    const errBox = document.getElementById("err-pay");
    const okBox = document.getElementById("ok-pay");

    btn.addEventListener("click", async () => {
      errBox.style.display = "none";
      okBox.style.display = "none";

      const buyerName = document.getElementById("f-name").value.trim();
      const buyerPhone = document.getElementById("f-phone").value.trim();
      const buyerEmail = document.getElementById("f-email").value.trim();

      if (!buyerName || !buyerPhone || !buyerEmail) {
        errBox.textContent = "Заповніть, будь ласка, всі поля.";
        errBox.style.display = "block";
        return;
      }

      btn.disabled = true;

      // 4.1. Спочатку пишемо замовлення в Supabase (pending)
      try {
        if (supa) {
          const { error } = await supa.from("orders").upsert(
            [
              {
                order_id: orderId,
                show_slug: showSlug,
                seats: seatsStr ? seatsStr.split(",") : [],
                amount: amount,
                buyer_name: buyerName,
                buyer_phone: buyerPhone,
                buyer_email: buyerEmail,
                liqpay_status: "pending",
              },
            ],
            {
              onConflict: "order_id", // щоб при повторній оплаті оновило
            }
          );
          if (error) {
            console.warn("supabase insert error", error);
            // не зупиняємо оплату, просто йдемо далі
          }
        } else {
          console.warn("Supabase client не створений – немає anon key");
        }
      } catch (e) {
        console.warn("supabase upsert failed", e);
      }

      // 4.2. Готуємо тіло для edge-функції
      const description = `Квитки ${showTitle} (${seatsStr || "без місць"})`;

      const resultUrl = "https://vash-admin.com/thanks.html?" +
        new URLSearchParams({
          order_id: orderId,
          amount: amount,
          show: showSlug,
          seats: seatsStr,
        }).toString();

      const body = {
        amount: amount,
        currency: "UAH",
        description: description,
        order_id: orderId,
        // куди LiqPay поверне користувача
        result_url: resultUrl,
        // можемо поки не чіпати server_url
      };

      try {
        const res = await fetch(LIQPAY_SIGN_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body),
        });

        if (!res.ok) {
          throw new Error("LiqPay function error");
        }

        const { data, signature } = await res.json();

        // 4.3. Створюємо форму на https://www.liqpay.ua/api/3/checkout
        const form = document.createElement("form");
        form.method = "POST";
        form.action = "https://www.liqpay.ua/api/3/checkout";
        form.acceptCharset = "utf-8";

        const inputData = document.createElement("input");
        inputData.type = "hidden";
        inputData.name = "data";
        inputData.value = data;

        const inputSign = document.createElement("input");
        inputSign.type = "hidden";
        inputSign.name = "signature";
        inputSign.value = signature;

        form.appendChild(inputData);
        form.appendChild(inputSign);
        document.body.appendChild(form);

        form.submit();
      } catch (err) {
        console.error(err);
        errBox.textContent =
          "Помилка при формуванні оплати: " + err.message;
        errBox.style.display = "block";
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
