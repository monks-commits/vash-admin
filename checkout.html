<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Підтвердження та оплата — Ваш Адмін</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body { background:#f4f4f6; }
    main { max-width:1100px; margin:0 auto; padding:24px 16px 80px; }
    .card { background:#fff; border-radius:14px; padding:22px; margin-bottom:24px; }
    .muted { color:#64748b; }
    .primary-btn { background:#155EEF; color:#fff; border:none; border-radius:999px; padding:11px 28px; font-weight:600; cursor:pointer; }
    .danger { background:#fee2e2; color:#b91c1c; border:1px solid #fecaca; border-radius:12px; padding:12px 14px; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <h1>Підтвердження та оплата</h1>

    <div class="card" id="order-info">
      <h2 class="muted">Вистава</h2>
      <p id="show-line" class="muted">—</p>
      <p>Сума до сплати: <b id="amount">0</b> грн</p>
      <p>Номер замовлення: <span id="order-id">—</span></p>
    </div>

    <div class="card">
      <h2>Оплата онлайн</h2>
      <div id="error" class="danger" style="display:none;"></div>
      <button id="pay" class="primary-btn">Оплатити через LiqPay</button>
      <p class="muted" style="margin-top:10px;">Після оплати ми зафіксуємо оплату та надішлемо ваші квитки.</p>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/scripts/include.js"></script>

  <form id="liqpayForm" method="POST" action="https://www.liqpay.ua/api/3/checkout" style="display:none;">
    <input type="hidden" name="data" id="lp-data" />
    <input type="hidden" name="signature" id="lp-signature" />
  </form>

  <script>
    const qs = new URLSearchParams(location.search);
    const show = (qs.get('show') || '').trim();       // например: "shevchenko/ledi"
    const seats = (qs.get('seats') || '').trim();     // "P18-M10,P17-M9"
    const amount = Number(qs.get('amount') || 0);
    const orderId = (qs.get('order_id') || ('ORD-' + Date.now()));

    document.getElementById('show-line').textContent = 'Вистава: ' + show.replace('/', ' — ');
    document.getElementById('amount').textContent = amount;
    document.getElementById('order-id').textContent = orderId;

    const EDGE_URL = "https://yqhzekifwxotizsmaeaf.functions.supabase.co/liqpay-init"; // ваш endpoint

    function showError(msg){
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function startPayment(){
      try{
        if (!amount || !orderId) {
          showError('Невірні параметри замовлення (amount / order_id).');
          return;
        }

        // Опис для LiqPay (необязательно, но удобно)
        const description = `Квитки: ${show} • ${seats || 'без місць'}`;

        // Куда вернуться после оплаты
        const result_url = location.origin + "/thanks.html";
        // (Опционально) ваш webhook для фиксации платежа на сервере
        const server_url = ""; // можно оставить пустым на первом этапе

        const res = await fetch(EDGE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount, order_id: orderId, description, result_url, server_url, sandbox: 1 })
        });
        const data = await res.json();
        if (!res.ok) {
          console.error(data);
          showError('Не вдалося підготувати оплату (Edge).');
          return;
        }

        if (!data?.data || !data?.signature){
          showError('Некоректна відповідь від Edge: відсутні data/signature.');
          return;
        }

        document.getElementById('lp-data').value = data.data;
        document.getElementById('lp-signature').value = data.signature;
        document.getElementById('liqpayForm').submit();
      } catch(e){
        console.error(e);
        showError('Сталася помилка при підготовці оплати.');
      }
    }

    document.getElementById('pay').addEventListener('click', startPayment);
  </script>
</body>
</html>
