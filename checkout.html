<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Підтвердження та оплата — Ваш Адмін</title>
  <link rel="stylesheet" href="/styles.css" />
  <!-- supabase-js -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="main" style="max-width:1100px;margin:0 auto;padding:24px 16px 60px">
    <h1 style="margin-bottom:20px">Підтвердження та оплата</h1>

    <!-- Блок з даними замовлення -->
    <section id="order-summary" class="card" style="margin-bottom:20px;">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:10px;">Вистава</h2>
      <p id="order-show" class="meta">—</p>
      <p id="order-seats" class="meta">Місця: —</p>
      <p id="order-amount" class="meta">Сума до сплати: — грн</p>
      <p id="order-number" class="meta" style="margin-top:8px;">Номер замовлення: —</p>
    </section>

    <!-- Форма покупця -->
    <section class="card" style="margin-bottom:20px;">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">Дані покупця</h2>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <div style="flex:1 1 260px;">
          <label class="label">Імʼя та прізвище</label>
          <input id="buyer-name" class="input" placeholder="Ваше імʼя" />
        </div>
        <div style="flex:1 1 220px;">
          <label class="label">Телефон</label>
          <input id="buyer-phone" class="input" placeholder="+380..." />
        </div>
      </div>
      <div style="margin-top:12px;">
        <label class="label">Електронна пошта (сюди прийде квиток)</label>
        <input id="buyer-email" class="input" placeholder="you@example.com" />
      </div>
      <p id="seat-info" class="meta" style="margin-top:16px;">Вибрано місць: 0 • Сума: 0 грн</p>
    </section>

    <!-- Оплата -->
    <section class="card">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:10px;">Оплата онлайн</h2>
      <p class="meta" style="margin-bottom:14px;">Після оплати ви повернетеся на сайт.</p>
      <div id="checkout-error" style="display:none;background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:14px;"></div>
      <button id="pay-btn" class="btn primary">Оплатити через LiqPay</button>
    </section>
  </main>

  <div id="site-footer"></div>

  <!-- підключення шапки/футера -->
  <script type="module" src="/scripts/include.js"></script>

<script>
  // === КОНСТАНТЫ ПРОЕКТА ===
  const SUPABASE_URL = "https://yqhzekifwxotizsmaeaf.supabase.co";
  // 👇 сюда вставь НОВЫЙ public/publishable из вкладки API Keys
  const SUPABASE_ANON_KEY = "sb_publishable_z1h_G-7K7HGCjOUtRZpI9Q_o1m9inZM";
  const LIQPAY_SIGN_URL = "https://yqhzekifwxotizsmaeaf.functions.supabase.co/liqpay-sign";

  // инициализация supabase
  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // разбираем querystring
  const params = new URLSearchParams(window.location.search);
  const show = params.get("show") || "";
  const seats = params.get("seats") ? params.get("seats").split(",") : [];
  const amount = Number(params.get("amount") || 0);
  const orderId = params.get("order_id") || ("ORD-" + Date.now());

  // подставляем в шапку страницы
  document.getElementById("order-show").textContent = show.replace("/", " / ");
  document.getElementById("order-seats").textContent = seats.join(", ");
  document.getElementById("order-amount").textContent = amount + " грн";
  document.getElementById("order-id").textContent = orderId;

  const buyerNameInput = document.getElementById("buyer-name");
  const buyerPhoneInput = document.getElementById("buyer-phone");
  const buyerEmailInput = document.getElementById("buyer-email");
  const errorBox = document.getElementById("pay-error");
  const payBtn = document.getElementById("pay-btn");

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = "block";
  }

  function hideError() {
    errorBox.style.display = "none";
  }

  // 1. сохраняем заказ в таблицу orders
  async function saveOrder() {
    hideError();

    const buyer_name = buyerNameInput.value.trim();
    const buyer_phone = buyerPhoneInput.value.trim();
    const buyer_email = buyerEmailInput.value.trim();

    const { data, error } = await supa
      .from("orders")
      .insert([
        {
          order_id: orderId,
          show_slug: show,
          seats: seats,
          amount: amount,
          buyer_name,
          buyer_phone,
          buyer_email,
          status: "pending"
        }
      ])
      .select()
      .single();

    if (error) {
      console.error("insert order error", error);
      throw new Error("Не вдалося зберегти замовлення. Спробуйте ще раз.");
    }

    return data;
  }

  // 2. берём подпись у edge-функции и уходим на LiqPay
  async function startLiqpay() {
    const buyer_name = buyerNameInput.value.trim() || "Покупець";
    const body = {
      order_id: orderId,
      description: `Квитки ${show}`,
      amount: amount,
      sender_phone: buyerPhoneInput.value.trim(),
      email: buyerEmailInput.value.trim(),
    };

    const res = await fetch(LIQPAY_SIGN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const txt = await res.text();
      console.error("liqpay-sign error", txt);
      throw new Error("Не вдалося підготувати оплату (liqpay).");
    }

    const { data, signature } = await res.json();

    // формируем и отправляем форму
    const form = document.createElement("form");
    form.method = "POST";
    form.action = "https://www.liqpay.ua/api/3/checkout";

    const f1 = document.createElement("input");
    f1.type = "hidden";
    f1.name = "data";
    f1.value = data;

    const f2 = document.createElement("input");
    f2.type = "hidden";
    f2.name = "signature";
    f2.value = signature;

    form.appendChild(f1);
    form.appendChild(f2);
    document.body.appendChild(form);
    form.submit();
  }

  payBtn.addEventListener("click", async () => {
    try {
      payBtn.disabled = true;
      await saveOrder();     // сначала сохраняем
      await startLiqpay();   // потом уходим в liqpay
    } catch (e) {
      showError(e.message);
      payBtn.disabled = false;
    }
  });
</script>

</body>
</html>
