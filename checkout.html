<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Підтвердження та оплата — Ваш Адмін</title>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <div id="site-header"></div>

  <main class="container" style="max-width:900px">
    <h1>Підтвердження та оплата</h1>

    <section class="card">
      <h2>Підтвердження замовлення</h2>
      <p><b>Вистава:</b> <span id="showTitle"></span></p>
      <p><b>Місця:</b> <span id="seats"></span></p>
      <p><b>Сума:</b> <span id="amount"></span> грн</p>
      <p><b>Order ID:</b> <span id="orderId"></span></p>
    </section>

    <section class="card">
      <h2>Ваші контакти</h2>
      <div class="grid-2">
        <div>
          <label>Ім’я та прізвище</label>
          <input id="name" type="text" placeholder="Ім’я Прізвище"/>
        </div>
        <div>
          <label>Телефон</label>
          <input id="phone" type="tel" placeholder="+380__ ___ __ __"/>
        </div>
        <div class="col-2">
          <label>E-mail для отримання квитків</label>
          <input id="email" type="email" placeholder="you@example.com" required/>
        </div>
      </div>

      <div class="actions">
        <button id="payBtn" class="button-primary">Оплатити через LiqPay</button>
        <a id="editLink" class="button-secondary" href="#">Змінити місця</a>
      </div>

      <div id="error" class="alert error" style="display:none"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="./scripts/include.js"></script>

  <script>
  // ========= 1) НАСТРОЙКИ: УКАЖИТЕ СВОИ =========
  // URL вашего проекта Supabase (из Settings → API)
  const SUPABASE_URL = "https://yqhzekifwxotizsmaeaf.supabase.co"; // ← ВАШ проект
  // ANON KEY (из Settings → API)
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrZXVhYnRpZW1zeGFkdXNtcWxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2MDE3MzcsImV4cCI6MjA3NjE3NzczN30.aOHorW8nvctPxC1If_HNTl6iq_7cDHzFgFEPJg3PPPE";                  // ← ВСТАВИТЬ

  const SIGN_URL = SUPABASE_URL + "/functions/v1/liqpay-sign";

  // ========= 2) ЧТЕНИЕ ПАРАМЕТРОВ =========
  const q = new URLSearchParams(location.search);
  const show   = q.get("show")   || "";
  const seats  = q.get("seats")  || "";
  const amount = Number(q.get("amount") || 0);
  const orderId= q.get("order_id") || ("ORDER-" + Date.now());
  // предзаполним (если прилетело из формы под схемой)
  const presetName  = decodeURIComponent(q.get("name")  || "").replace(/\+/g, " ");
  const presetEmail = decodeURIComponent(q.get("email") || "").replace(/\+/g, " ");
  const presetPhone = decodeURIComponent(q.get("phone") || "").replace(/\+/g, " ");

  // ========= 3) РЕНДЕР =========
  showEl("showTitle", show.replace("/", " — "));
  showEl("seats", seats);
  showEl("amount", String(amount));
  showEl("orderId", orderId);

  const nameInp  = document.getElementById("name");
  const emailInp = document.getElementById("email");
  const phoneInp = document.getElementById("phone");
  if (presetName)  nameInp.value  = presetName;
  if (presetEmail) emailInp.value = presetEmail;
  if (presetPhone) phoneInp.value = presetPhone;

  // «Змінити місця»
  const edit = document.getElementById("editLink");
  edit.href = `/spectacles/hall.html?show=${encodeURIComponent(show)}`;
  
  // ========= 4) КНОПКА ОПЛАТЫ =========
  document.getElementById("payBtn").addEventListener("click", async () => {
    hideError();

    // простая валидация
    if (!emailInp.value.trim() || !nameInp.value.trim()) {
      return showError("Будь ласка, вкажіть ім’я та e-mail, щоб ми могли надіслати квитки.");
    }
    if (!amount || amount <= 0) {
      return showError("Сума платежу некоректна.");
    }

    // payload для підпису
    const payload = {
      public_key:    "i69132711692",      // ← ваш публічний LiqPay key (ви вже вказували)
      action:        "pay",
      version:       3,
      amount:        amount,
      currency:      "UAH",
      description:   `Оплата квитків: ${show} (${seats})`,
      order_id:      orderId,
      result_url:    location.origin + "/result.html", // можна змінити
      server_url:    SUPABASE_URL + "/functions/v1/liqpay-callback",
      // довідкова інформація (її не бачить LiqPay, лишається у нас):
      meta: {
        show, seats,
        buyer: { name: nameInp.value.trim(), email: emailInp.value.trim(), phone: phoneInp.value.trim() }
      }
    };

    try {
      // важливо: авторизація ANON KEY і CORS
      const r = await fetch(SIGN_URL, {
        method: "POST",
        mode: "cors",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },
        body: JSON.stringify(payload)
      });

      if (!r.ok) {
        const t = await r.text().catch(()=>"");
        throw new Error(`liqpay-sign HTTP ${r.status}. ${t}`);
      }

      const { data, signature, error } = await r.json();
      if (error) throw new Error(error);

      // редирект на LiqPay checkout
      const form = document.createElement("form");
      form.method = "POST";
      form.action = "https://www.liqpay.ua/api/3/checkout";
      form.target = "_self";

      const f1 = document.createElement("input");
      f1.type = "hidden"; f1.name = "data"; f1.value = data;

      const f2 = document.createElement("input");
      f2.type = "hidden"; f2.name = "signature"; f2.value = signature;

      form.appendChild(f1); form.appendChild(f2);
      document.body.appendChild(form);
      form.submit();
    } catch (e) {
      console.error("liqpay-sign error:", e);
      showError(`Помилка підготовки оплати: ${e.message || e}`);
    }
  });

  // ========= helpers =========
  function showEl(id, v){ const el = document.getElementById(id); if (el) el.textContent = v; }
  function showError(msg){ const b = document.getElementById("error"); b.textContent = msg; b.style.display = "block"; }
  function hideError(){ const b = document.getElementById("error"); b.style.display = "none"; }
  </script>

  <style>
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin:16px 0;box-shadow:0 1px 6px rgba(0,0,0,.05)}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .col-2{grid-column:1 / span 2}
    label{display:block;font-size:.9rem;margin-bottom:6px;color:#374151}
    input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px}
    .actions{display:flex;gap:12px;margin-top:12px}
    .button-primary{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
    .button-secondary{display:inline-block;border:1px solid #d1d5db;border-radius:8px;padding:10px 16px;color:#111;text-decoration:none}
    .alert.error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:8px;padding:12px;margin-top:12px}
  </style>
</body>
</html>
