<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Підготовка платежу… — Ваш Адмін</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <h1>Підготовка платежу…</h1>
    <div id="msg" class="card" style="padding:14px"></div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="scripts/include.js"></script>

  <script>
  (async function () {
    const SIGN_ENDPOINT =
      "https://yqhzekifwxotizsmaeaf.supabase.co/functions/v1/liqpay-sign"; // <<< ВСТАВЬ СВОЙ URL! 

    const params = new URLSearchParams(location.search);
    const show     = params.get("show") || "";
    const seats    = params.get("seats") || "";
    const amount   = Number(params.get("amount") || "0");
    const order_id = params.get("order_id") || ("ORDER-" + Date.now());

    const msg = document.getElementById("msg");

    function say(text, ok=false){
      msg.style.color = ok ? "#065f46" : "#991b1b";
      msg.textContent = text;
    }

    // Простая валидация
    if (!amount || amount < 1) { say("Сума платежу невалідна."); return; }

    // Формуємо опис
    const description = `Квитки: ${show} | місця: ${seats}`;

    // Куди повертати клієнта після оплати
    const result_url  = location.origin + "/thanks.html";
    // Куди LiqPay надішле server-to-server нотифікацію
    const server_url  = "https://YOUR-PROJECT-REF.supabase.co/functions/v1/liqpay-callback"; // опційно, якщо робимо S2S

    say("Формуємо платіж…");

    try {
      const payload = {
        // public_key можна не передавати — Edge-функція підставить з ENV (або провалідить, якщо є)
        action: "pay",
        version: 3,
        amount: amount,
        currency: "UAH",
        description,
        order_id,
        result_url,
        server_url
        // sandbox: 1 // якщо потрібно тестово — додай це поле, але в проді прибери
      };

      const r = await fetch(SIGN_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // Якщо в liqpay-sign увімкнено «Verify JWT with legacy secret», додай:
        // headers: { "Content-Type":"application/json", "Authorization": "Bearer " + "<SUPABASE_ANON_KEY>" }
        body: JSON.stringify(payload),
        mode: "cors",
        cache: "no-store",
      });

      if (!r.ok) {
        const t = await r.text().catch(()=> "");
        throw new Error("sign HTTP " + r.status + (t ? (" — " + t) : ""));
      }

      const { data, signature } = await r.json();
      if (!data || !signature) {
        throw new Error("Відповідь підпису без полів data/signature");
      }

      // Готуємо форму для LiqPay
      say("Переадресація до LiqPay…", true);

      const form = document.createElement("form");
      form.action = "https://www.liqpay.ua/api/3/checkout";
      form.method = "POST";
      form.style.display = "none";

      const inpData = document.createElement("input");
      inpData.type = "hidden";
      inpData.name = "data";
      inpData.value = data;

      const inpSign = document.createElement("input");
      inpSign.type = "hidden";
      inpSign.name = "signature";
      inpSign.value = signature;

      form.appendChild(inpData);
      form.appendChild(inpSign);
      document.body.appendChild(form);
      form.submit();

    } catch (e) {
      console.error(e);
      say("Не вдалося ініціювати оплату. Спробуйте пізніше або зверніться в підтримку: +380981261695");
    }
  })();
  </script>
</body>
</html>
