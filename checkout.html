<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Оплата квитків — Ваш Адмін</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body{background:#f4f4f6;}
    .page{max-width:1100px;margin:0 auto;padding:24px 16px 60px;}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:18px;}
    .muted{color:#6b7280;}
    .title{font-weight:700;font-size:20px;margin:0 0 6px;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:768px){.grid2{grid-template-columns:1fr}}
    label{display:flex;flex-direction:column;gap:5px;font-weight:600}
    input{height:42px;border:1px solid #d1d5db;border-radius:10px;padding:0 10px;font-size:15px}
    .error-box{background:#fee2e2;border:1px solid #ef4444;border-radius:10px;padding:10px;color:#7f1d1d;margin-bottom:10px;display:none}
    .ok-box{background:#ecfdf5;border:1px solid #10b981;border-radius:10px;padding:10px;color:#065f46;margin-bottom:10px;display:none}
    .btn{background:#155EEF;color:#fff;border:none;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer}
    .btn:disabled{background:#9cb9ff;cursor:not-allowed}
    .small{font-size:13px}
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <h1>Підтвердження та оплата</h1>

    <div class="card">
      <p class="title" id="show-title">Вистава</p>
      <p class="muted" id="show-meta"></p>
      <p><span class="muted">Місця:</span> <span id="show-seats">—</span></p>
      <p><span class="muted">Сума:</span> <span id="show-amount">0 грн</span></p>
      <p class="small">Номер замовлення: <span id="order-id">—</span></p>
    </div>

    <div class="card">
      <p class="title">Дані покупця</p>
      <div class="grid2">
        <label>Ім’я та прізвище <input id="f-name" required /></label>
        <label>Телефон <input id="f-phone" required /></label>
      </div>
      <label>Електронна пошта <input id="f-email" type="email" required /></label>
    </div>

    <div class="card">
      <p class="title">Оплата онлайн</p>
      <button id="liqpay-btn" class="btn">Оплатити через LiqPay</button>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/scripts/include.js"></script>

  <script>
    const p = new URLSearchParams(location.search);
    document.getElementById("show-title").textContent = "Вистава: " + p.get("show");
    document.getElementById("show-seats").textContent = p.get("seats");
    document.getElementById("show-amount").textContent = p.get("amount") + " грн";
    document.getElementById("order-id").textContent = p.get("order_id");

    const btn = document.getElementById("liqpay-btn");
    btn.addEventListener("click", async () => {
      const data = {
        public_key: "i69132711692",
        version: "3",
        action: "pay",
        amount: p.get("amount"),
        currency: "UAH",
        description: "Квитки " + p.get("show"),
        order_id: p.get("order_id"),
        result_url: location.origin + "/thanks.html"
      };

      const res = await fetch("https://vash-admin.supabase.co/functions/v1/liqpay-sign", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const json = await res.json();
      if (!json.data) { alert("Помилка при підготовці платежу"); return; }

      const form = document.createElement("form");
      form.method = "POST";
      form.action = "https://www.liqpay.ua/api/3/checkout";
      form.innerHTML = `
        <input type="hidden" name="data" value="${json.data}" />
        <input type="hidden" name="signature" value="${json.signature}" />
      `;
      document.body.appendChild(form);
      form.submit();
    });
  </script>
</body>
</html>
