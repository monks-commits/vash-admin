  <div id="site-footer"></div>
  <script src="/scripts/include.js"></script>

  <script>
    // функция "раскрутить" до нормального текста
    function safeDecode(v) {
      if (!v) return "";
      let out = v;
      for (let i = 0; i < 2; i++) {        // максимум два раза
        try {
          out = decodeURIComponent(out);
        } catch (e) {
          break;
        }
      }
      return out;
    }

    const params  = new URLSearchParams(location.search);
    const show    = params.get("show")  || "shevchenko/ledi";
    const seats   = params.get("seats") || "";
    const amount  = Number(params.get("amount") || "0");
    const orderId = params.get("order_id") || ("ORD-" + Date.now());

    // берём то, что пришло (вдруг два раза закодировано)
    const qName  = safeDecode(params.get("name"));
    const qPhone = safeDecode(params.get("phone"));
    const qEmail = safeDecode(params.get("email"));

    document.getElementById("show-title").textContent = show.replace("/", " / ");
    const metaEl = document.getElementById("show-meta");
    if (metaEl) metaEl.textContent = "";
    document.getElementById("show-seats").textContent  = seats || "—";
    document.getElementById("show-amount").textContent = amount + " грн";
    document.getElementById("order-id").textContent    = orderId;

    const nameInput  = document.getElementById("f-name");
    const phoneInput = document.getElementById("f-phone");
    const emailInput = document.getElementById("f-email");

    if (qName)  nameInput.value  = qName;
    if (qPhone) phoneInput.value = qPhone.startsWith("+") ? qPhone : "+" + qPhone;
    if (qEmail) emailInput.value = qEmail;

    if (!nameInput.value) {
      const saved = localStorage.getItem("vashadmin_buyer");
      if (saved) {
        try {
          const obj = JSON.parse(saved);
          if (obj.name)  nameInput.value  = obj.name;
          if (obj.phone) phoneInput.value = obj.phone;
          if (obj.email) emailInput.value = obj.email;
        } catch (e) {}
      }
    }

    const LIQPAY_FN_URL = "https://yqhzekifwxotizsmaeaf.functions.supabase.co/liqpay-sign";
    const errBox = document.getElementById("err-pay");
    const btn    = document.getElementById("liqpay-btn");

    function showError(msg) {
      errBox.style.display = "block";
      errBox.textContent = msg;
    }
    function hideError() {
      errBox.style.display = "none";
      errBox.textContent = "";
    }

    btn.addEventListener("click", async () => {
      hideError();

      const buyerName  = nameInput.value.trim();
      const buyerPhone = phoneInput.value.trim();
      const buyerEmail = emailInput.value.trim();

      // запомним
      localStorage.setItem("vashadmin_buyer", JSON.stringify({
        name: buyerName,
        phone: buyerPhone,
        email: buyerEmail
      }));

      btn.disabled = true;
      try {
        const res = await fetch(LIQPAY_FN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            amount: amount,
            order_id: orderId,
            description: `Квитки ${show} (${seats})`,
            buyer_name: buyerName,
            buyer_phone: buyerPhone,
            buyer_email: buyerEmail
          })
        });

        if (!res.ok) {
          const txt = await res.text();
          showError("Помилка з LiqPay: " + txt);
          btn.disabled = false;
          return;
        }

        const { data, signature } = await res.json();
        if (!data || !signature) {
          showError("Від LiqPay не прийшли data/signature.");
          btn.disabled = false;
          return;
        }

        const form = document.createElement("form");
        form.method = "POST";
        form.action = "https://www.liqpay.ua/api/3/checkout";

        const inData = document.createElement("input");
        inData.type = "hidden";
        inData.name = "data";
        inData.value = data;

        const inSign = document.createElement("input");
        inSign.type = "hidden";
        inSign.name = "signature";
        inSign.value = signature;

        form.appendChild(inData);
        form.appendChild(inSign);
        document.body.appendChild(form);
        form.submit();
      } catch (e) {
        console.error(e);
        showError("Помилка при формуванні оплати: " + e.message);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
