<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Підтвердження та оплата — Ваш Адмін</title>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <div id="site-header"></div>

  <main class="container" style="max-width:900px">
    <h1>Підтвердження та оплата</h1>

    <section class="card">
      <h2>Підтвердження замовлення</h2>
      <p><b>Вистава:</b> <span id="showTitle"></span></p>
      <p><b>Місця:</b> <span id="seats"></span></p>
      <p><b>Сума:</b> <span id="amount"></span> грн</p>
      <p><b>Order ID:</b> <span id="orderId"></span></p>
    </section>

    <section class="card">
      <h2>Ваші контакти</h2>
      <div class="grid-2">
        <div>
          <label>Ім’я та прізвище</label>
          <input id="name" type="text" placeholder="Ім’я Прізвище"/>
        </div>
        <div>
          <label>Телефон</label>
          <input id="phone" type="tel" placeholder="+380__ ___ __ __"/>
        </div>
        <div class="col-2">
          <label>E-mail для отримання квитків</label>
          <input id="email" type="email" placeholder="you@example.com" required/>
        </div>
      </div>

      <div class="actions">
        <button id="payBtn" class="button-primary">Оплатити через LiqPay</button>
        <a id="editLink" class="button-secondary" href="#">Змінити місця</a>
      </div>

      <div id="error" class="alert error" style="display:none"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="./scripts/include.js"></script>

  <script>
  // *** ваши константы ***
  const SUPABASE_URL = 'https://yqhzekifwxotizsmaeaf.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc...'; // ваш anon key
  const SIGN_FN_URL = SUPABASE_URL + '/functions/v1/liqpay-sign';
  const LIQPAY_CHECKOUT = 'https://www.liqpay.ua/api/3/checkout';

  // элементы со страницы подтверждения
  const showTitleEl = document.getElementById('showTitle');
  const orderIdEl   = document.getElementById('orderId');
  const amountEl    = document.getElementById('amount');
  // поля контактов
  const nameInput   = document.getElementById('buyerName')  || document.getElementById('name')  || document.querySelector('input[name="name"]');
  const emailInput  = document.getElementById('buyerEmail') || document.getElementById('email') || document.querySelector('input[type="email"]');
  const phoneInput  = document.getElementById('buyerPhone') || document.getElementById('phone') || document.querySelector('input[type="tel"]');

  // кнопка «Оплатити через LiqPay»
  const payBtn = document.getElementById('payLiqPay') || document.querySelector('button[data-pay]');
  if (payBtn) payBtn.addEventListener('click', startPayment);

  async function startPayment() {
    payBtn.disabled = true;
    clearError();

    // собираем полезную нагрузку для подписи
    const payload = {
      // ОБЯЗАТЕЛЬНО:
      amount:  Number((amountEl?.textContent || amountEl?.innerText || '0').replace(/[^\d.]/g, '')),
      order_id: (orderIdEl?.textContent || orderIdEl?.innerText || '').trim(),

      // желательные поля:
      description: (showTitleEl?.textContent || 'Оплата квитків') + ' — vash-admin.com',
      currency: 'UAH',
      result_url: location.origin + '/thankyou.html',
      server_url: SUPABASE_URL + '/functions/v1/liqpay-callback',

      // для CRM / билетов:
      name:  (nameInput?.value || '').trim(),
      email: (emailInput?.value || '').trim(),
      phone: (phoneInput?.value || '').trim()
    };

    // простая валидация
    if (!payload.amount || !payload.order_id) {
      return showError('Не зібрані дані замовлення: amount / order_id.');
    }

    try {
      const res = await fetch(SIGN_FN_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const text = await res.text();
        throw new Error(`liqpay-sign ${res.status}: ${text}`);
      }

      const { data, signature, checkoutUrl } = await res.json();
      // сабмитим на liqpay
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = checkoutUrl || LIQPAY_CHECKOUT;
      form.innerHTML = `
        <input type="hidden" name="data" value="${data}">
        <input type="hidden" name="signature" value="${signature}">
      `;
      document.body.appendChild(form);
      form.submit();
    } catch (e) {
      showError('Помилка підготовки оплати: ' + e.message);
    } finally {
      payBtn.disabled = false;
    }
  }

  function showError(msg) {
    const box = document.querySelector('.error-box') || document.createElement('div');
    box.className = 'error-box';
    box.style.cssText = 'margin-top:16px;padding:12px;border-radius:8px;background:#fee2e2;color:#991b1b;';
    box.textContent = msg;
    const card = document.querySelector('.card') || document.querySelector('main') || document.body;
    card.appendChild(box);
    return false;
  }
  function clearError() {
    document.querySelectorAll('.error-box').forEach(n => n.remove());
  }
</script>

  <style>
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin:16px 0;box-shadow:0 1px 6px rgba(0,0,0,.05)}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .col-2{grid-column:1 / span 2}
    label{display:block;font-size:.9rem;margin-bottom:6px;color:#374151}
    input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px}
    .actions{display:flex;gap:12px;margin-top:12px}
    .button-primary{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
    .button-secondary{display:inline-block;border:1px solid #d1d5db;border-radius:8px;padding:10px 16px;color:#111;text-decoration:none}
    .alert.error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:8px;padding:12px;margin-top:12px}
  </style>
</body>
</html>
