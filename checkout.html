<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Підготовка платежу… — Ваш Адмін</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <h1>Підготовка платежу…</h1>
    <div id="msg" class="card" style="padding:14px"></div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="scripts/include.js"></script>

  <script>
(async function () {
  // 1) ВСТАВЬ свой endpoint функции ТОЧНО как в Supabase
  const SIGN_ENDPOINT = "https://yqhzekifwxotizsmaeaf.supabase.co/functions/v1/liqpay-sign";

  // 2) ЕСЛИ в liqpay-sign включено "Verify JWT with legacy secret" — впиши anon key сюда.
  // Если выключено — оставь пустым.
  const SUPABASE_ANON = ""; // напр. "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...."

  const params = new URLSearchParams(location.search);
  const show     = params.get("show") || "";
  const seats    = params.get("seats") || "";
  const amount   = Number(params.get("amount") || "0");
  const order_id = params.get("order_id") || ("ORDER-" + Date.now());

  const box = document.getElementById("msg");
  const say = (html, ok=false) => {
    box.style.color = ok ? "#065f46" : "#991b1b";
    box.innerHTML = html;
  };

  if (!amount || amount < 1) { say("Сума платежу невалідна."); return; }

  const description = `Квитки: ${show} | місця: ${seats}`;
  const result_url  = location.origin + "/thanks.html";
  const server_url  = "https://yqhzekifwxotizsmaeaf.supabase.co/functions/v1/liqpay-callback"; // опційно

  say(`Готуємо запит до підпису…<br><small>Endpoint: <code>${SIGN_ENDPOINT}</code></small>`);

  try {
    const headers = { "Content-Type": "application/json" };
    if (SUPABASE_ANON) headers.Authorization = "Bearer " + SUPABASE_ANON;

    const payload = {
      action: "pay",
      version: 3,
      amount,
      currency: "UAH",
      description,
      order_id,
      result_url,
      server_url
      // sandbox: 1, // якщо треба
    };

    const r = await fetch(SIGN_ENDPOINT, {
      method: "POST",
      headers,
      body: JSON.stringify(payload),
      mode: "cors",
      cache: "no-store"
    });

    const raw = await r.text();
    let parsed = null;
    try { parsed = JSON.parse(raw); } catch {}

    if (!r.ok) {
      say(`Підпис не отримано (HTTP ${r.status}).<br>
           <b>Відповідь:</b> <code>${raw.replace(/</g,"&lt;")}</code><br>
           <small>Перевір: URL функції, JWT toggle, CORS.</small>`);
      return;
    }

    const { data, signature } = parsed || {};
    if (!data || !signature) {
      say(`Функція відповіла без data/signature.<br>
           <b>Сирий JSON:</b> <code>${raw.replace(/</g,"&lt;")}</code>`);
      return;
    }

    say("Переадресація до LiqPay…", true);

    const form = document.createElement("form");
    form.action = "https://www.liqpay.ua/api/3/checkout";
    form.method = "POST";
    form.style.display = "none";

    const inpData = Object.assign(document.createElement("input"), {type:"hidden", name:"data", value:data});
    const inpSign = Object.assign(document.createElement("input"), {type:"hidden", name:"signature", value:signature});

    form.append(inpData, inpSign);
    document.body.appendChild(form);
    form.submit();

  } catch (e) {
    console.error(e);
    say("Помилка ініціалізації оплати: " + String(e));
  }
})();
</script>

</body>
</html>
