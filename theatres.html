<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Театри — Ваш Адмін</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .grid{display:grid;gap:14px}
    @media (min-width:860px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    .card{display:grid;gap:10px;background:#fff;border:1px solid #eee;border-radius:12px;padding:12px}
    .poster{width:100%;height:220px;object-fit:cover;border-radius:10px;background:#eee}
    .meta{color:#6b7280;font-size:14px}
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="main">
    <h1>Театри</h1>
    <div class="grid">
      <article class="card">
        <img class="poster" src="/images/shevchenko.jpg" alt="Театр Шевченка" />
        <div><strong>Театр ім. Т.Г. Шевченка</strong></div>
        <div class="meta">Кривий Ріг • Велика/Мала сцена</div>
        <div>
          <a class="btn" href="/afisha.html?city=Кривий%20Ріг">Афіша</a>
        </div>
      </article>

      <article class="card">
        <img class="poster" src="/images/opera.jpg" alt="Опера" />
        <div><strong>Опера</strong></div>
        <div class="meta">Дніпро</div>
        <div><a class="btn" href="/afisha.html?city=Дніпро">Афіша</a></div>
      </article>

      <article class="card">
        <img class="poster" src="/images/filarmonia.jpg" alt="Філармонія" />
        <div><strong>Філармонія</strong></div>
        <div class="meta">Дніпро</div>
        <div><a class="btn" href="/afisha.html?city=Дніпро">Афіша</a></div>
      </article>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="/scripts/include.js"></script>
</body>
</html>
