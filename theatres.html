<!DOCTYPE html><html lang="uk">
<head>
  <meta charset="utf-8"/>

  <title>Театри — Ваш Адмін</title>
  <link rel="stylesheet" href="/styles.css"/>

  <div id="site-header"></div>

  <main class="main">

    <div class="afisha-grid">
      <!-- ШЕВЧЕНКА -->
      <article class="card afisha-card">

          <div><strong>Театр ім. Т.Г. Шевченка</strong></div>
          <div class="meta">Кривий Ріг • Велика/Мала сцена</div>

        </div>
      </article>

      <!-- ОПЕРА -->
      <article class="card afisha-card">
        <img src="/images/opera.jpg" alt="Опера">
        <div>
          <div><strong>Опера</strong></div>
          <div class="meta">Дніпро</div>
          <p style="margin-top:8px">

      <!-- ФІЛАРМОНІЯ -->

          <div class="meta">Дніпро</div>
          <p style="margin-top:8px">
            <a class="btn" href="/afisha.html?city=Дніпро">Афіша</a>
          </p>
        </div>
      </article>

      <!-- АКАДЕМІЯ РУХУ — ДОБАВЛЕНО -->
      <article class="card afisha-card">
        <img src="/images/akademia.jpg" alt="Академія Руху">
        <div>
          <div><strong>Академія Руху</strong></div>
          <div class="meta">Дніпро</div>
          <p style="margin-top:8px">
            <a class="btn" href="/afisha.html?city=Дніпро">Афіша</a>
          </p>
        </div>
      </article>
    </div>
  </main>

  <div id="site-footer"></div>
