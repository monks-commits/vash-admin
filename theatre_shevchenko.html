<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Театр ім. Т.Г. Шевченка — репертуар</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .card{display:grid;gap:10px}
    .poster{width:100%;height:240px;object-fit:cover;border-radius:12px;background:#eee}
    .meta{color:#6b7280;font-size:13px}
  </style>
</head>
<body>
  <div id="header"></div>

  <main class="container">
    <h1>Театр ім. Т.Г. Шевченка — репертуар</h1>
    <p class="meta" style="margin:8px 0 12px">Сезонні спектаклі без прив’язки до дат. Оберіть виставу, щоб перейти на сторінку з описом або одразу до вибору місць.</p>

    <section class="section">
      <div id="grid" class="grid"></div>
      <div id="empty" class="meta" style="display:none">Немає жодної вистави в каталозі.</div>
      <div id="error" class="err" style="display:none;margin-top:12px"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script>
    Promise.all([
      fetch('header.html').then(r => r.text()),
      fetch('footer.html').then(r => r.text())
    ]).then(([h, f]) => {
      document.getElementById('header').innerHTML = h;
      document.getElementById('footer').innerHTML = f;
      const path = location.pathname.split('/').pop() || 'index.html';
      document.querySelectorAll('.nav a').forEach(a => { if (a.getAttribute('href') === path) a.classList.add('active'); });
    });

    (async function(){
      const grid  = document.getElementById('grid');
      const empty = document.getElementById('empty');
      const err   = document.getElementById('error');

      try{
        const resp = await fetch('data/catalog/shevchenko.json', { cache:'no-store' });
        if(!resp.ok) throw new Error('HTTP '+resp.status);
        const items = await resp.json();

        function cardHTML(x){
          const show = encodeURIComponent(x.slug);
          return `
            <article class="card">
              <img class="poster" src="${x.poster||''}" alt="${x.title||''}" onerror="this.style.display='none'">
              <div><strong>${x.title||''}</strong></div>
              <div class="meta">${x.stage||''}</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
                <a class="btn secondary" href="show.html?show=${show}">Детальніше</a>
                <a class="btn" href="spectacles/hall.html?show=${show}">Вибрати місця</a>
              </div>
            </article>
          `;
        }

        grid.innerHTML = items.map(cardHTML).join('');
        empty.style.display = items.length ? 'none':'block';
      }catch(e){
        err.textContent = 'Не вдалося завантажити каталог: ' + (e.message||e);
        err.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
