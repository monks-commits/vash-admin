<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Афіша — Ваш Адмін</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .filters{display:flex;gap:10px;margin:12px 0 16px;flex-wrap:wrap}
    .pill{padding:8px 14px;border-radius:10px;border:1px solid #e5e7eb;background:#f3f4f6;cursor:pointer}
    .pill.active{background:#2563eb;color:#fff;border-color:#2563eb}
    .grid{display:grid;gap:16px}
    @media (min-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    .card{background:#fff;border:1px solid #eee;border-radius:12px;padding:12px;display:grid;gap:12px}
    .poster{width:100%;height:260px;object-fit:cover;border-radius:10px;background:#eee}
    .meta{color:#6b7280;font-size:14px}
  </style>
</head>

<body>
  <header class="header">
    <a href="index.html" class="logo">Ваш Адмін</a>
    <nav class="nav">
      <a href="index.html">Головна</a>
      <a href="afisha.html" class="active">Афіша</a>
      <a href="theatres.html">Театри</a>
      <a href="about.html">Про нас</a>
      <a href="contacts.html">Контакти</a>
    </nav>
  </header>

  <main class="container">
    <h1>Афіша</h1>

    <div class="filters">
      <button class="pill active" data-city="all">Всі міста</button>
      <button class="pill" data-city="Дніпро">Дніпро</button>
      <button class="pill" data-city="Кривий Ріг">Кривий Ріг</button>
    </div>

    <div id="grid" class="grid"></div>
    <div id="empty" class="meta" style="display:none">Подій за вибраним фільтром поки немає.</div>
    <div id="error" class="meta" style="display:none;color:#b91c1c"></div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>© 2025 Ваш Адмін</div>
      <div class="footer-links">
        <a href="https://www.facebook.com/eventsandticketsdnepr/" target="_blank" rel="noopener noreferrer">Facebook</a>
        <a href="https://t.me/zahodiikvitki" target="_blank" rel="noopener noreferrer">Telegram</a>
      </div>
    </div>
  </footer>

  <script>
    (async function(){
      const grid  = document.getElementById('grid');
      const empty = document.getElementById('empty');
      const error = document.getElementById('error');
      const pills = Array.from(document.querySelectorAll('.pill'));

      let items = [];
      let current = 'all';

      const qps = new URLSearchParams(location.search);
      const qCity = qps.get('city');
      if (qCity) current = qCity;

      function setActive(city){
        pills.forEach(p => p.classList.toggle('active', (p.dataset.city||'all')===city));
      }

      function cardHTML(s){
        const poster = s.poster ? s.poster : '';
        const show   = encodeURIComponent(s.show);
        const title  = s.title || '';
        const when   = [s.date, s.time].filter(Boolean).join(' • ');
        const where  = [s.theatre, s.stage].filter(Boolean).join(' • ');
        const city   = s.city || '';
        return `
          <article class="card">
            <img class="poster" src="${poster}" alt="${title}" onerror="this.style.display='none'">
            <div><strong>${title}</strong></div>
            <div class="meta">${when}</div>
            <div class="meta">${where}</div>
            <div class="meta">${city}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
              <a class="btn secondary" href="show.html?show=${show}">Детальніше</a>
              <a class="btn" href="spectacles/hall.html?show=${show}">Вибрати місця</a>
            </div>
          </article>
        `;
      }

      function render(city='all'){
        const data = city==='all' ? items : items.filter(x => (x.city||'').toLowerCase() === city.toLowerCase());
        grid.innerHTML = data.map(cardHTML).join('');
        empty.style.display = data.length ? 'none' : 'block';
      }

      try{
        const resp = await fetch('data/afisha.json', { cache:'no-store' });
        if (!resp.ok) throw new Error('HTTP '+resp.status);
        items = await resp.json();
        setActive(current);
        render(current);
      }catch(e){
        error.textContent = 'Помилка завантаження афіші: ' + (e.message || e);
        error.style.display = 'block';
      }

      pills.forEach(p => {
        p.addEventListener('click', () => {
          current = p.dataset.city || 'all';
          setActive(current);
          render(current);
        });
      });
    })();
  </script>
</body>
</html>
