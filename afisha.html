<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Афіша — Ваш Адмін</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png">
  <style>
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 16px}
    .pill{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:#f3f4f6;cursor:pointer}
    .pill.active{background:#2563eb;color:#fff;border-color:#2563eb}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .card{display:grid;gap:10px}
    .poster{width:100%;height:260px;object-fit:cover;border-radius:10px;background:#eee}
    .meta{color:#6b7280;font-size:13px}
  </style>
</head>
<body>
  <!-- Спільний хедер -->
  <div id="header"></div>

  <main class="container">
    <h1>Афіша</h1>

    <!-- Фільтри за містом (будуються динамічно) -->
    <div id="filters" class="filters"></div>

    <!-- Сітка карток -->
    <div id="grid" class="grid"></div>
    <div id="empty" class="meta" style="display:none">Подій за вибраним фільтром поки немає.</div>
    <div id="error" class="err" style="display:none;margin-top:12px"></div>
  </main>

  <!-- Спільний футер -->
  <div id="footer"></div>

  <script>
    // Підключаємо header/footer
    Promise.all([
      fetch('header.html').then(r => r.text()),
      fetch('footer.html').then(r => r.text())
    ]).then(([h, f]) => {
      document.getElementById('header').innerHTML = h;
      document.getElementById('footer').innerHTML = f;

      // підсвітка активної вкладки
      const path = location.pathname.split('/').pop() || 'index.html';
      document.querySelectorAll('.nav a').forEach(a => {
        const href = a.getAttribute('href');
        if (href === path) a.classList.add('active');
      });
    });

    // ===== Логіка афіші =====
    (async function(){
      const filtersEl = document.getElementById('filters');
      const gridEl    = document.getElementById('grid');
      const emptyEl   = document.getElementById('empty');
      const errEl     = document.getElementById('error');

      let items = [];
      let currentCity = 'all';

      // Підтримка старту з ?city=
      const qps   = new URLSearchParams(location.search);
      const qCity = qps.get('city');
      if (qCity) currentCity = qCity;

      try{
        const resp = await fetch('data/afisha.json', { cache:'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        items = await resp.json();
      }catch(e){
        errEl.textContent = 'Не вдалося завантажити афішу: ' + (e.message || e);
        errEl.style.display = 'block';
        return;
      }

      // Зібрати унікальні міста
      const cities = Array.from(new Set(items.map(x => (x.city || '').trim()).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'uk'));
      const allCities = ['all', ...cities];

      // Побудувати кнопки-фільтри
      filtersEl.innerHTML = allCities.map(city => (
        `<button class="pill ${city === currentCity ? 'active':''}" data-city="${city}">
           ${city === 'all' ? 'Всі міста' : city}
         </button>`
      )).join('');

      // Обробник кліку по фільтрам
      filtersEl.querySelectorAll('.pill').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          filtersEl.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          currentCity = btn.dataset.city;
          render();
        });
      });

      function safe(str){ return String(str||''); }

      function cardHTML(s){
        const poster = safe(s.poster);
        const title  = safe(s.title);
        const date   = safe(s.date);
        const time   = safe(s.time);
        const theatre= safe(s.theatre);
        const stage  = safe(s.stage);
        const city   = safe(s.city);
        const show   = encodeURIComponent(s.show); // slug для show.html / hall.html

        return `
          <article class="card">
            <img class="poster" src="${poster}" alt="${title}" onerror="this.style.display='none'">
            <div><strong>${title}</strong></div>
            <div class="meta">${[date, time].filter(Boolean).join(' • ')}</div>
            <div class="meta">${[theatre, stage].filter(Boolean).join(' • ')}</div>
            <div class="meta">${city}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
              <a class="btn secondary" href="show.html?show=${show}">Детальніше</a>
              <a class="btn" href="spectacles/hall.html?show=${show}">Вибрати місця</a>
            </div>
          </article>
        `;
      }

      function render(){
        const data = currentCity === 'all'
          ? items
          : items.filter(x => (x.city || '').toLowerCase() === currentCity.toLowerCase());

        gridEl.innerHTML = data.map(cardHTML).join('');
        emptyEl.style.display = data.length ? 'none' : 'block';
      }

      render();
    })();
  </script>
</body>
</html>
