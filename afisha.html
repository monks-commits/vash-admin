<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Афіша — Ваш Адмін</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .grid{display:grid;gap:16px}
    @media (min-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;display:grid;gap:12px;box-shadow:var(--shadow)}
    .poster{width:100%;height:260px;object-fit:cover;border-radius:10px;background:#eee}
    .meta{color:#6b7280;font-size:14px}
    .filters{display:flex;gap:10px;margin:12px 0 16px;flex-wrap:wrap}
    .pill{padding:8px 14px;border-radius:10px;border:1px solid #e5e7eb;background:#f3f4f6;cursor:pointer}
    .pill.active{background:#2563eb;color:#fff;border-color:#2563eb}
  </style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <img src="/images/logo-placeholder.png" alt="Ваш Адмін" />
      <div>
        <h1>Ваш Адмін</h1>
        <p class="tagline">Квитки без комісій. Дніпро • Кривий Ріг</p>
      </div>
    </div>
    <nav class="nav">
      <a href="/index.html">Головна</a>
      <a href="/afisha.html" class="active">Афіша</a>
      <a href="/theatres.html">Театри</a>
      <a href="/about.html">Про нас</a>
      <a href="/contacts.html">Контакти</a>
    </nav>
  </div>
</header>

<main class="container">
  <h1>Афіша</h1>

  <div class="filters">
    <button class="pill active" data-city="all">Всі міста</button>
    <button class="pill" data-city="Дніпро">Дніпро</button>
    <button class="pill" data-city="Кривий Ріг">Кривий Ріг</button>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="meta" style="display:none">Подій за вибраним фільтром поки немає.</div>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div>© 2025 Ваш Адмін</div>
    <div class="social-icons">
      <a class="icon fb" href="https://www.facebook.com/eventsandticketsdnepr/" target="_blank"><span>FB</span></a>
      <a class="icon tg" href="https://t.me/zahodiikvitki" target="_blank"><span>TG</span></a>
      <a class="icon fb" href="https://www.facebook.com/admin.teatra.kr/" target="_blank"><span>FB KR</span></a>
      <a class="icon tg" href="https://t.me/krdramikom" target="_blank"><span>TG KR</span></a>
    </div>
  </div>
</footer>

<script>
(function(){
  const grid  = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const pills = document.querySelectorAll('.pill');

  const qps   = new URLSearchParams(location.search);
  let currentCity = (qps.get('city') || 'all');

  function normalizePoster(p){
    if(!p) return '/images/posters/placeholder.jpg';
    // превратим "images/..." или "./images/..." в "/images/..."
    return p.startsWith('/') ? p : '/'+p.replace(/^\.?\//,'');
  }

  function cardHTML(s){
    const poster = normalizePoster(s.poster || (`images/posters/${(s.show||'').replace('/','/')}.jpg`));
    const show   = encodeURIComponent(s.show);
    const when   = [s.date, s.time].filter(Boolean).join(' • ');
    const place  = [s.theatre, s.stage].filter(Boolean).join(' • ');
    return `
      <article class="card">
        <img class="poster" src="${poster}" alt="${s.title||''}"
             onerror="this.src='/images/posters/placeholder.jpg'">
        <div><strong>${s.title||s.show}</strong></div>
        <div class="meta">${when}</div>
        <div class="meta">${place}</div>
        <div class="meta">${s.city||''}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
          <a class="btn secondary" href="/show.html?show=${show}">Детальніше</a>
          <a class="btn" href="/spectacles/hall.html?show=${show}">Вибрати місця</a>
        </div>
      </article>
    `;
  }

  function render(items, city){
    const data = (city==='all')
      ? items
      : items.filter(x => (x.city||'').toLowerCase() === city.toLowerCase());
    grid.innerHTML = data.map(cardHTML).join('');
    empty.style.display = data.length ? 'none' : 'block';
  }

  function setActive(city){
    pills.forEach(p=>{
      p.classList.toggle('active', p.dataset.city === city || (city==='all' && p.dataset.city==='all'));
    });
  }

  pills.forEach(p=>{
    p.addEventListener('click', ()=>{
      currentCity = p.dataset.city;
      setActive(currentCity);
      render(window.__AFISHA || [], currentCity);
      history.replaceState(null, '', '?city=' + encodeURIComponent(currentCity));
    });
  });

  async function load(){
    try{
      const r = await fetch('/data/schedule/2025-11.json', {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const items = await r.json();
      // сортировка по дате/времени если есть
      items.sort((a,b)=>(a.date||'').localeCompare(b.date||'') || (a.time||'').localeCompare(b.time||''));
      window.__AFISHA = items;
      setActive(currentCity);
      render(items, currentCity);
    }catch(e){
      console.error(e);
      grid.innerHTML = '';
      empty.style.display = 'block';
      empty.textContent = 'Не вдалося завантажити афішу.';
    }
  }

  load();
})();
</script>
</body>
</html>
