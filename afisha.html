<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Афіша — Ваш Адмін</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:var(--shadow);padding:12px;display:grid;gap:10px}
    .poster-wrap{position:relative;width:100%;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#eef2f6}
    .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .meta{color:#6b7280;font-size:13px}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
    .pill{padding:8px 12px;border-radius:999px;border:1px solid #e5e7eb;background:#f3f4f6;cursor:pointer}
    .pill.active{background:#2563eb;color:#fff;border-color:#2563eb}
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="main">
    <h1>Афіша</h1>

    <div class="filters">
      <button class="pill active" data-city="all">Всі міста</button>
      <button class="pill" data-city="Дніпро">Дніпро</button>
      <button class="pill" data-city="Кривий Ріг">Кривий Ріг</button>
    </div>

    <div id="grid" class="grid"></div>
    <div id="empty" class="meta" style="display:none">Подій за вибраним фільтром поки немає.</div>
  </main>

  <div id="site-footer"></div>
  <script src="/scripts/include.js" type="module"></script>
  <script>
    (async function(){
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');
      const pills = document.querySelectorAll('.pill');

      // 1) тягнемо розклад листопада (заміните файл пізніше)
      let items = [];
      try {
        const r = await fetch('/data/schedule/2025-11.json', {cache:'no-store'});
        if (!r.ok) throw new Error('HTTP '+r.status);
        items = await r.json();
      } catch(e){
        console.error(e);
        grid.innerHTML = '<div class="meta">Наразі розклад не доступний.</div>';
        return;
      }

      // дозволяємо фільтр за ?city= або ?theatre=
      const q = new URLSearchParams(location.search);
      const qCity = q.get('city') || 'all';
      const qTheatre = q.get('theatre') || '';

      function cardHTML(s){
        const poster = s.poster ? ('/'+s.poster.replace(/^\/+/,'') ) : '';
        const show = encodeURIComponent(s.show);
        const desc = s.description ? s.description : '';
        return `
          <article class="card">
            <div class="poster-wrap">
              <img class="poster" src="${poster}" alt="${s.title||''}" onerror="this.style.display='none'">
            </div>
            <div><strong>${s.title||''}</strong></div>
            <div class="meta">${[s.date,s.time].filter(Boolean).join(' • ')}</div>
            <div class="meta">${[s.theatre,s.stage].filter(Boolean).join(' • ')}</div>
            <div class="meta">${s.city||''}</div>
            ${desc ? `<div class="meta">${desc}</div>` : ``}
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
              <a class="btn secondary" href="/show.html?show=${show}">Детальніше</a>
              <a class="btn" href="/spectacles/hall.html?show=${show}">Вибрати місця</a>
            </div>
          </article>
        `;
      }

      function applyFilter(city='all', theatre=''){
        let data = items;
        if (city !== 'all') data = data.filter(x => (x.city||'').toLowerCase()===city.toLowerCase());
        if (theatre) data = data.filter(x => (x.theatre||'').toLowerCase().includes(theatre.toLowerCase()));
        grid.innerHTML = data.map(cardHTML).join('');
        empty.style.display = data.length ? 'none' : 'block';
      }

      // активна пігулка міста
      pills.forEach(p=>p.classList.toggle('active', (p.dataset.city||'all')===qCity));
      pills.forEach(p=>{
        p.addEventListener('click', ()=>{
          pills.forEach(x=>x.classList.remove('active'));
          p.classList.add('active');
          applyFilter(p.dataset.city,'');
          // оновимо URL, але без перезавантаження
          const url = new URL(location.href);
          if (p.dataset.city==='all') url.searchParams.delete('city');
          else url.searchParams.set('city', p.dataset.city);
          history.replaceState({}, '', url);
        });
      });

      applyFilter(qCity, qTheatre);
    })();
  </script>
</body>
</html>
