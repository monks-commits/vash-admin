<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вистава — Ваш Адмін</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .wrap{display:grid;gap:16px}
    @media(min-width:900px){.wrap{grid-template-columns:280px 1fr}}
    .poster{width:100%;height:360px;object-fit:cover;border-radius:12px;background:#eee}
    .meta{color:#6b7280}
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="main">
    <div id="root" class="wrap"></div>
  </main>

  <div id="site-footer"></div>
  <script>
  (async function(){
    const root = document.getElementById('root');
    const q = new URLSearchParams(location.search);
    const slug = q.get('show');

    if (!slug){ root.innerHTML = '<p>❌ Не вказано виставу.</p>'; return; }

    try{
      const r = await fetch('/data/shows/'+slug+'.json', {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP '+r.status);
      const s = await r.json();

      const poster = s.poster ? '/' + s.poster.replace(/^\/+/, '') : '';
      const pretty = slug.split('/').join(' / ').replace(/-/g,' ');
      root.innerHTML = `
        <img class="poster" src="${poster}" onerror="this.style.display='none'">
        <div>
          <h1 style="margin:0 0 8px">${s.title || pretty}</h1>
          <div class="meta" style="margin-bottom:8px">${[s.city, s.theatre, s.stage].filter(Boolean).join(' • ')}</div>
          <div id="desc">${s.description || ''}</div>
          <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
            <a class="btn" href="/spectacles/hall.html?show=${encodeURIComponent(slug)}">Вибрати місця</a>
            <a class="btn secondary" href="/afisha.html">Назад до афіші</a>
          </div>
        </div>`;
    }catch(e){
      root.innerHTML = '<p>❌ Не вдалося завантажити дані вистави.</p>';
      console.error(e);
    }
  })();
  </script>
  <script type="module" src="/scripts/include.js"></script>
</body>
</html>
