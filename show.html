<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вистава — Ваш Адмін</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .show-wrap{display:grid;grid-template-columns:320px 1fr;gap:16px}
    @media (max-width:900px){.show-wrap{grid-template-columns:1fr}}
    .poster-lg{width:100%;height:440px;object-fit:cover;border-radius:12px;background:#eee}
    .show-meta{color:#6b7280;font-size:14px}
  </style>
</head>
<body>
  <div id="header"></div>

  <main class="container">
    <a class="btn secondary" href="afisha.html" style="margin:16px 0 8px;display:inline-block">← Повернутися до афіші</a>

    <section class="section">
      <div id="showBox" class="show-wrap">
        <img id="poster" class="poster-lg" src="" alt="" onerror="this.style.display='none'">
        <div>
          <h1 id="title" style="margin-bottom:6px">Вистава</h1>
          <div class="show-meta" id="meta"></div>

          <div id="desc" style="margin-top:12px;line-height:1.7"></div>

          <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
            <a id="toHall" class="btn" href="#">Вибрати місця</a>
            <a class="btn secondary" href="afisha.html">Інші події</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script>
    // Подключаем общий header/footer
    Promise.all([
      fetch('header.html').then(r => r.text()),
      fetch('footer.html').then(r => r.text())
    ]).then(([h, f]) => {
      document.getElementById('header').innerHTML = h;
      document.getElementById('footer').innerHTML = f;

      // активная вкладка
      const path = location.pathname.split('/').pop() || 'index.html';
      document.querySelectorAll('.nav a').forEach(a => {
        const href = a.getAttribute('href');
        if (href === path) a.classList.add('active');
      });
    });

    // ====== Логика страницы спектакля ======
    (async function(){
      const qp   = new URLSearchParams(location.search);
      const slug = qp.get('show'); // напр. "shevchenko/za-dvoma-zaytsiamy"

      const els = {
        title:  document.getElementById('title'),
        meta:   document.getElementById('meta'),
        poster: document.getElementById('poster'),
        desc:   document.getElementById('desc'),
        toHall: document.getElementById('toHall')
      };

      if (!slug){
        els.title.textContent = 'Помилка: не передано параметр ?show';
        return;
      }

      // Постер: images/posters/<slug>.jpg
      const posterPath = 'images/posters/' + slug + '.jpg';
      els.poster.src   = posterPath;
      els.poster.alt   = slug.split('/').pop().replace(/-/g,' ');

      // Загружаем файл шоу: data/shows/<slug>.json (если есть)
      // Например: data/shows/shevchenko/za-dvoma-zaytsiamy.json
      let showData = null;
      try{
        const resp = await fetch('data/shows/' + slug + '.json', { cache:'no-store' });
        if (resp.ok) showData = await resp.json();
      }catch(e){ /* пропускаем, будет fallback */ }

      // Заголовок
      const niceTitle = (showData?.title) || els.poster.alt;
      els.title.textContent = niceTitle;

      // Метаданные
      const theatreFromSlug = slug.split('/')[0];
      const theatreNameMap = {
        'shevchenko': 'Театр ім. Т.Г. Шевченка',
        'opera': 'Дніпровський театр опери та балету',
        'filarmonia': 'Дніпропетровська філармонія',
        'academia': 'Академія Руху'
      };
      const stageMap = { big:'Велика сцена', small:'Мала сцена' };
      const theatre = theatreNameMap[theatreFromSlug] || '';
      const stage   = showData?.stage ? (stageMap[showData.stage] || showData.stage) : '';

      els.meta.textContent = [theatre, stage].filter(Boolean).join(' • ');

      // Описание:
      // 1) если есть в JSON: showData.description
      // 2) иначе — для "За двома зайцями" даём твой текст как fallback
      let description = showData?.description || '';
      const isZaDvoma = slug.endsWith('za-dvoma-zaytsiamy');
      if (!description && isZaDvoma){
        description = `
          <p><strong>«За двома зайцями»</strong></p>
          <p>Хореографічна композиція за однойменною п’єсою М. Старицького</p>
          <p>Режисер і балетмейстер-постановник — заслужена артистка України Т. Брисіна</p>
          <p>Тривалість — 70 хвилин</p>
          <p>Усім відомі любовні пригоди київського цирульника Свирида Голохвостого — хвалька, піжона і невдахи. П’єса М. Старицького мала численні режисерські версії в театрі і кіно. Переказати улюблений сюжет мовою пластики, рухів наважилася головний балетмейстер нашого театру заслужена артистка України Тетяна Брисіна. І комедія заграла новими фарбами! Відвідайте виставу і переконайтеся!</p>
        `;
      }
      els.desc.innerHTML = description || '<p class="meta">Описання буде додано найближчим часом.</p>';

      // Кнопка "Вибрати місця"
      els.toHall.href = 'spectacles/hall.html?show=' + encodeURIComponent(slug);
    })();
  </script>
</body>
</html>
