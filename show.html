<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вистава — Ваш Адмін</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .wrap{display:grid;gap:16px;grid-template-columns:280px 1fr}
    @media (max-width:840px){.wrap{grid-template-columns:1fr}}
    .poster{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#eef2f6}
    .meta{color:#6b7280;font-size:13px}
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="main">
    <a class="meta" href="/afisha.html">← Повернутись до афіші</a>
    <div id="content" class="section">
      Завантаження...
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/scripts/include.js" type="module"></script>
  <script>
    (async function(){
      const box = document.getElementById('content');
      const q = new URLSearchParams(location.search);
      const slug = q.get('show');
      if (!slug){ box.innerHTML = '<div class="meta">Помилка: немає параметра show.</div>'; return; }

      try{
        const r = await fetch('/data/shows/'+slug+'.json', {cache:'no-store'});
        if (!r.ok) throw new Error('HTTP '+r.status);
        const s = await r.json();

        const poster = s.poster ? ('/'+s.poster.replace(/^\/+/,'') ) : '';
        const title  = s.title || 'Вистава';
        const metaLine = [s.city, s.theatre, s.stage].filter(Boolean).join(' • ');
        const desc = s.description || '';

        box.innerHTML = `
          <div class="wrap">
            <div><img class="poster" src="${poster}" alt="${title}" onerror="this.style.display='none'"></div>
            <div>
              <h1 style="margin-top:0">${title}</h1>
              ${metaLine ? `<div class="meta" style="margin-bottom:8px">${metaLine}</div>` : ``}
              ${desc ? `<div class="meta" style="white-space:pre-wrap">${desc}</div>` : ``}
              <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
                <a class="btn" href="/spectacles/hall.html?show=${encodeURIComponent(slug)}">Вибрати місця</a>
                <a class="btn secondary" href="/afisha.html">Повернутись до афіші</a>
              </div>
            </div>
          </div>
        `;
        document.title = title + ' — Ваш Адмін';
      }catch(e){
        console.error(e);
        box.innerHTML = '<div class="meta">Не вдалося завантажити дані про виставу.</div>';
      }
    })();
  </script>
</body>
</html>
